<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101321">
  <title>TRPG Online</title>

  <style>
    :root{
      --bg:#0c0f19;
      --panel:#151a29;
      --panel2:#1b2235;
      --panel3:#101523;
      --line:#293149;
      --text:#eef2ff;
      --muted:#aab3cb;
      --accent:#8b7cff;
      --accent2:#6de1c1;
      --danger:#ff7185;
      --warning:#ffc857;
      --shadow:0 14px 40px rgba(0,0,0,.25);
    }

    *{
      box-sizing:border-box;
    }

    html,body{
      margin:0;
      min-height:100%;
      font-family:
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
      background:
        radial-gradient(
          circle at top,
          #171b2f 0,
          #0c0f19 46%,
          #080a11 100%
        );
      color:var(--text);
    }

    button,
    input,
    select,
    textarea{
      font:inherit;
    }

    button{
      cursor:pointer;
      border:0;
    }

    .hidden{
      display:none !important;
    }

    .muted{
      color:var(--muted);
    }

    .danger-text{
      color:var(--danger);
    }

    .success-text{
      color:var(--accent2);
    }

    /* =========================
       AUTH
    ========================= */

    .auth-shell{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:20px;
    }

    .auth-card{
      width:min(460px,100%);
      background:rgba(21,26,41,.94);
      border:1px solid var(--line);
      border-radius:24px;
      padding:30px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(12px);
    }

    .brand{
      font-size:28px;
      font-weight:800;
      letter-spacing:.02em;
    }

    .brand span{
      color:var(--accent);
    }

    .auth-card h1{
      margin:10px 0 6px;
    }

    .auth-tabs{
      display:grid;
      grid-template-columns:1fr 1fr;
      margin:22px 0 16px;
      background:var(--panel2);
      border-radius:12px;
      padding:4px;
    }

    .tab{
      padding:10px;
      color:var(--muted);
      background:transparent;
      border-radius:8px;
    }

    .tab.active{
      background:var(--accent);
      color:white;
    }

    .field{
      display:grid;
      gap:7px;
      margin:13px 0;
    }

    .field label{
      font-size:13px;
      color:var(--muted);
    }

    .field input,
    .field select,
    .field textarea{
      width:100%;
      padding:12px 14px;
      border:1px solid var(--line);
      background:#0f1421;
      color:var(--text);
      border-radius:12px;
      outline:none;
    }

    .field textarea{
      min-height:100px;
      resize:vertical;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus{
      border-color:var(--accent);
    }

    .btn{
      width:100%;
      padding:13px 16px;
      border-radius:12px;
      background:var(--accent);
      color:white;
      font-weight:700;
    }

    .btn.secondary{
      background:var(--panel2);
      border:1px solid var(--line);
    }

    .btn.ghost{
      background:transparent;
      border:1px solid var(--line);
    }

    .btn.danger{
      background:var(--danger);
      color:#16080c;
    }

    .btn.small{
      width:auto;
      padding:8px 11px;
      font-size:13px;
    }

    .error{
      color:var(--danger);
      font-size:13px;
      margin-top:10px;
      min-height:18px;
    }

    /* =========================
       APP
    ========================= */

    .app{
      display:grid;
      grid-template-rows:64px 1fr;
      min-height:100vh;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 20px;
      border-bottom:1px solid var(--line);
      background:rgba(12,15,25,.88);
      backdrop-filter:blur(14px);
      position:sticky;
      top:0;
      z-index:5;
    }

    .top-left,
    .top-right{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .user-pill{
      color:var(--muted);
    }

    .admin-pill{
      padding:6px 9px;
      border-radius:999px;
      background:#453b86;
      color:white;
      font-size:12px;
      font-weight:700;
    }

    .layout{
      display:grid;
      grid-template-columns:230px minmax(0,1fr);
      min-height:calc(100vh - 64px);
    }

    .sidebar{
      padding:18px;
      border-right:1px solid var(--line);
      background:rgba(16,20,33,.55);
    }

    .nav{
      display:grid;
      gap:8px;
    }

    .nav button{
      padding:12px;
      background:transparent;
      color:var(--muted);
      text-align:left;
      border-radius:10px;
    }

    .nav button:hover,
    .nav button.active{
      background:var(--panel2);
      color:white;
    }

    .nav .admin-nav{
      border:1px solid rgba(139,124,255,.25);
    }

    .content{
      min-width:0;
      padding:18px;
    }

    /* =========================
       CARDS
    ========================= */

    .card{
      background:rgba(21,26,41,.84);
      border:1px solid var(--line);
      border-radius:18px;
      box-shadow:var(--shadow);
    }

    .card.pad{
      padding:16px;
    }

    .card h2,
    .card h3{
      margin:0 0 12px;
    }

    .hero{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:18px;
    }

    .actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .actions .btn{
      width:auto;
      padding:10px 13px;
    }

    .section{
      margin-top:14px;
    }

    .grid2{
      display:grid;
      grid-template-columns:
        minmax(0,1.4fr)
        minmax(280px,1fr);
      gap:14px;
    }

    .stat-grid{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:10px;
    }

    .stat{
      background:var(--panel2);
      border:1px solid var(--line);
      padding:12px;
      border-radius:13px;
    }

    .stat .n{
      font-size:24px;
      font-weight:800;
    }

    /* =========================
       ADMIN
    ========================= */

    .admin-header{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:15px;
      margin-bottom:15px;
    }

    .admin-tabs{
      display:flex;
      gap:8px;
      margin-bottom:15px;
      flex-wrap:wrap;
    }

    .admin-tab{
      width:auto;
      padding:10px 14px;
      background:var(--panel2);
      color:var(--muted);
      border:1px solid var(--line);
      border-radius:10px;
    }

    .admin-tab.active{
      background:var(--accent);
      color:white;
      border-color:var(--accent);
    }

    .character-grid{
      display:grid;
      grid-template-columns:
        repeat(auto-fill,minmax(310px,1fr));
      gap:14px;
    }

    .character-card{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:17px;
      padding:16px;
      transition:.15s ease;
    }

    .character-card:hover{
      border-color:#4c5879;
      transform:translateY(-1px);
    }

    .character-card-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
    }

    .character-avatar{
      width:48px;
      height:48px;
      border-radius:14px;
      display:grid;
      place-items:center;
      background:
        linear-gradient(
          135deg,
          var(--accent),
          #4d62c9
        );
      font-size:21px;
      font-weight:800;
      flex-shrink:0;
    }

    .character-title{
      display:flex;
      gap:10px;
      align-items:center;
    }

    .character-name{
      font-size:19px;
      font-weight:800;
    }

    .character-user{
      font-size:12px;
      color:var(--muted);
      margin-top:2px;
    }

    .badge{
      font-size:11px;
      padding:4px 8px;
      border-radius:999px;
      background:#252d45;
      color:var(--muted);
      white-space:nowrap;
    }

    .badge.admin{
      background:#453b86;
      color:white;
    }

    .badge.player{
      background:#203c38;
      color:#8ee8ce;
    }

    .character-info{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
      margin-top:14px;
    }

    .mini-stat{
      background:var(--panel3);
      border:1px solid #222a40;
      border-radius:10px;
      padding:9px;
    }

    .mini-stat span{
      display:block;
      color:var(--muted);
      font-size:11px;
      margin-bottom:3px;
    }

    .mini-stat strong{
      font-size:16px;
    }

    .character-details{
      margin-top:12px;
      padding-top:12px;
      border-top:1px solid var(--line);
      display:grid;
      gap:7px;
      font-size:13px;
    }

    .character-actions{
      display:flex;
      gap:8px;
      margin-top:14px;
    }

    .character-actions .btn{
      flex:1;
      width:auto;
      padding:9px 10px;
    }

    /* =========================
       USERS
    ========================= */

    .user-list{
      display:grid;
      gap:9px;
    }

    .user-row{
      display:grid;
      grid-template-columns:
        minmax(160px,1fr)
        auto
        auto;
      gap:10px;
      align-items:center;
      padding:12px;
      background:var(--panel3);
      border:1px solid #222a40;
      border-radius:12px;
    }

    /* =========================
       ROOM
    ========================= */

    .room-code{
      font-family:ui-monospace,monospace;
      background:var(--panel2);
      border:1px solid var(--line);
      padding:7px 10px;
      border-radius:10px;
    }

    .member-list{
      display:grid;
      gap:9px;
    }

    .member{
      display:grid;
      grid-template-columns:1fr auto;
      gap:8px;
      align-items:center;
      padding:10px;
      background:var(--panel3);
      border:1px solid #222a40;
      border-radius:12px;
    }

    .online-dot{
      width:8px;
      height:8px;
      border-radius:50%;
      display:inline-block;
      background:#54607a;
    }

    .online-dot.on{
      background:var(--accent2);
      box-shadow:0 0 8px rgba(109,225,193,.6);
    }

    /* =========================
       EVENTS / CHAT
    ========================= */

    .event-list{
      display:grid;
      gap:9px;
      max-height:53vh;
      overflow:auto;
    }

    .event{
      padding:10px 12px;
      background:var(--panel3);
      border:1px solid #222a40;
      border-radius:12px;
    }

    .event .head{
      font-size:12px;
      color:var(--muted);
      margin-bottom:5px;
    }

    .chat{
      display:grid;
      grid-template-rows:1fr auto;
      min-height:400px;
    }

    .chat-log{
      padding:14px;
      overflow:auto;
      display:grid;
      gap:10px;
    }

    .chat-input{
      display:flex;
      gap:8px;
      padding:10px;
      border-top:1px solid var(--line);
    }

    .chat-input input{
      flex:1;
      padding:11px 12px;
      border-radius:11px;
      border:1px solid var(--line);
      background:#0f1421;
      color:var(--text);
    }

    .chat-input button{
      width:auto;
      padding:11px 15px;
    }

    /* =========================
       MODAL
    ========================= */

    .modal{
      position:fixed;
      inset:0;
      background:rgba(3,5,10,.78);
      display:grid;
      place-items:center;
      padding:16px;
      z-index:20;
    }

    .modal-card{
      width:min(720px,100%);
      max-height:90vh;
      overflow:auto;
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:18px;
      padding:18px;
    }

    .modal-actions{
      display:flex;
      gap:8px;
      margin-top:14px;
    }

    .modal-actions .btn{
      width:auto;
      flex:1;
    }

    .edit-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .task-card{
      display:grid;
      gap:12px;
    }

    .task-head{
      display:flex;
      justify-content:space-between;
      gap:14px;
      align-items:flex-start;
    }

    .task-description{
      white-space:pre-wrap;
      line-height:1.7;
    }

    .task-block{
      padding:10px 12px;
      border:1px solid var(--line);
      border-radius:10px;
      background:rgba(255,255,255,.02);
    }

    /* =========================
       MOBILE
    ========================= */

    .mobile-nav{
      display:none;
    }

    .toast{
      position:fixed;
      right:18px;
      bottom:18px;
      background:#171d2d;
      border:1px solid var(--line);
      padding:11px 13px;
      border-radius:12px;
      box-shadow:var(--shadow);
      z-index:30;
    }

    @media(max-width:900px){
      .layout{
        grid-template-columns:190px minmax(0,1fr);
      }

      .character-grid{
        grid-template-columns:
          repeat(auto-fill,minmax(280px,1fr));
      }
    }

    @media(max-width:760px){
      .identity-editor-row,
      .skill-profession-auto-row,
      .profession-auto-skill-row{
        grid-template-columns:1fr !important;
      }

      .app{
        grid-template-rows:58px 1fr 68px;
      }

      .topbar{
        padding:0 12px;
      }

      .brand{
        font-size:20px;
      }

      .user-pill{
        display:none;
      }

      .layout{
        grid-template-columns:1fr;
        min-height:0;
      }

      .sidebar{
        display:none;
      }

      .content{
        padding:11px;
        padding-bottom:78px;
      }

      .hero{
        display:grid;
      }

      .stat-grid{
        grid-template-columns:repeat(2,1fr);
      }

      .grid2{
        grid-template-columns:1fr;
      }

      .character-grid{
        grid-template-columns:1fr;
      }

      .user-row{
        grid-template-columns:1fr;
      }

      .edit-grid{
        grid-template-columns:1fr;
      }

      .mobile-nav{
        position:fixed;
        left:0;
        right:0;
        bottom:0;
        height:68px;
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(0,1fr));
        background:rgba(12,15,25,.97);
        border-top:1px solid var(--line);
        z-index:10;
        padding-bottom:env(safe-area-inset-bottom);
      }

      .mobile-nav button{
        background:transparent;
        color:var(--muted);
        display:grid;
        place-items:center;
        font-size:11px;
        gap:3px;
      }

      .mobile-nav button.active{
        color:white;
      }

      .actions{
        display:grid;
        grid-template-columns:1fr 1fr;
      }

      .actions .btn{
        width:100%;
      }
    }
  
/* Adaptive chat bubbles */
.chat-log {
  min-width: 0;
}
.event {
  height: auto;
  min-height: 0;
  max-width: 100%;
}
.event > div:last-child,
.event {
  overflow-wrap: anywhere;
  word-break: break-word;
  white-space: pre-wrap;
}



/* =========================
   PATCH V3: CHAT / LIBRARIES
========================= */
.chat-log{
  align-content:start;
  min-width:0;
  overflow-x:hidden;
}
.chat-row{
  display:flex;
  width:100%;
  min-width:0;
}
.chat-row.mine{
  justify-content:flex-end;
}
.chat-row.other{
  justify-content:flex-start;
}
.chat-bubble{
  display:inline-block;
  width:fit-content;
  max-width:min(78%, 560px);
  padding:9px 12px;
  border-radius:16px;
  background:var(--panel3);
  border:1px solid #222a40;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  word-break:break-word;
  line-height:1.45;
}
.chat-row.mine .chat-bubble{
  background:#2c3158;
  border-color:#4c5188;
  border-bottom-right-radius:5px;
}
.chat-row.other .chat-bubble{
  border-bottom-left-radius:5px;
}
.chat-meta{
  font-size:11px;
  color:var(--muted);
  margin-bottom:3px;
}
.library-list{
  display:grid;
  gap:10px;
}
.library-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:12px;
  align-items:start;
  padding:12px;
  background:var(--panel3);
  border:1px solid #222a40;
  border-radius:12px;
}
.library-row .actions{
  justify-content:flex-end;
}
.skill-card-inline{
  margin-top:8px;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--panel3);
}
.attribute-editor{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
.attribute-points-box{
  padding:12px;
  border-radius:12px;
  background:var(--panel3);
  border:1px solid var(--line);
  margin:10px 0;
}
.choice-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:8px;
}
.choice-option{
  display:flex;
  align-items:flex-start;
  gap:9px;
  padding:10px;
  background:var(--panel3);
  border:1px solid var(--line);
  border-radius:11px;
}
.choice-option input{
  width:auto !important;
  margin-top:3px;
  flex:0 0 auto;
}
.choice-option span{
  display:grid;
  gap:2px;
}
.choice-option small{
  color:var(--muted);
}
.resource-panel{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  padding:12px;
  border-radius:12px;
  background:var(--panel3);
  border:1px solid var(--line);
}
.resource-value{
  font-size:20px;
  font-weight:800;
}
.resource-panel .actions{
  margin:0;
}
.resource-meta{
  display:grid;
  gap:3px;
  min-width:180px;
}
.resource-bar{
  width:min(360px,100%);
  height:10px;
  border-radius:999px;
  overflow:hidden;
  background:#0b0f19;
  border:1px solid var(--line);
  margin-top:7px;
}
.resource-bar-fill{
  height:100%;
  background:var(--accent);
}
.resource-editor-list{
  display:grid;
  gap:10px;
}
.resource-editor-row{
  padding:12px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--panel3);
}
.resource-editor-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(120px,1fr));
  gap:9px;
}
.resource-editor-flags{
  display:flex;
  flex-wrap:wrap;
  gap:10px 16px;
  margin-top:9px;
}
.resource-editor-flags label{
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--muted);
  font-size:13px;
}
.resource-editor-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  margin-bottom:9px;
}
.summon-card{
  padding:12px;
  background:var(--panel3);
  border:1px solid var(--line);
  border-radius:12px;
}
.summon-card + .summon-card{
  margin-top:8px;
}
@media(max-width:760px){
  .chat-bubble{max-width:88%;}
  .attribute-editor{grid-template-columns:1fr;}
  .library-row{grid-template-columns:1fr;}
  .resource-editor-grid{grid-template-columns:1fr 1fr;}
}
@media(max-width:520px){
  .resource-editor-grid{grid-template-columns:1fr;}
}

</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<div id="auth" class="auth-shell">
  <div class="auth-card">

    <div class="brand">
      TRPG <span>ONLINE</span>
    </div>

    <h1>多人跑團平台</h1>

    <div class="muted">
      玩家可以登入遊玩，DM 可以管理跑團。
    </div>

    <div class="auth-tabs">
      <button
        class="tab active"
        data-auth="login"
      >
        登入
      </button>

      <button
        class="tab"
        data-auth="register"
      >
        註冊
      </button>
    </div>

    <form id="authForm">

      <div class="field">
        <label>帳號</label>
        <input
          id="username"
          required
          autocomplete="username"
          minlength="2"
          maxlength="20"
        >
      </div>

      <div class="field">
        <label>密碼</label>
        <input
          id="password"
          required
          type="password"
          autocomplete="current-password"
          minlength="6"
        >
      </div>

      <button
        class="btn"
        id="authSubmit"
        type="submit"
      >
        登入
      </button>

      <div
        id="authError"
        class="error"
      ></div>

    </form>

  </div>
</div>


<!-- =========================
     APP
========================= -->

<div id="app" class="app hidden">

  <header class="topbar">

    <div class="top-left">

      <div class="brand">
        TRPG <span>ONLINE</span>
      </div>

      <div id="roomTitle">
        全站管理

<script>
/* =========================================================
   STATE
========================================================= */

const state = {
  token: localStorage.getItem('rpg_token'),
  user: null,
  room: null,
  rooms: [],
  myCharacter: null,
  adminCharacters: [],
  adminUsers: [],
  adminRooms: [],
  professions: [],
  skillTemplates: [],
  summonTemplates: [],
  mySummons: [],
  recipes: [],
  shopItems: [],
  tasksPublic: [],
  myTasks: [],
  adminTasks: [],
  online: [],
  view: 'dashboard',
  adminView: 'characters',
  socket: null,
  authMode: 'login'
};


/* =========================================================
   HELPERS
========================================================= */

const $ = selector =>
  document.querySelector(selector);

const $$ = selector =>
  [...document.querySelectorAll(selector)];


function esc(value){
  return String(value ?? '')
    .replace(
      /[&<>"']/g,
      c => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      }[c])
    );
}





const IDENTITY_RANKS=['G','F','E','D','C','B','A','S','SS','SSS'];

function normalizeIdentityEntries(value){
  if(!Array.isArray(value))return [];
  return value.map(item=>{
    if(typeof item==='string'){
      const name=item.trim();
      return name?{name,rank:'G'}:null;
    }
    if(item&&typeof item==='object'){
      const name=String(item.name||item.title||'').trim();
      let rank=String(item.rank||'G').toUpperCase();
      if(!IDENTITY_RANKS.includes(rank))rank='G';
      return name?{...item,name,rank}:null;
    }
    return null;
  }).filter(Boolean).slice(0,10);
}

function identitySummaryHTML(value){
  const list=normalizeIdentityEntries(value);
  if(!list.length)return '未設定';
  return list.map(item=>`${esc(item.name)} <span class="badge">${esc(item.rank)}級</span>`).join('、');
}

function identityEditorRowHTML(item={name:'',rank:'G'}){
  const rank=IDENTITY_RANKS.includes(String(item.rank||'').toUpperCase())?String(item.rank).toUpperCase():'G';
  return `
    <div class="identity-editor-row" style="display:grid;grid-template-columns:minmax(0,1fr) 130px auto;gap:8px;align-items:end;margin-bottom:8px;">
      <div class="field" style="margin:0"><label>名稱</label><input class="identity-name" value="${esc(item.name||'')}" placeholder="例如：虛之大道"></div>
      <div class="field" style="margin:0"><label>等階</label><select class="identity-rank">${IDENTITY_RANKS.map(x=>`<option value="${x}" ${x===rank?'selected':''}>${x}級</option>`).join('')}</select></div>
      <button type="button" class="btn danger small remove-identity-row">移除</button>
    </div>`;
}

function bindIdentityEditor(container){
  if(!container)return;
  container.querySelectorAll('.remove-identity-row').forEach(button=>{
    button.onclick=()=>button.closest('.identity-editor-row')?.remove();
  });
}

function collectIdentityEditor(container){
  if(!container)return [];
  return [...container.querySelectorAll('.identity-editor-row')].map(row=>{
    const name=row.querySelector('.identity-name')?.value.trim()||'';
    const rank=row.querySelector('.identity-rank')?.value||'G';
    return name?{name,rank}:null;
  }).filter(Boolean).slice(0,10);
}

function inventoryDisplayName(item){
  if(typeof item==='string')return item;
  if(item&&typeof item==='object')return String(item.name||item.title||item.item_name||'未命名');
  return String(item||'未命名');
}

function inventoryQuantityValue(item){
  if(item&&typeof item==='object'){
    return Math.max(1,Number(item.quantity??item.qty??item.count)||1);
  }
  return 1;
}

function normalizedInventory(value){
  const list=Array.isArray(value)?value:[];
  const map=new Map();
  for(const raw of list){
    const name=inventoryDisplayName(raw).trim();
    if(!name)continue;
    const key=name.toLocaleLowerCase();
    const quantity=inventoryQuantityValue(raw);
    if(map.has(key))map.get(key).quantity+=quantity;
    else map.set(key,{name,quantity});
  }
  return [...map.values()];
}

function skillData(skill){
  return skill&&skill.data&&typeof skill.data==='object'&&!Array.isArray(skill.data)?skill.data:{};
}

function isCraftSkill(skill){
  return Boolean(skillData(skill).craft_tag);
}

function unlocksGameCoin(skill){
  return Boolean(skillData(skill).unlock_game_coin);
}


function unlocksInventoryExpansion(skill){
  return Boolean(skillData(skill).unlock_inventory_expansion) || String(skill?.name||'').trim()==='玩家背包';
}

function inventorySlotLimitUI(character){
  return Math.max(5,Math.floor(Number(character?.inventory_slots)||5));
}

function inventoryUsedSlotsUI(character){
  return normalizedInventory(character?.inventory).length;
}

function characterHasInventoryExpansion(character){
  return (Array.isArray(character?.skills)?character.skills:[]).some(unlocksInventoryExpansion);
}

function shopItemNeedsNewSlot(character,item){
  if(!item || item.item_type!=='item')return false;
  const name=String(item.name||'').trim().toLocaleLowerCase();
  return !normalizedInventory(character?.inventory).some(entry=>String(entry.name||'').trim().toLocaleLowerCase()===name);
}

function skillProfessionAutoRules(skillId){
  const id=String(skillId||'');
  const rules=[];
  for(const profession of state.professions||[]){
    for(const rule of professionAutoSkillRules(profession)){
      if(String(rule.skill_template_id)===id){
        rules.push({profession_id:Number(profession.id),rank:rule.rank,level:rule.level});
      }
    }
  }
  return rules;
}

function skillProfessionAutoRuleRowHTML(rule={profession_id:0,rank:'G',level:1}){
  return `<div class="skill-profession-auto-row" style="display:grid;grid-template-columns:minmax(180px,1fr) 100px 100px auto;gap:8px;align-items:end;margin-bottom:8px">
    <div class="field" style="margin:0"><label>職業</label><select class="skill-auto-profession">${(state.professions||[]).length?(state.professions||[]).map(p=>`<option value="${p.id}" ${String(p.id)===String(rule.profession_id)?'selected':''}>${esc(p.name)}</option>`).join(''):'<option value="">請先建立職業</option>'}</select></div>
    <div class="field" style="margin:0"><label>等階</label><select class="skill-auto-rank">${PROFESSION_RANKS.map(rank=>`<option value="${rank}" ${rank===rule.rank?'selected':''}>${rank}</option>`).join('')}</select></div>
    <div class="field" style="margin:0"><label>等級</label><select class="skill-auto-level"><option value="1" ${Number(rule.level)===1?'selected':''}>Lv.1</option><option value="2" ${Number(rule.level)===2?'selected':''}>Lv.2</option></select></div>
    <button type="button" class="btn danger small remove-skill-auto-rule">移除</button>
  </div>`;
}

function bindSkillProfessionAutoRows(container){
  if(!container)return;
  container.querySelectorAll('.remove-skill-auto-rule').forEach(button=>button.onclick=()=>button.closest('.skill-profession-auto-row')?.remove());
}

function collectSkillProfessionAutoRules(container){
  return [...(container?.querySelectorAll('.skill-profession-auto-row')||[])].map(row=>({
    profession_id:Number(row.querySelector('.skill-auto-profession')?.value)||0,
    rank:row.querySelector('.skill-auto-rank')?.value||'G',
    level:Number(row.querySelector('.skill-auto-level')?.value)||1
  })).filter(x=>x.profession_id);
}

async function syncSkillProfessionAutoRules(skillId,rules){
  const grouped=new Map();
  for(const rule of rules||[]){
    if(!grouped.has(String(rule.profession_id)))grouped.set(String(rule.profession_id),[]);
    grouped.get(String(rule.profession_id)).push(rule);
  }
  for(const profession of state.professions||[]){
    const existing=professionAutoSkillRules(profession).filter(rule=>String(rule.skill_template_id)!==String(skillId));
    const additions=(grouped.get(String(profession.id))||[]).map(rule=>({rank:rule.rank,level:rule.level,skill_template_id:Number(skillId)}));
    if(additions.length || professionAutoSkillRules(profession).some(rule=>String(rule.skill_template_id)===String(skillId))){
      await api(`/api/admin/professions/${profession.id}`,{method:'PATCH',body:JSON.stringify({auto_skills:[...existing,...additions]})});
    }
  }
}

const PROFESSION_RANKS=IDENTITY_RANKS;

function skillLearnCost(skill){
  const raw=skillData(skill).learn_cost;
  const source=raw&&typeof raw==='object'&&!Array.isArray(raw)?raw:{};
  return {
    mode:source.mode==='cost'?'cost':'reward_only',
    item_name:String(source.item_name||'').trim(),
    item_quantity:Math.max(1,Number(source.item_quantity)||1),
    weird_coins:Math.max(0,Number(source.weird_coins)||0),
    game_coins:Math.max(0,Number(source.game_coins)||0),
    skill_points:Math.max(0,Number(source.skill_points)||0),
    required_profession_id:Math.max(0,Number(source.required_profession_id)||0),
    required_profession_rank:PROFESSION_RANKS.includes(String(source.required_profession_rank||'G').toUpperCase())?String(source.required_profession_rank||'G').toUpperCase():'G',
    required_profession_level:Math.max(1,Math.min(2,Number(source.required_profession_level)||1))
  };
}

function professionById(id){
  return (state.professions||[]).find(item=>String(item.id)===String(id))||null;
}

function professionByName(name){
  return (state.professions||[]).find(item=>item.name===name)||null;
}

function professionIdOptions(selected='',includeNone=true){
  return `${includeNone?'<option value="">不限制職業</option>':''}${(state.professions||[]).map(item=>`<option value="${item.id}" ${String(item.id)===String(selected)?'selected':''}>${esc(item.name)} · ${esc(item.rank||'G')}</option>`).join('')}`;
}

function skillLearnCostText(skill){
  const cost=skillLearnCost(skill);
  if(cost.mode!=='cost') return '只能由職業升級、任務獎勵或 DM 授予取得';
  const parts=[];
  if(cost.item_name)parts.push(`${cost.item_name} ×${cost.item_quantity}`);
  if(cost.weird_coins>0)parts.push(`詭幣 ${cost.weird_coins}`);
  if(cost.game_coins>0)parts.push(`遊戲幣 ${cost.game_coins}`);
  if(cost.skill_points>0)parts.push(`技能點 ${cost.skill_points}`);
  const profession=professionById(cost.required_profession_id);
  if(profession)parts.push(`需要 ${profession.name} ${cost.required_profession_rank} Lv.${cost.required_profession_level}`);
  return parts.length?parts.join(' + '):'尚未設定代價（不能自行取得）';
}

function skillCanManualLearn(skill){
  const cost=skillLearnCost(skill);
  return cost.mode==='cost'&&Boolean(cost.item_name||cost.weird_coins>0||cost.game_coins>0||cost.skill_points>0);
}

function professionAutoSkillRules(profession){
  const config=profession&&profession.config&&typeof profession.config==='object'&&!Array.isArray(profession.config)?profession.config:{};
  return (Array.isArray(config.auto_skills)?config.auto_skills:[]).map(item=>({
    rank:PROFESSION_RANKS.includes(String(item?.rank||'G').toUpperCase())?String(item.rank||'G').toUpperCase():'G',
    level:Math.max(1,Math.min(2,Number(item?.level)||1)),
    skill_template_id:Math.max(0,Number(item?.skill_template_id)||0)
  })).filter(item=>item.skill_template_id);
}

function professionAutoSkillRowHTML(rule={rank:'G',level:1,skill_template_id:0}){
  const skills=state.skillTemplates||[];
  return `<div class="profession-auto-skill-row" style="display:grid;grid-template-columns:120px 110px minmax(0,1fr) auto;gap:8px;align-items:end;margin-bottom:8px">
    <div class="field" style="margin:0"><label>等階</label><select class="profession-auto-rank">${PROFESSION_RANKS.map(rank=>`<option value="${rank}" ${rank===rule.rank?'selected':''}>${rank}</option>`).join('')}</select></div>
    <div class="field" style="margin:0"><label>職業等級</label><select class="profession-auto-level"><option value="1" ${Number(rule.level)===1?'selected':''}>Lv.1</option><option value="2" ${Number(rule.level)===2?'selected':''}>Lv.2</option></select></div>
    <div class="field" style="margin:0"><label>自動取得技能</label><select class="profession-auto-skill">${skills.length?skills.map(skill=>`<option value="${skill.id}" ${String(skill.id)===String(rule.skill_template_id)?'selected':''}>${esc(skill.name)} · ${esc(skill.category||'一般')}</option>`).join(''):'<option value="">請先建立技能</option>'}</select></div>
    <button type="button" class="btn danger small remove-profession-auto-skill">移除</button>
  </div>`;
}

function bindProfessionAutoSkillRows(container){
  if(!container)return;
  container.querySelectorAll('.remove-profession-auto-skill').forEach(button=>button.onclick=()=>button.closest('.profession-auto-skill-row')?.remove());
}

function collectProfessionAutoSkills(container){
  return [...(container?.querySelectorAll('.profession-auto-skill-row')||[])].map(row=>({
    rank:row.querySelector('.profession-auto-rank')?.value||'G',
    level:Number(row.querySelector('.profession-auto-level')?.value)||1,
    skill_template_id:Number(row.querySelector('.profession-auto-skill')?.value)||0
  })).filter(item=>item.skill_template_id);
}

function professionAutoSkillSummary(profession){
  const rules=professionAutoSkillRules(profession);
  if(!rules.length)return '無';
  return rules.map(rule=>{
    const skill=(state.skillTemplates||[]).find(item=>String(item.id)===String(rule.skill_template_id));
    return `${rule.rank} Lv.${rule.level} → ${skill?skill.name:'技能 #'+rule.skill_template_id}`;
  }).join('、');
}

function professionProgressMap(character){
  const value=character?.profession_progress;
  return value&&typeof value==='object'&&!Array.isArray(value)?value:{};
}

function professionProgressFor(character,profession){
  if(!profession)return null;
  return professionProgressMap(character)[String(profession.id)]||null;
}

function professionProgressForName(character,name){
  return professionProgressFor(character,professionByName(name));
}

function professionDisplay(character,name){
  if(!name||name==='未設定')return '未設定';
  const progress=professionProgressForName(character,name);
  if(!progress)return name;
  return `${name} · ${progress.rank||'G'} Lv.${Number(progress.level)||1}${progress.promotion_ready?'（待升階任務）':''}`;
}

function recipeConfig(recipe){
  return recipe&&recipe.config&&typeof recipe.config==='object'&&!Array.isArray(recipe.config)?recipe.config:{};
}

function recipeOutput(recipe){
  return recipe&&recipe.output&&typeof recipe.output==='object'&&!Array.isArray(recipe.output)?recipe.output:{};
}

function recipeMaterials(recipe){
  return Array.isArray(recipe?.materials)?recipe.materials:[];
}

function recipeRequiredSkill(recipe){
  const id=Number(recipeConfig(recipe).required_skill_template_id)||0;
  return (state.skillTemplates||[]).find(skill=>Number(skill.id)===id)||null;
}

function characterOwnsTemplateSkill(character,templateId){
  return (Array.isArray(character?.skills)?character.skills:[]).some(skill=>String(skill.template_id||'')===String(templateId||''));
}

function professionSpecialResources(
  profession
){
  const config=
    profession &&
    profession.config &&
    typeof profession.config==='object' &&
    !Array.isArray(profession.config)
      ? profession.config
      : {};

  return Array.isArray(config.special_resources)
    ? config.special_resources
    : [];
}

function professionResourceKey(
  profession,
  resource
){
  return `profession:${profession.id}:${resource.id}`;
}

function allProfessionResources(){
  const result=[];

  for(const profession of state.professions||[]){
    for(const resource of professionSpecialResources(profession)){
      result.push({
        profession,
        resource,
        key:professionResourceKey(profession,resource)
      });
    }
  }

  return result;
}

function findProfessionResourceByKey(key){
  return allProfessionResources()
    .find(item=>item.key===String(key||'')) || null;
}

function professionResourceOptions(selectedKey=''){
  const options=allProfessionResources();

  return `
    <option value="">不使用職業特殊資源</option>
    ${options.map(item=>`
      <option
        value="${esc(item.key)}"
        ${String(selectedKey)===String(item.key)?'selected':''}
      >
        ${esc(item.profession.name)}｜${esc(item.resource.name)}
      </option>
    `).join('')}
  `;
}

function skillClassResourceConfig(skill){
  const resources=
    skill &&
    skill.resources &&
    typeof skill.resources==='object' &&
    !Array.isArray(skill.resources)
      ? skill.resources
      : {};

  const effect=resources.class_resource;

  return effect &&
    typeof effect==='object' &&
    !Array.isArray(effect) &&
    effect.key
      ? effect
      : null;
}

function skillResourcePayload(key,operation,amount){
  const safeKey=String(key||'');
  if(!safeKey){
    return {};
  }

  const found=findProfessionResourceByKey(safeKey);

  return {
    class_resource:{
      key:safeKey,
      name:found?.resource?.name||'',
      operation:['spend','gain','set'].includes(operation)?operation:'spend',
      amount:Math.max(0,Math.floor(Number(amount)||0))
    }
  };
}

function skillResourceSummary(skill){
  const effect=skillClassResourceConfig(skill);
  if(!effect)return '';

  const found=findProfessionResourceByKey(effect.key);
  const name=found?.resource?.name||effect.name||'職業資源';
  const op={spend:'消耗',gain:'獲得',set:'設定為'}[effect.operation]||'消耗';
  return `${name}：${op} ${Math.max(0,Number(effect.amount)||0)}`;
}

function professionResourceRowHTML(resource={},prefix='pfres'){
  const id=resource.id||'';
  const name=resource.name||'';
  const min=Number(resource.min??0)||0;
  const max=Number(resource.max??100)||0;
  const initial=Number(resource.initial??0)||0;
  const resetValue=Number(resource.reset_value??initial)||0;
  const roundDelta=Number(resource.round_delta??0)||0;

  return `
    <div class="resource-editor-row" data-resource-id="${esc(id)}">
      <div class="resource-editor-head">
        <b>職業特殊資源</b>
        <button type="button" class="btn danger small remove-profession-resource">移除</button>
      </div>

      <div class="resource-editor-grid">
        <div class="field">
          <label>資源名稱</label>
          <input class="prof-resource-name" value="${esc(name)}" placeholder="例如：鑄造值">
        </div>
        <div class="field">
          <label>初始值</label>
          <input class="prof-resource-initial" type="number" value="${initial}">
        </div>
        <div class="field">
          <label>最小值</label>
          <input class="prof-resource-min" type="number" value="${min}">
        </div>
        <div class="field">
          <label>最大值</label>
          <input class="prof-resource-max" type="number" value="${max}">
        </div>
        <div class="field">
          <label>戰鬥開始重置值</label>
          <input class="prof-resource-reset-value" type="number" value="${resetValue}">
        </div>
        <div class="field">
          <label>每完整回合變化</label>
          <input class="prof-resource-round-delta" type="number" value="${roundDelta}" placeholder="例如：5 或 -5">
        </div>
      </div>

      <div class="resource-editor-flags">
        <label><input class="prof-resource-show-bar" type="checkbox" ${resource.show_bar===false?'':'checked'}> 顯示資源條</label>
        <label><input class="prof-resource-reset" type="checkbox" ${resource.reset_on_battle?'checked':''}> 戰鬥開始時重置</label>
        <label><input class="prof-resource-player-edit" type="checkbox" ${resource.player_editable?'checked':''}> 玩家可手動修改</label>
        <label><input class="prof-resource-dm-edit" type="checkbox" ${resource.dm_editable===false?'':'checked'}> DM 可手動修改</label>
      </div>
    </div>
  `;
}

function bindProfessionResourceEditor(container){
  if(!container)return;

  container.querySelectorAll('.remove-profession-resource')
    .forEach(button=>{
      button.onclick=()=>{
        button.closest('.resource-editor-row')?.remove();
      };
    });
}

function collectProfessionResources(container){
  if(!container)return [];

  return [...container.querySelectorAll('.resource-editor-row')]
    .map((row,index)=>{
      const name=row.querySelector('.prof-resource-name')?.value.trim()||'';
      if(!name)return null;

      return {
        id:row.dataset.resourceId||`resource_${index+1}`,
        name,
        initial:Number(row.querySelector('.prof-resource-initial')?.value)||0,
        min:Number(row.querySelector('.prof-resource-min')?.value)||0,
        max:Number(row.querySelector('.prof-resource-max')?.value)||0,
        reset_on_battle:Boolean(row.querySelector('.prof-resource-reset')?.checked),
        reset_value:Number(row.querySelector('.prof-resource-reset-value')?.value)||0,
        round_delta:Number(row.querySelector('.prof-resource-round-delta')?.value)||0,
        show_bar:Boolean(row.querySelector('.prof-resource-show-bar')?.checked),
        player_editable:Boolean(row.querySelector('.prof-resource-player-edit')?.checked),
        dm_editable:Boolean(row.querySelector('.prof-resource-dm-edit')?.checked)
      };
    })
    .filter(Boolean);
}

function classResourcePanelHTML(resource,adminMode=false,targetUserId=null){
  const min=Number(resource.min)||0;
  const max=Math.max(min,Number(resource.max)||0);
  const current=Math.max(min,Math.min(max,Number(resource.current)||0));
  const range=Math.max(1,max-min);
  const pct=Math.max(0,Math.min(100,((current-min)/range)*100));
  const editable=adminMode?resource.dm_editable:resource.player_editable;

  return `
    <div class="resource-panel" data-resource-key="${esc(resource.key||'')}">
      <div class="resource-meta">
        <div class="muted">${esc(resource.profession_name||'職業')} · 特殊資源</div>
        <div><b>${esc(resource.name||'未命名資源')}</b></div>
        <div class="resource-value">${current} / ${max}</div>
        ${resource.show_bar!==false?`<div class="resource-bar"><div class="resource-bar-fill" style="width:${pct}%"></div></div>`:''}
        ${Number(resource.round_delta)?`<div class="muted">每完整回合 ${Number(resource.round_delta)>0?'+':''}${Number(resource.round_delta)}</div>`:''}
      </div>
      ${editable?`
        <div class="actions">
          <button class="btn ghost small adjust-class-resource" data-key="${esc(resource.key||'')}" data-delta="-10" ${adminMode?`data-admin-user-id="${targetUserId}"`:''}>-10</button>
          <button class="btn ghost small adjust-class-resource" data-key="${esc(resource.key||'')}" data-delta="-1" ${adminMode?`data-admin-user-id="${targetUserId}"`:''}>-1</button>
          <button class="btn secondary small set-class-resource" data-key="${esc(resource.key||'')}" data-name="${esc(resource.name||'職業資源')}" ${adminMode?`data-admin-user-id="${targetUserId}"`:''}>設定</button>
          <button class="btn ghost small adjust-class-resource" data-key="${esc(resource.key||'')}" data-delta="1" ${adminMode?`data-admin-user-id="${targetUserId}"`:''}>+1</button>
          <button class="btn ghost small adjust-class-resource" data-key="${esc(resource.key||'')}" data-delta="10" ${adminMode?`data-admin-user-id="${targetUserId}"`:''}>+10</button>
        </div>
      `:'<div class="muted">由技能或 DM 管理</div>'}
    </div>
  `;
}

function skillSummonTemplateIds(skill){
  const data=
    skill &&
    skill.data &&
    typeof skill.data === 'object' &&
    !Array.isArray(skill.data)
      ? skill.data
      : {};

  return Array.isArray(
    data.summon_template_ids
  )
    ? data.summon_template_ids
        .map(Number)
        .filter(
          id =>
            Number.isInteger(id) &&
            id > 0
        )
    : [];
}

function summonTemplateNameList(skill){
  const ids=
    skillSummonTemplateIds(
      skill

  if(!ids.length){
    return [];

  return ids.map(id=>{
    const template=
      (state.summonTemplates||[])
        .find(
          item =>
            String(item.id) ===
            String(id)

    return template
      ? template.name
      : `已刪除模板 #${id}`;

function toast(message){
  const el = $('#toast');

  el.textContent = message;
  el.classList.remove('hidden');

  clearTimeout(window.__toast);

  window.__toast =
    setTimeout(
      () => el.classList.add('hidden'),
      2600
    );
}


async function api(url, options = {}){

  const response =
    await fetch(
      url,
      {
        ...options,

        headers:{
          'Content-Type':
            'application/json',

          'Authorization':
            `Bearer ${state.token}`,

          ...(options.headers || {})
        }
      }
    );

  const data =
    await response
      .json()
      .catch(
        () => ({})
      );

  if(!response.ok){
    throw new Error(
      data.error ||
      '請求失敗'
    );
  }

  return data;
}

========================================================= */

function showAuth(){

  $('#auth')
    .classList
    .remove('hidden');

  $('#app')
    .classList
    .add('hidden');
}


function showApp(){

  $('#auth')
    .classList
    .add('hidden');

  $('#app')
    .classList
    .remove('hidden');

  $('#userPill').textContent =
    state.user?.username || '';

  const isAdmin =
    Boolean(
      state.user?.is_admin
    );

  $('#adminPill')
    .classList
    .toggle('hidden', !isAdmin);

  $('#adminNav')
    .classList
    .toggle('hidden', !isAdmin);

  $('#mobileAdminNav')
    .classList
    .toggle('hidden', !isAdmin);

  connectSocket();

  render();
}


async function boot(){

  if(!state.token){
    showAuth();
    return;
  }

  try{

    const me =
      await api('/api/me');

    state.user =
      me.user;

    await loadMyCharacter();
    await Promise.all([
      loadProfessions(),
      loadSkillTemplates(),
      loadSummonTemplates(),
      loadMySummons(),
      loadRecipes(),
      loadShop(),
      loadPublicTasks(),
      loadMyTasks()
    ]);

    if(state.user.is_admin){

      await loadAdminData();

      state.view =
        'admin';

    }

    showApp();

  }catch(error){

    console.error(error);

    localStorage.removeItem(
      'rpg_token'
    );

    state.token = null;

    showAuth();
  }
}


async function submitAuth(event){

  event.preventDefault();

  $('#authError').textContent =
    '';

  const username =
    $('#username')
      .value
      .trim();

  const password =
    $('#password')
      .value;

  try{

    const endpoint =
      state.authMode === 'login'
        ? '/api/auth/login'
        : '/api/auth/register';

    const response =
      await fetch(
        endpoint,
        {
          method:'POST',

          headers:{
            'Content-Type':
              'application/json'
          },

          body:
            JSON.stringify({
              username,
              password
            })
        }
      );

    const data =
      await response
        .json()
        .catch(
          () => ({})
        );

    if(!response.ok){
      throw new Error(
        data.error ||
        '操作失敗'
      );
    }

    state.token =
      data.token;

    state.user =
      data.user;

    localStorage.setItem(
      'rpg_token',
      state.token
    );

    await loadMyCharacter();
    await Promise.all([loadProfessions(), loadSkillTemplates(), loadSummonTemplates(), loadMySummons(), loadRecipes(), loadShop()]);

    if(state.user.is_admin){

      await loadAdminData();

      state.view =
        'admin';

    }else{

      state.view =
        'dashboard';

    }

    showApp();

  }catch(error){

    $('#authError')
      .textContent =
        error.message;
  }
}


/* =========================================================
   SOCKET
========================================================= */

function connectSocket(){

  if(state.socket){
    state.socket.disconnect();
  }

  state.socket =
    io({
      auth:{
        token:
          state.token
      }
    });

  state.socket.on(
    'connect_error',
    () => toast('即時連線失敗')
  );

  state.socket.on(
    'presence',
    data => {

      state.online =
        data.online || [];

      render();
    }
  );

  state.socket.on(
    'room:snapshot',
    snapshot => {

      state.room =
        snapshot;

      render();
    }
  );

  state.socket.on(
    'error:message',
    message => {
      toast(message);
    }
  );
}

function taskRewardHTML(rewards){
  const r=rewards||{};
  const parts=[];
  if(Number(r.experience)>0)parts.push(`經驗 +${Number(r.experience)}`);
  if(Number(r.attribute_points)>0)parts.push(`屬性點 +${Number(r.attribute_points)}`);
  if(Number(r.skill_points)>0)parts.push(`技能點 +${Number(r.skill_points)}`);
  if(Number(r.weird_coins)>0)parts.push(`詭幣 +${Number(r.weird_coins)}`);
  if(Number(r.game_coins)>0)parts.push(`遊戲幣 +${Number(r.game_coins)}`);
  if(Array.isArray(r.inventory))for(const item of r.inventory){if(item?.name)parts.push(`${item.name} ×${Number(item.quantity)||1}`);}
  if(Array.isArray(r.equipment))for(const item of r.equipment){parts.push(`裝備：${inventoryDisplayName(item)}`);}
  if(Array.isArray(r.weapons))for(const item of r.weapons){parts.push(`武器：${inventoryDisplayName(item)}`);}
  if(Array.isArray(r.skill_template_ids))for(const id of r.skill_template_ids){const skill=(state.skillTemplates||[]).find(x=>String(x.id)===String(id));parts.push(`技能：${skill?skill.name:'#'+id}`);}
  if(Array.isArray(r.profession_grants))for(const grant of r.profession_grants){const profession=professionById(grant?.profession_id);parts.push(`${grant?.role==='main'?'主職業':'副職業'}：${profession?profession.name:'#'+grant?.profession_id}`);}
  if(Array.isArray(r.profession_level_ups))for(const id of r.profession_level_ups){const profession=professionById(id);parts.push(`職業升級：${profession?profession.name:'#'+id} +1`);}
  return parts.length?parts.map(esc).join(' · '):'無預設獎勵';
}

  return [...(container?.querySelectorAll('.recipe-material-row')||[])].map(row=>({name:row.querySelector('.recipe-material-name')?.value.trim()||'',quantity:Math.max(1,Number(row.querySelector('.recipe-material-qty')?.value)||1)})).filter(item=>item.name);

function professionOptions(category, selected=''){
  const items=(state.professions||[]).filter(item=>item.category===category||item.category==='both');
  const hasSelected=items.some(item=>item.name===selected);
  const legacy=selected && selected!=='未設定' && !hasSelected
    ? `<option value="${esc(selected)}" selected>${esc(selected)}（舊資料）</option>`
    : '';
  return `<option value="">未設定</option>`+legacy+items.map(item=>`<option value="${esc(item.name)}" ${item.name===selected?'selected':''}>${esc(item.name)} · ${esc(item.rank||'G')}</option>`).join('');
}

function openMyCharacterEditor(){
  const character=state.myCharacter;
  if(!character){toast('找不到角色卡');return;}

  const fifth=character.faction==='西國'?'faith':'great_way';
  const identityField=character.faction==='西國'?'faiths':'great_ways';
  const identityLabel=character.faction==='西國'?'信仰之神':'所行之道';
  const fifthLabel=character.faction==='西國'?'信仰':'大道';
  const fields=['agility','strength','constitution','spirit',fifth];
  const totalPool=fields.reduce((sum,field)=>sum+(Number(character[field])||0),0)+(Number(character.attribute_points)||0);
  const subs=Array.isArray(character.sub_classes)?character.sub_classes:[];

  $('#modalTitle').textContent='修改我的角色卡';
  $('#modalBody').innerHTML=`
    <div class="field"><label>角色名稱</label><input id="my_name" value="${esc(character.name)}"></div>
    <div class="edit-grid">
      <div class="field"><label>主職業</label><select id="my_main_class">${professionOptions('main',character.main_class)}</select></div>
      ${[0,1,2].map(i=>`<div class="field"><label>副職業 ${i+1}</label><select id="my_sub_${i}">${professionOptions('sub',subs[i]||'')}</select></div>`).join('')}
    </div>
    <div class="field"><label>${identityLabel}（每行一個）</label><textarea id="my_identity" rows="4">${esc(normalizeIdentityEntries(character[identityField]).map(item=>item.name).join('\n'))}</textarea><div class="muted">等階由 DM 管理；新增的${identityLabel}預設為 G 級。</div></div>
    <div class="attribute-points-box">總可分配點數：<b>${totalPool}</b> · 剩餘：<b id="my_remaining">${Number(character.attribute_points)||0}</b></div>
    <div class="attribute-editor">
      <div class="field"><label>力量</label><input class="my-attr" id="my_strength" type="number" min="0" value="${Number(character.strength)||0}"></div>
      <div class="field"><label>敏捷</label><input class="my-attr" id="my_agility" type="number" min="0" value="${Number(character.agility)||0}"></div>
      <div class="field"><label>體質</label><input class="my-attr" id="my_constitution" type="number" min="0" value="${Number(character.constitution)||0}"></div>
      <div class="field"><label>精神</label><input class="my-attr" id="my_spirit" type="number" min="0" value="${Number(character.spirit)||0}"></div>
      <div class="field"><label>${fifthLabel}</label><input class="my-attr" id="my_fifth" type="number" min="0" value="${Number(character[fifth])||0}"></div>
    </div>
    <div id="myEditError" class="error"></div>`;

  const calc=()=>{
    const used=['#my_strength','#my_agility','#my_constitution','#my_spirit','#my_fifth'].reduce((sum,id)=>sum+Math.max(0,Number($(id).value)||0),0);
    const remaining=totalPool-used;
    $('#my_remaining').textContent=String(remaining);
    $('#my_remaining').className=remaining<0?'danger-text':'';
    return remaining;
  };
  $$('.my-attr').forEach(input=>input.oninput=calc);
  $('#modal').classList.remove('hidden');
  $('#modalCancel').onclick=closeModal;
  $('#modalOk').onclick=async()=>{
    try{
      const remaining=calc();
      if(remaining<0) throw new Error('分配的屬性超過可用總點數');
      const subClasses=[0,1,2].map(i=>$(`#my_sub_${i}`).value).filter(Boolean);
      const oldIdentity=normalizeIdentityEntries(character[identityField]);
      const oldRankByName=new Map(oldIdentity.map(item=>[item.name,item.rank]));
      const identity=$('#my_identity').value.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,10).map(name=>({name,rank:oldRankByName.get(name)||'G'}));
      const body={
        name:$('#my_name').value,
        main_class:$('#my_main_class').value||'未設定',
        sub_classes:subClasses,
        strength:Number($('#my_strength').value)||0,
        agility:Number($('#my_agility').value)||0,
        constitution:Number($('#my_constitution').value)||0,
        spirit:Number($('#my_spirit').value)||0,
        [fifth]:Number($('#my_fifth').value)||0,
        attribute_points:remaining,
        [identityField]:identity
      };
      const data=await api('/api/character',{method:'PATCH',body:JSON.stringify(body)});
      state.myCharacter=data.character;
      closeModal();render();toast('角色卡已更新');
    }catch(error){$('#myEditError').textContent=error.message;}
  };
}

function openSkillPicker(){
  const skills=(state.skillTemplates||[]).filter(skill=>skillCanManualLearn(skill));
  if(!skills.length){toast('目前沒有可直接學習的技能。技能必須由 DM 設定學習代價，或透過職業／任務取得。');return;}
  const categories=[...new Set(skills.map(x=>x.category||'一般'))];
  $('#modalTitle').textContent='學習技能';
  $('#modalBody').innerHTML=`<div class="muted">技能不能免費取得。確認後會直接扣除技能書／道具或貨幣。</div><div class="field"><label>技能類別</label><select id="pickSkillCategory">${categories.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select></div><div class="field"><label>技能</label><select id="pickSkill"></select></div><div id="pickSkillPreview" class="skill-card-inline"></div><div id="pickSkillError" class="error"></div>`;
  const refresh=()=>{const category=$('#pickSkillCategory').value;const list=skills.filter(x=>(x.category||'一般')===category);$('#pickSkill').innerHTML=list.map(x=>`<option value="${x.id}">${esc(x.name)} · Lv.${Number(x.level)||1}</option>`).join('');const show=()=>{const skill=skills.find(x=>String(x.id)===String($('#pickSkill').value));const summonNames=skill&&skill.summon_tag?summonTemplateNameList(skill):[];$('#pickSkillPreview').innerHTML=skill?`<b>${esc(skill.name)}</b><div class="muted">${esc(skill.skill_type||'active')} · ${esc(skill.category||'一般')}</div><div class="muted"><b>學習代價：</b>${esc(skillLearnCostText(skill))}</div>${skill.check_name?`<div class="muted">判定：${esc(skill.check_name)}</div>`:''}${skill.damage_formula?`<div class="muted">傷害：${esc(skill.damage_formula)}</div>`:''}${skill.description?`<div class="muted">${esc(skill.description)}</div>`:''}${skill.summon_tag?`<div class="muted">可召喚：${summonNames.length?summonNames.map(esc).join('、'):'尚未設定'}</div>`:''}`:'沒有技能';};$('#pickSkill').onchange=show;show();};
  $('#pickSkillCategory').onchange=refresh;refresh();$('#modal').classList.remove('hidden');$('#modalCancel').onclick=closeModal;$('#modalOk').onclick=async()=>{try{const templateId=Number($('#pickSkill').value);if(!templateId)throw new Error('請選擇技能');const data=await api('/api/character/skills/from-template',{method:'POST',body:JSON.stringify({template_id:templateId})});state.myCharacter=data.character;closeModal();render();toast('技能已取得，學習代價已扣除');}catch(error){$('#pickSkillError').textContent=error.message;}};
}

function openSkillTemplateEditor(skill){
  if(!skill){
    toast('找不到技能');
    return;
  }

  const selectedIds=
    skillSummonTemplateIds(
      skill
    );

  const learnCost=skillLearnCost(skill);

  $('#modalTitle').textContent=
    `修改技能：${skill.name}`;

  $('#modalBody').innerHTML=`

      <div class="field">
        <label>技能名稱</label>
        <input id="editSkillName" value="${esc(skill.name||'')}">

      <div class="field">
        <label>類別</label>
        <input id="editSkillCategory" value="${esc(skill.category||'一般')}">
      </div>

      <div class="field">
        <label>技能類型</label>
        <select id="editSkillType">
          <option value="active" ${skill.skill_type==='active'?'selected':''}>主動</option>
          <option value="passive" ${skill.skill_type==='passive'?'selected':''}>被動</option>
          <option value="reaction" ${skill.skill_type==='reaction'?'selected':''}>反應</option>
          <option value="special" ${skill.skill_type==='special'?'selected':''}>特殊</option>
        </select>
      </div>

      <div class="field">
        <label>預設等級</label>
        <input id="editSkillLevel" type="number" min="1" value="${Number(skill.level)||1}">
      </div>

      <div class="field">
        <label>判定</label>
        <input id="editSkillCheck" value="${esc(skill.check_name||'')}">
      </div>

      <div class="field">
        <label>傷害判定</label>
        <input id="editSkillDamage" value="${esc(skill.damage_formula||'')}">
      </div>

      <div class="field">
        <label>職業特殊資源</label>
        <select id="editSkillResourceKey">${professionResourceOptions(skillClassResourceConfig(skill)?.key||'')}</select>
      </div>

        <select id="editSkillResourceOperation">
          <option value="spend" ${skillClassResourceConfig(skill)?.operation==='spend'?'selected':''}>消耗</option>
          <option value="gain" ${skillClassResourceConfig(skill)?.operation==='gain'?'selected':''}>獲得</option>
          <option value="set" ${skillClassResourceConfig(skill)?.operation==='set'?'selected':''}>設定為</option>

        <label>資源數值</label>
        <input id="editSkillResourceAmount" type="number" min="0" value="${Math.max(0,Number(skillClassResourceConfig(skill)?.amount)||0)}">
      </div>

      <div class="field">
        <label>額外技能標籤</label>
        <input id="editSkillExtraTag" value="${esc(skill.extra_tag||'')}">
      </div>

      <div class="field">
        <label class="choice-option" style="padding:9px">
          <input id="editSkillCraft" type="checkbox" ${isCraftSkill(skill)?'checked':''}>
          <span><b>這是製作技能</b><small>可作為合成配方的解鎖條件</small></span>

    .classList
    .remove('hidden');

    closeModal;

          $$('#editSkillSummonOptions .skill-summon-template:checked')
            .map(
              input =>
                Number(input.value)
            );

        const data=
          await api(
            `/api/admin/skill-templates/${skill.id}`,
            {
              method:'PATCH',
              body:
                JSON.stringify({
                  name:
                    $('#editSkillName').value,

                  skill_type:
                    $('#editSkillType').value,
                  level:
                    Number(

                  check_name:
                    $('#editSkillCheck').value,
                  damage_formula:
                    $('#editSkillDamage').value,
                  extra_tag:
                    $('#editSkillExtraTag').value,
                  resources:
                    skillResourcePayload(
                      $('#editSkillResourceKey').value,
                      $('#editSkillResourceOperation').value,
                      $('#editSkillResourceAmount').value
                    ),
                  summon_tag:
                    $('#editSkillSummon').checked,
                  summon_template_ids:
                    summonTemplateIds,
                  learn_cost:{
                    mode:$('#editSkillLearnMode').value,
                    item_name:$('#editSkillLearnItem').value,
                    item_quantity:Number($('#editSkillLearnItemQty').value)||1,
                    weird_coins:Number($('#editSkillLearnWeird').value)||0,
                    game_coins:Number($('#editSkillLearnGame').value)||0,
                    skill_points:Number($('#editSkillLearnSkillPoints').value)||0,
                    required_profession_id:Number($('#editSkillLearnProfession').value)||0,
                    required_profession_rank:$('#editSkillLearnRank').value,
                    required_profession_level:Number($('#editSkillLearnLevel').value)||1
                  },
                  data:{
                    craft_tag:$('#editSkillCraft').checked,
                    unlock_game_coin:$('#editSkillUnlockGameCoin').checked,
                    unlock_inventory_expansion:$('#editSkillUnlockInventoryExpansion').checked
                  },
                  description:
                    $('#editSkillDescription').value
                })
            }
          );

        await syncSkillProfessionAutoRules(skill.id,collectSkillProfessionAutoRules(editAutoContainer));
        await Promise.all([
          loadSkillTemplates(),
          loadProfessions(),
          loadMyCharacter(),
          loadAdminCharacters()
        ]);

        closeModal();
        render();

        toast(
          `技能已修改，已同步 ${Number(data.updated_character_count)||0} 張角色卡`
        );
      }catch(error){
        $('#editSkillError').textContent=
          error.message;
      }
    };
}

function openSummonPicker(skill){
  const allowedIds=
    skillSummonTemplateIds(
      skill
    );

  const templates=
    allowedIds
      .map(id=>
        (state.summonTemplates||[])
          .find(
            item =>
              String(item.id) ===
              String(id)
          )
      )
      .filter(Boolean);

  if(!templates.length){
    toast('這個召喚技能還沒有設定可召喚的召喚物，請 DM 修改技能');
    return;
  }

  $('#modalTitle').textContent=
    `使用召喚技能：${skill.name}`;

  $('#modalBody').innerHTML=`
    <div class="field">
      <label>要召喚什麼？</label>
      <select id="summonChoice">
        ${templates.map(template=>`
          <option value="${template.id}">
            ${esc(template.name)}
          </option>
        `).join('')}
      </select>
    </div>

    <div id="summonPreview" class="skill-card-inline"></div>

    <div class="muted">
      ${
        state.room?.room
          ? `召喚後會出現在目前房間「${esc(state.room.room.name)}」。`
          : '目前沒有進入房間，召喚物會先存在於你的角色名下。'
      }
    </div>

    <div id="summonError" class="error"></div>
  `;

  const refresh=()=>{
    const template=
      templates.find(
        item =>
          String(item.id) ===
          String(
            $('#summonChoice').value
          )
      );

    if(!template){
      $('#summonPreview').innerHTML=
        '';
      return;
    }

    const controlLabel={
      manual:'手動',
      assist:'半自動',
      auto:'全自動'
    };

    $('#summonPreview').innerHTML=`
      <b>${esc(template.name)}</b>
      <div class="muted">
        控制：${controlLabel[template.control_mode]||'手動'}
        · AI Lv.${Number(template.self_ai_level)||0}
        · 忠誠 ${Number(template.loyalty)||0}
      </div>
      ${
        template.description
          ? `<div class="muted">${esc(template.description)}</div>`
          : ''
      }
    `;
  };

  $('#summonChoice').onchange=
    refresh;

  refresh();

  $('#modal')
    .classList
    .remove('hidden');

  $('#modalCancel').onclick=
    closeModal;

  $('#modalOk').onclick=
    async()=>{
      try{
        const templateId=
          Number(
            $('#summonChoice').value
          );

        const data=
          await api(
            `/api/character/skills/${encodeURIComponent(skill.id)}/summon`,
            {
              method:'POST',
              body:
                JSON.stringify({
                  template_id:
                    templateId,
                  room_id:
                    state.room?.room?.id ||
                    null
                })
            }
          );

        state.mySummons=
          data.summons ||
          state.mySummons;

        if(data.room){
          state.room=
            data.room;
        }

        closeModal();
        render();

        toast(
          `已召喚 ${data.summon?.name||'召喚物'}`
        );
      }catch(error){
        $('#summonError').textContent=
          error.message;
      }
    };
}

        spirit:Number($('#edit_spirit').value),
        attribute_points:Number($('#edit_attribute_points').value),
        experience:Number($('#edit_experience').value),
        skill_points:Number($('#edit_skill_points').value),
        weird_coins:Number($('#edit_weird_coins').value),
        game_coins:Number($('#edit_game_coins').value),

        inventory:editItems,
        sub_classes:subClasses,
        skills:editSkills,
        equipment:editEquipment,
        weapons:editWeapons

      await api(`/api/admin/characters/${character.id}`,{method:'PATCH',body:JSON.stringify(body)});
      await Promise.all([loadAdminCharacters(),loadMyCharacter()]);
      closeModal();render();toast('角色卡已修改');
    }catch(error){$('#editError').textContent=error.message;}
  };
}

/* =========================================================
   DELETE ACCOUNT
========================================================= */

async function deleteUser(
  userId,
  username
){

  if(
    String(userId) ===
    String(state.user.id)
  ){

    toast(
      '不能刪除目前登入中的 DM'
    );

    return;
  }

  const confirmed =
    window.confirm(
      `確定要刪除帳號「${username}」嗎？\n\n此操作會刪除該玩家的永久角色卡，而且無法復原。`
    );

  if(!confirmed){
    return;
  }

  try{

    await api(
      `/api/admin/users/${userId}`,
      {
        method:'DELETE'
      }
    );

    await loadAdminData();

    render();

    toast(
      `帳號「${username}」已刪除`
    );

  }catch(error){

    toast(
      error.message
    );
  }
}

function shopHTML(){
  const character=state.myCharacter;
  if(!character)return `<div class="card pad"><h2>詭源商店</h2><div class="muted">你目前沒有角色卡。</div></div>`;
  const items=(state.shopItems||[]).filter(item=>item.active!==false);
  const used=inventoryUsedSlotsUI(character);
  const limit=inventorySlotLimitUI(character);
  return `
    <div class="card pad hero">
      <div><div class="muted">WEIRD SOURCE SHOP</div><h2>🕯️ 詭源商店</h2><div class="muted">使用詭幣購買商品。普通道具會佔用物品欄，相同道具可疊加。</div></div>
      <div class="actions"><span class="badge">🪙 詭幣 ${Number(character.weird_coins)||0}</span><span class="badge">🎒 ${used}/${limit} 格</span><button id="refreshShop" class="btn secondary small">↻ 重新整理</button></div>
    </div>
    <div class="character-grid section">${items.length?items.map(item=>{
      const price=Math.max(0,Number(item.price_weird)||0);
      const quantity=Math.max(1,Number(item.quantity)||1);
      const needsSlot=shopItemNeedsNewSlot(character,item);
      const full=needsSlot&&used>=limit;
      const poor=(Number(character.weird_coins)||0)<price;
      const locked=full||poor;
      return `<article class="character-card"><div class="character-card-head"><div><div class="character-name">${esc(item.name)}</div><div class="character-user">${item.item_type==='weapon'?'武器':item.item_type==='equipment'?'裝備':'道具'} × ${quantity}</div></div><span class="badge">🪙 ${price}</span></div><div class="character-details">${item.description?`<div>${esc(item.description)}</div>`:''}${full?'<div class="danger-text">物品欄已滿</div>':''}${poor?'<div class="danger-text">詭幣不足</div>':''}</div><div class="character-actions"><button class="btn buy-shop-item" data-id="${item.id}" ${locked?'disabled':''}>${locked?'目前無法購買':'購買'}</button></div></article>`;
    }).join(''):'<div class="card pad"><div class="muted">目前沒有商品。</div></div>'}</div>`;
}

  const inventory=normalizedInventory(character.inventory);
  return `

    <div class="grid2 section"><div class="card pad"><h3>材料／道具庫</h3><div class="user-list section">${inventory.length?inventory.map(item=>`<div class="user-row"><div><b>${esc(item.name)}</b></div><span class="badge">× ${item.quantity}</span><div></div></div>`).join(''):'<div class="muted">目前沒有材料。</div>'}</div></div><div class="card pad"><h3>遊戲幣解鎖</h3><div class="muted">${character.game_coin_unlocked?'✅ 已解鎖。現在可以取得、持有與消耗遊戲幣。':'🔒 尚未解鎖。DM 可以在技能資料庫中把某個技能設定為「取得後解鎖遊戲幣」。'}</div></div></div>
    <div class="card pad section"><h3>可用配方</h3><div class="character-grid section">${recipes.length?recipes.map(recipe=>{const cfg=recipeConfig(recipe);const out=recipeOutput(recipe);const mats=recipeMaterials(recipe);const required=recipeRequiredSkill(recipe);const skillLocked=cfg.access==='skill'&&!characterOwnsTemplateSkill(character,cfg.required_skill_template_id);const gameLocked=cfg.currency_type==='game'&&!character.game_coin_unlocked;const materialMissing=mats.some(m=>{const have=inventory.find(i=>i.name.toLocaleLowerCase()===String(m.name||'').toLocaleLowerCase())?.quantity||0;return have<Math.max(1,Number(m.quantity)||1)});const cost=Math.max(0,Number(cfg.currency_cost)||0);const coinMissing=cfg.currency_type==='weird'?(Number(character.weird_coins)||0)<cost:cfg.currency_type==='game'?(Number(character.game_coins)||0)<cost:false;const inventoryFull=out.type==='item'&&!inventory.some(i=>i.name.toLocaleLowerCase()===String(out.name||recipe.name||'').toLocaleLowerCase())&&inventory.length>=inventorySlotLimitUI(character);const locked=skillLocked||gameLocked||materialMissing||coinMissing||inventoryFull;return `<article class="character-card"><div class="character-card-head"><div><div class="character-name">${esc(recipe.name)}</div><div class="character-user">成品：${esc(out.name||recipe.name)} × ${Math.max(1,Number(out.quantity)||1)}</div></div><span class="badge">${out.type==='weapon'?'武器':out.type==='equipment'?'裝備':'道具'}</span></div><div class="character-details"><div><span class="muted">材料：</span>${mats.length?mats.map(m=>`${esc(m.name)} × ${Math.max(1,Number(m.quantity)||1)}`).join('、'):'無'}</div><div><span class="muted">解鎖：</span>${cfg.access==='skill'?(required?esc(required.name):'需要製作技能'):'所有人'}</div><div><span class="muted">成本：</span>${cfg.currency_type==='game'?`遊戲幣 ${cost}`:cfg.currency_type==='weird'?`詭幣 ${cost}`:'無'}</div>${recipe.description?`<div>${esc(recipe.description)}</div>`:''}${skillLocked?'<div class="danger-text">缺少必要製作技能</div>':''}${gameLocked?'<div class="danger-text">遊戲幣尚未解鎖</div>':''}${materialMissing?'<div class="danger-text">材料不足</div>':''}${coinMissing?'<div class="danger-text">貨幣不足</div>':''}${inventoryFull?'<div class="danger-text">物品欄已滿</div>':''}</div><div class="character-actions"><button class="btn craft-recipe" data-id="${recipe.id}" ${locked?'disabled':''}>${locked?'目前無法合成':'合成'}</button></div></article>`}).join(''):'<div class="muted">DM 還沒有建立任何配方。</div>'}</div></div>`;
}
