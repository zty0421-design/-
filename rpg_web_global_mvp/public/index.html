  if(escapeCombat)escapeCombat.onclick=async()=>{try{const data=await api(`/api/rooms/${state.room.room.id}/combat/escape`,{method:'POST',body:'{}'});state.room=data.room;await Promise.all([loadRoomWorld(),loadMyCharacter(),loadMySummons()]);render();toast(data.success?'成功脫離戰鬥':'脫離失敗，消耗一次行動');}catch(error){toast(error.message);}};

  const passCombatAction=$('#passCombatAction');
  if(passCombatAction){
    passCombatAction.onclick=async()=>{
      try{
        const data=await api(`/api/rooms/${state.room.room.id}/combat/pass`,{method:'POST'});
        if(data.room)state.room=data.room;
        if(!CPP_CORE_PREVIEW)await loadRoomWorld();
        render();
      }catch(error){toast(error.message);}
    };
  }

  const aiCombatAct=$('#aiCombatAct');
  if(aiCombatAct)aiCombatAct.onclick=async()=>{try{const data=await api(`/api/admin/rooms/${state.room.room.id}/combat/ai-act`,{method:'POST',body:'{}'});state.room=data.room;await Promise.all([loadRoomWorld(),loadMyCharacter()]);render();const r=data.combat;toast(r?(r.hit?`${r.attacker.name} 命中 ${r.target.name}，造成 ${r.damage} 傷害`:`${r.attacker?.name||'AI'} 攻擊未命中`):(data.ai_result?.charging?'AI 正在蓄力':`${data.ai_result?.actor?.name||'AI'} 已完成行動`));}catch(error){toast(error.message);}};

  $$('.revive-combat-target').forEach(button=>{button.onclick=async()=>{try{const data=await api(`/api/admin/rooms/${state.room.room.id}/combat/revive`,{method:'POST',body:JSON.stringify({target_type:button.dataset.type,target_id:Number(button.dataset.id),hp_percent:30})});state.room=data.room;await Promise.all([loadRoomWorld(),loadMyCharacter()]);render();toast('目標已復甦');}catch(error){toast(error.message);}};});

  const chatForm =
    $('#chatForm');

  if(chatForm){

    chatForm.onsubmit =
      event => {

        event.preventDefault();

        const input =
          $('#chatInput');

        const text =
          input.value.trim();

        if(
          text &&
          state.socket &&
          state.room
        ){

          state.socket.emit(
            'chat:send',
            {
              roomId:
                state.room.room.id,

              text
            }
          );

          input.value =
            '';
        }

      };
  }


  const rollDice =
    $('#rollDice');

  if(rollDice){

    rollDice.onclick =
      () => {

        if(
          !state.socket ||
          !state.room
        ){
          toast(
            '請先加入房間'
          );

          return;
        }

        state.socket.emit(
          'dice:roll',
          {
            roomId:
              state.room.room.id,

            notation:
              $('#diceNotation').value,

            label:
              $('#diceLabel').value
          }
        );

      };
  }
}


/* =========================================================
   MODAL
========================================================= */

// [前端功能備註｜共用工具] closeModal：負責此前端功能的資料處理或互動。修改 UI 時可直接搜尋此函式名稱。
function closeModal(){

  $('#modal')
    .classList
    .add('hidden');
}


// [前端功能備註｜NPC] openPrompt：負責此前端功能的資料處理或互動；對應 API：/api/admin/npc-shop-items, /api/rooms, /api/rooms/join。修改 UI 時可直接搜尋此函式名稱。
function openPrompt(
  title,
  label,
  value,
  callback
){

  $('#modalTitle')
    .textContent =
      title;

  $('#modalBody')
    .innerHTML = `

      <div class="field">

        <label>
          ${esc(label)}
        </label>

        <input
          id="modalInput"
          value="${esc(value)}"
        >

      </div>

    `;

  $('#modal')
    .classList
    .remove('hidden');

  requestAnimationFrame(()=>$('#modalInput')?.focus({preventScroll:true}));

  $('#modalCancel').onclick =
    closeModal;

  $('#modalOk').onclick =
    async () => {

      try{

        const value =
          $('#modalInput')
            .value
            .trim();

        await callback(
          value
        );

        closeModal();

      }catch(error){

        toast(
          error.message
        );

      }

    };
}


/* =========================================================
   AUTH UI
========================================================= */

$$('.auth-tabs .tab')
  .forEach(
    tab => {

      tab.onclick =
        () => {

          $$('.auth-tabs .tab')
            .forEach(
              item =>
                item.classList.remove(
                  'active'
                )
            );

          tab.classList.add(
            'active'
          );

          state.authMode =
            tab.dataset.auth;

          $('#authSubmit')
            .textContent =
              state.authMode === 'login'
                ? '登入'
                : '註冊';

          $('#password')
            .autocomplete =
              state.authMode === 'login'
                ? 'current-password'
                : 'new-password';

        };

    }
  );


$('#authForm')
  .onsubmit =
    submitAuth;

$('#installAppButton').onclick=installApp;
$('#refreshAppButton').onclick=applyAppUpdate;
$('#applyAppUpdate').onclick=applyAppUpdate;
$('#dismissAppUpdate').onclick=()=>$('#updateBanner').classList.add('hidden');
$('#simpleModeToggle').onclick=()=>setSimpleMode(!state.simpleMode);


$('#logout')
  .onclick =
    () => {

      if(state.socket){
        state.socket.disconnect();
      }

      localStorage.removeItem(
        'rpg_token'
      );

      state.token =
        null;

      location.reload();

    };


/* =========================================================
   START
========================================================= */

if('serviceWorker' in navigator){
  window.addEventListener('load',async()=>{
    try{
      serviceWorkerRegistration=await navigator.serviceWorker.register('/sw.js');
      if(serviceWorkerRegistration.waiting){pendingServiceWorker=serviceWorkerRegistration.waiting;showUpdateBanner();}
      serviceWorkerRegistration.addEventListener('updatefound',()=>{
        const worker=serviceWorkerRegistration.installing;if(!worker)return;
        worker.addEventListener('statechange',()=>{const bar=$('#updateBannerProgress');if(worker.state==='installing'&&bar)bar.style.width='35%';if(worker.state==='installed'&&navigator.serviceWorker.controller){if(bar)bar.style.width='100%';pendingServiceWorker=worker;showUpdateBanner('新版已下載完成，可以立即套用。');}});
      });
      setInterval(()=>{serviceWorkerRegistration?.update().catch(()=>{});checkAppVersion();},5*60*1000);
      checkAppVersion();
    }catch(error){console.warn('Service Worker 註冊失敗：',error);}
  });
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!window.__trpgReloading){window.__trpgReloading=true;location.reload();}});
}

boot();

</script>
