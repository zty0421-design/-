<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101321" />
  <title>TRPG Online MVP</title>
  <style>
    :root{--bg:#0c0f19;--panel:#151a29;--panel2:#1b2235;--line:#293149;--text:#eef2ff;--muted:#aab3cb;--accent:#8b7cff;--accent2:#6de1c1;--danger:#ff7185;--shadow:0 14px 40px rgba(0,0,0,.25)}
    *{box-sizing:border-box} html,body{margin:0;min-height:100%;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:radial-gradient(circle at top,#171b2f 0,#0c0f19 46%,#080a11 100%);color:var(--text)} button,input{font:inherit} button{cursor:pointer;border:0}.hidden{display:none!important}.muted{color:var(--muted)}
    .auth-shell{min-height:100vh;display:grid;place-items:center;padding:20px}.auth-card{width:min(460px,100%);background:rgba(21,26,41,.92);border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:var(--shadow);backdrop-filter:blur(12px)}
    .brand{font-size:28px;font-weight:800;letter-spacing:.02em}.brand span{color:var(--accent)}.auth-card h1{margin:10px 0 6px}.auth-tabs{display:grid;grid-template-columns:1fr 1fr;margin:22px 0 16px;background:var(--panel2);border-radius:12px;padding:4px}.tab{padding:10px;color:var(--muted);background:transparent;border-radius:8px}.tab.active{background:var(--accent);color:white}.field{display:grid;gap:7px;margin:13px 0}.field label{font-size:13px;color:var(--muted)}.field input{width:100%;padding:13px 14px;border:1px solid var(--line);background:#0f1421;color:var(--text);border-radius:12px;outline:none}.field input:focus{border-color:var(--accent)}.btn{width:100%;padding:13px 16px;border-radius:12px;background:var(--accent);color:white;font-weight:700}.btn.secondary{background:var(--panel2);border:1px solid var(--line)}.btn.ghost{background:transparent;border:1px solid var(--line)}.error{color:var(--danger);font-size:13px;margin-top:10px;min-height:18px}
    .app{display:grid;grid-template-rows:64px 1fr;min-height:100vh}.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--line);background:rgba(12,15,25,.84);backdrop-filter:blur(14px);position:sticky;top:0;z-index:5}.top-left,.top-right{display:flex;align-items:center;gap:12px}.room-code{font-family:ui-monospace,monospace;background:var(--panel2);border:1px solid var(--line);padding:7px 10px;border-radius:10px}.user-pill{color:var(--muted)}
    .layout{display:grid;grid-template-columns:220px minmax(0,1fr) 310px;min-height:calc(100vh - 64px)}.sidebar,.rightbar{padding:18px;border-right:1px solid var(--line);background:rgba(16,20,33,.55)}.rightbar{border-right:0;border-left:1px solid var(--line)}.nav{display:grid;gap:8px}.nav button{padding:11px 12px;background:transparent;color:var(--muted);text-align:left;border-radius:10px}.nav button.active,.nav button:hover{background:var(--panel2);color:white}.content{min-width:0;padding:18px;display:grid;grid-template-rows:auto 1fr;gap:14px}.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,1fr);gap:14px}.card{background:rgba(21,26,41,.82);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.card.pad{padding:16px}.card h2,.card h3{margin:0 0 12px}.hero{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions .btn{width:auto;padding:10px 13px}.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:var(--panel2);border:1px solid var(--line);padding:12px;border-radius:13px}.stat .n{font-size:24px;font-weight:800}.section{margin-top:14px}.event-list{display:grid;gap:9px;max-height:53vh;overflow:auto}.event{padding:10px 12px;background:#101523;border:1px solid #222a40;border-radius:12px}.event .head{font-size:12px;color:var(--muted);margin-bottom:5px}.member-list{display:grid;gap:9px}.member{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px;background:#101523;border:1px solid #222a40;border-radius:12px}.badge{font-size:11px;padding:4px 7px;border-radius:999px;background:#252d45;color:var(--muted)}.badge.gm{background:#453b86;color:#fff}.online-dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#54607a}.online-dot.on{background:var(--accent2);box-shadow:0 0 8px rgba(109,225,193,.6)}
    .chat{display:grid;grid-template-rows:1fr auto;min-height:300px}.chat-log{padding:14px;overflow:auto;display:grid;gap:10px}.chat-input{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}.chat-input input{flex:1;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:#0f1421;color:var(--text)}.chat-input button{width:auto;padding:11px 15px}
    .modal{position:fixed;inset:0;background:rgba(3,5,10,.72);display:grid;place-items:center;padding:16px;z-index:20}.modal-card{width:min(520px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}.modal-actions{display:flex;gap:8px;margin-top:14px}.modal-actions .btn{width:auto;flex:1}
    .mobile-nav{display:none}.mobile-only{display:none}.toast{position:fixed;right:18px;bottom:18px;background:#171d2d;border:1px solid var(--line);padding:11px 13px;border-radius:12px;box-shadow:var(--shadow);z-index:30}
    @media(max-width:1050px){.layout{grid-template-columns:190px minmax(0,1fr)}.rightbar{display:none}.grid2{grid-template-columns:1fr}.mobile-only{display:block}}
    @media(max-width:760px){.app{grid-template-rows:58px 1fr 68px}.topbar{padding:0 12px}.brand{font-size:20px}.room-code{font-size:12px;padding:6px 8px}.user-pill{display:none}.layout{grid-template-columns:1fr;min-height:0}.sidebar{display:none}.content{padding:11px;padding-bottom:78px}.hero{display:grid}.stat-grid{grid-template-columns:repeat(2,1fr)}.card{border-radius:15px}.grid2{gap:10px}.top-left{gap:7px}.mobile-nav{position:fixed;left:0;right:0;bottom:0;height:68px;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(12,15,25,.96);border-top:1px solid var(--line);z-index:10;padding-bottom:env(safe-area-inset-bottom)}.mobile-nav button{background:transparent;color:var(--muted);display:grid;place-items:center;font-size:11px;gap:3px}.mobile-nav button.active{color:white}.hide-mobile{display:none}.actions{display:grid;grid-template-columns:1fr 1fr}.actions .btn{width:100%}.chat{min-height:60vh}.modal{padding:10px}.modal-card{padding:15px}}
  </style>
</head>
<body>
  <div id="auth" class="auth-shell">
    <div class="auth-card">
      <div class="brand">TRPG <span>ONLINE</span></div>
      <h1>多人跑團平台</h1>
      <div class="muted">手機、平板、電腦都可以加入同一場跑團。</div>
      <div class="auth-tabs"><button class="tab active" data-auth="login">登入</button><button class="tab" data-auth="register">註冊</button></div>
      <form id="authForm">
        <div class="field"><label>帳號</label><input id="username" required autocomplete="username" minlength="2" maxlength="20" /></div>
        <div class="field"><label>密碼</label><input id="password" required type="password" autocomplete="current-password" minlength="6" /></div>
        <button class="btn" id="authSubmit">登入</button><div id="authError" class="error"></div>
      </form>
    </div>
  </div>

  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="top-left"><div class="brand">TRPG <span>ONLINE</span></div><div id="roomTitle">未加入跑團</div><div id="roomCode" class="room-code hidden"></div></div>
      <div class="top-right"><div id="userPill" class="user-pill"></div><button id="logout" class="btn ghost" style="width:auto;padding:8px 12px">登出</button></div>
    </header>
    <div class="layout">
      <aside class="sidebar"><div class="nav"><button data-view="dashboard" class="active">🏠 跑團首頁</button><button data-view="room">🎲 跑團房間</button><button data-view="character">🧙 角色卡</button><button data-view="dice">🎯 骰子</button></div></aside>
      <main id="content" class="content"></main>
      <aside class="rightbar"><div class="card pad"><h3>在線玩家</h3><div id="onlineMembers" class="member-list"></div></div><div class="card pad section"><h3>房間資訊</h3><div id="roomInfo" class="muted">尚未加入房間</div></div></aside>
    </div>
    <nav class="mobile-nav"><button data-view="dashboard" class="active">🏠<span>首頁</span></button><button data-view="room">🎲<span>房間</span></button><button data-view="character">🧙<span>角色</span></button><button data-view="dice">🎯<span>骰子</span></button></nav>
  </div>

  <div id="modal" class="modal hidden"><div class="modal-card"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="modal-actions"><button id="modalCancel" class="btn secondary">取消</button><button id="modalOk" class="btn">確定</button></div></div></div>
  <div id="toast" class="toast hidden"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const state={token:localStorage.getItem('rpg_token'),user:null,room:null,online:[],view:'dashboard',socket:null,authMode:'login'};
    const $=s=>document.querySelector(s); const $$=s=>[...document.querySelectorAll(s)];
    function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');clearTimeout(window.__toast);window.__toast=setTimeout(()=>$('#toast').classList.add('hidden'),2200)}
    async function api(url,options={}){const r=await fetch(url,{...options,headers:{'Content-Type':'application/json',Authorization:`Bearer ${state.token}`,...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'請求失敗');return d}
    function showAuth(){ $('#auth').classList.remove('hidden'); $('#app').classList.add('hidden'); }
    function showApp(){ $('#auth').classList.add('hidden'); $('#app').classList.remove('hidden'); $('#userPill').textContent=state.user?.username||''; connectSocket(); render(); }
    async function boot(){if(!state.token)return showAuth();try{const d=await api('/api/me');state.user=d.user;showApp()}catch{localStorage.removeItem('rpg_token');state.token=null;showAuth()}}
    async function submitAuth(e){e.preventDefault();$('#authError').textContent='';const username=$('#username').value.trim();const password=$('#password').value;try{const d=await fetch(`/api/auth/${state.authMode}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})}).then(r=>r.json().then(x=>({ok:r.ok,...x})));if(!d.ok)throw new Error(d.error||'失敗');state.token=d.token;localStorage.setItem('rpg_token',state.token);state.user=d.user;showApp();}catch(err){$('#authError').textContent=err.message}}
    function connectSocket(){if(state.socket){state.socket.disconnect()}state.socket=io({auth:{token:state.token}});state.socket.on('connect_error',()=>toast('即時連線失敗'));state.socket.on('presence',d=>{state.online=d.online||[];updateRightBar()});state.socket.on('room:snapshot',snap=>{state.room=snap;updateAll()});state.socket.on('error:message',m=>toast(m));}
    function render(){renderContent();updateRightBar();}
    function renderContent(){const c=$('#content'); if(state.view==='dashboard') c.innerHTML=dashboardHTML(); else if(state.view==='room') c.innerHTML=roomHTML(); else if(state.view==='character') c.innerHTML=characterHTML(); else c.innerHTML=diceHTML(); bindView();}
    function dashboardHTML(){const r=state.room?.room;return `<section class="card pad hero"><div><div class="muted">歡迎回來，${esc(state.user.username)}</div><h2>${r?esc(r.name):'建立你的第一場跑團'}</h2><div class="muted">${r?`房間代碼 <b>${r.code}</b> · ${r.status==='active'?'跑團進行中':'等待 GM 開團'}`:'建立房間後，把代碼分享給隊友即可加入。'}</div></div><div class="actions"><button class="btn" id="createRoom">＋ 建立房間</button><button class="btn secondary" id="joinRoom">加入房間</button>${r&&r.owner_id===state.user.id&&r.status==='lobby'?'<button class="btn" id="startCampaign">▶ GM 開團</button>':''}</div></section><div class="stat-grid section"><div class="stat"><div class="muted">玩家</div><div class="n">${state.room?.members?.length||0}</div></div><div class="stat"><div class="muted">回合</div><div class="n">${r?.round||'-'}</div></div><div class="stat"><div class="muted">狀態</div><div class="n" style="font-size:18px">${r?(r.status==='active'?'進行中':'大廳'):'—'}</div></div><div class="stat"><div class="muted">在線</div><div class="n">${state.online.length||0}</div></div></div><div class="grid2 section"><div class="card pad"><h3>最近事件</h3><div class="event-list">${eventsHTML()}</div></div><div class="card pad"><h3>快速開始</h3><div class="muted">先建立房間，再把 6 碼房間代碼傳給玩家。GM 開團後，可以用骰子、聊天和角色數值一起進行跑團。</div></div></div>`}
    function roomHTML(){if(!state.room)return `<div class="card pad"><h2>還沒有加入房間</h2><div class="muted">回到首頁建立或加入房間。</div></div>`;const r=state.room.room;return `<div class="card pad hero"><div><div class="muted">${esc(r.name)}</div><h2>${r.status==='active'?'⚔️ 跑團進行中':'🕯️ 等待開團'}</h2><div class="muted">房間代碼：<b>${r.code}</b> · 第 ${r.round} 回合</div></div><div class="actions">${r.owner_id===state.user.id&&r.status==='lobby'?'<button class="btn" id="startCampaign">▶ 開始跑團</button>':''}${r.owner_id===state.user.id&&r.status==='active'?'<button class="btn secondary" id="nextTurn">下一回合</button>':''}</div></div><div class="grid2 section"><div class="card chat"><div id="chatLog" class="chat-log">${chatHTML()}</div><form id="chatForm" class="chat-input"><input id="chatInput" placeholder="輸入訊息…" maxlength="1000" /><button class="btn">送出</button></form></div><div class="card pad"><h3>本場玩家</h3><div class="member-list">${membersHTML()}</div></div></div>`}
    function characterHTML(){const me=state.room?.members?.find(m=>m.id===state.user.id);if(!me)return `<div class="card pad"><h2>角色卡</h2><div class="muted">加入房間後就能看到你的角色。</div></div>`;return `<div class="card pad"><div class="hero"><div><div class="muted">角色名稱</div><h2>${esc(me.display_name)}</h2><div class="muted">${me.role==='gm'?'GM':'玩家'} · @${esc(me.username)}</div></div><span class="badge ${me.role==='gm'?'gm':''}">${me.role==='gm'?'GM':'PLAYER'}</span></div><div class="stat-grid section"><div class="stat"><div class="muted">HP</div><div class="n">${me.hp}<small>/${me.max_hp}</small></div></div><div class="stat"><div class="muted">精神</div><div class="n">${me.spirit}<small>/${me.max_spirit}</small></div></div><div class="stat"><div class="muted">回合</div><div class="n">${state.room.room.round}</div></div><div class="stat"><div class="muted">狀態</div><div class="n" style="font-size:16px">${state.room.room.current_actor_id===me.id?'行動中':'等待'}</div></div></div><div class="section"><h3>快速修改</h3><div class="actions"><button class="btn secondary" id="hpMinus">HP -10</button><button class="btn secondary" id="hpPlus">HP +10</button><button class="btn secondary" id="spMinus">精神 -10</button><button class="btn secondary" id="spPlus">精神 +10</button></div></div></div>`}
    function diceHTML(){return `<div class="card pad"><h2>骰子</h2><div class="muted">支援 1d20、2d6+3 這類常見骰式。結果會即時同步給整個房間。</div><div class="field"><label>骰式</label><input id="diceNotation" value="1d20" /></div><div class="field"><label>標籤</label><input id="diceLabel" value="一般檢定" /></div><button class="btn" id="rollDice">🎲 擲骰</button><div class="section event-list">${(state.room?.events||[]).filter(e=>e.type==='dice').slice().reverse().map(e=>`<div class="event"><div class="head">${esc(e.username||'玩家')} · ${esc(e.payload.label||'擲骰')} · ${e.created_at}</div><b>${esc(e.payload.notation)}</b> → ${e.payload.rolls.join(' + ')}${e.payload.modifier?` ${e.payload.modifier>0?'+':''}${e.payload.modifier}`:''} = <b>${e.payload.total}</b></div>`).join('')||'<div class="muted">還沒有骰子紀錄</div>'}</div></div>`}
    function eventsHTML(){return (state.room?.events||[]).slice().reverse().slice(0,20).map(e=>`<div class="event"><div class="head">${esc(e.username||'系統')} · ${e.created_at}</div>${e.type==='chat'?esc(e.payload.text):e.type==='dice'?`🎲 ${esc(e.payload.notation)} = <b>${e.payload.total}</b>`:esc(e.payload.text||'事件更新')}</div>`).join('')||'<div class="muted">尚無事件</div>'}
    function chatHTML(){return (state.room?.events||[]).filter(e=>e.type==='chat').map(e=>`<div class="event"><div class="head">${esc(e.username||'玩家')}</div>${esc(e.payload.text)}</div>`).join('')||'<div class="muted">開始聊天吧。</div>'}
    function membersHTML(){return (state.room?.members||[]).map(m=>`<div class="member"><div><div><span class="online-dot ${state.online.includes(m.id)?'on':''}"></span> ${esc(m.display_name)}</div><div class="muted" style="font-size:12px">${m.hp}/${m.max_hp} HP · ${m.role==='gm'?'GM':'玩家'}</div></div><span class="badge ${m.role==='gm'?'gm':''}">${m.role==='gm'?'GM':'玩家'}</span></div>`).join('')||'<div class="muted">沒有玩家</div>'}
    function updateRightBar(){if(!state.room){$('#onlineMembers').innerHTML='<div class="muted">尚未加入房間</div>';$('#roomInfo').textContent='尚未加入房間';return}$('#onlineMembers').innerHTML=membersHTML();const r=state.room.room;$('#roomInfo').innerHTML=`房間：<b>${esc(r.name)}</b><br>代碼：<b>${r.code}</b><br>狀態：${r.status==='active'?'進行中':'等待開團'}<br>回合：${r.round}`;$('#roomTitle').textContent=r.name;$('#roomCode').textContent=r.code;$('#roomCode').classList.remove('hidden');}
    function updateAll(){updateRightBar();renderContent();}
    function bindView(){ $$('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;$$('[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===state.view));renderContent()}); const el=id=>document.getElementById(id);
      if(el('createRoom'))el('createRoom').onclick=()=>openPrompt('建立跑團','跑團名稱','新的跑團',async name=>{const d=await api('/api/rooms',{method:'POST',body:JSON.stringify({name})});state.room=d;state.view='room';state.socket.emit('room:enter',{roomId:d.room.id});render()});
      if(el('joinRoom'))el('joinRoom').onclick=()=>openPrompt('加入房間','6 碼房間代碼','ABC123',async code=>{const d=await api('/api/rooms/join',{method:'POST',body:JSON.stringify({code})});state.room=d;state.view='room';state.socket.emit('room:enter',{roomId:d.room.id});render()});
      if(el('startCampaign'))el('startCampaign').onclick=async()=>{const d=await api(`/api/rooms/${state.room.room.id}/start`,{method:'POST'});state.room=d;state.socket.emit('room:enter',{roomId:d.room.id});render()};
      if(el('nextTurn'))el('nextTurn').onclick=async()=>{const d=await api(`/api/rooms/${state.room.room.id}/next-turn`,{method:'POST'});state.room=d;state.socket.emit('room:enter',{roomId:d.room.id});render()};
      if(el('chatForm'))el('chatForm').onsubmit=e=>{e.preventDefault();const text=el('chatInput').value.trim();if(text){state.socket.emit('chat:send',{roomId:state.room.room.id,text});el('chatInput').value='';}};
      if(el('rollDice'))el('rollDice').onclick=()=>state.socket.emit('dice:roll',{roomId:state.room.room.id,notation:el('diceNotation').value,label:el('diceLabel').value});
      const me=state.room?.members?.find(m=>m.id===state.user.id);if(me){[['hpMinus','hp',-10],['hpPlus','hp',10],['spMinus','spirit',-10],['spPlus','spirit',10]].forEach(([id,field,delta])=>{if(el(id))el(id).onclick=async()=>{const next=Math.max(0,Number(me[field])+delta);const d=await api(`/api/rooms/${state.room.room.id}/member/${state.user.id}`,{method:'PATCH',body:JSON.stringify({[field]:next})});state.room=d;state.socket.emit('room:enter',{roomId:d.room.id});render()}})}
    }
    function openPrompt(title,label,value,onok){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=`<div class="field"><label>${label}</label><input id="modalInput" value="${esc(value)}" autofocus></div>`;$('#modal').classList.remove('hidden');const close=()=>$('#modal').classList.add('hidden');$('#modalCancel').onclick=close;$('#modalOk').onclick=async()=>{try{await onok($('#modalInput').value.trim());close()}catch(e){toast(e.message)}}}
    function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    $$('.auth-tabs .tab').forEach(t=>t.onclick=()=>{$$('.auth-tabs .tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');state.authMode=t.dataset.auth;$('#authSubmit').textContent=state.authMode==='login'?'登入':'註冊';$('#password').autocomplete=state.authMode==='login'?'current-password':'new-password';});
    $('#authForm').onsubmit=submitAuth;$('#logout').onclick=()=>{localStorage.removeItem('rpg_token');state.token=null;location.reload()};
    boot();
  </script>
</body>
</html>
