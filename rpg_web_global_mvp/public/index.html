<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101321">
  <title>TRPG Online</title>

  <style>
    :root{
      --bg:#0c0f19;
      --panel:#151a29;
      --panel2:#1b2235;
      --panel3:#101523;
      --line:#293149;
      --text:#eef2ff;
      --muted:#aab3cb;
      --accent:#8b7cff;
      --accent2:#6de1c1;
      --danger:#ff7185;
      --warning:#ffc857;
      --shadow:0 14px 40px rgba(0,0,0,.25);
    }

    *{
      box-sizing:border-box;
    }

    html,body{
      margin:0;
      min-height:100%;
      font-family:
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
      background:
        radial-gradient(
          circle at top,
          #171b2f 0,
          #0c0f19 46%,
          #080a11 100%
        );
      color:var(--text);
    }

    button,
    input,
    select,
    textarea{
      font:inherit;
    }

    button{
      cursor:pointer;
      border:0;
    }

    .hidden{
      display:none !important;
    }

    .muted{
      color:var(--muted);
    }

    .danger-text{
      color:var(--danger);
    }

    .success-text{
      color:var(--accent2);
    }

    /* =========================
       AUTH
    ========================= */

    .auth-shell{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:20px;
    }

    .auth-card{
      width:min(460px,100%);
      background:rgba(21,26,41,.94);
      border:1px solid var(--line);
      border-radius:24px;
      padding:30px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(12px);
    }

    .brand{
      font-size:28px;
      font-weight:800;
      letter-spacing:.02em;
    }

    .brand span{
      color:var(--accent);
    }

    .auth-card h1{
      margin:10px 0 6px;
    }

    .auth-tabs{
      display:grid;
      grid-template-columns:1fr 1fr;
      margin:22px 0 16px;
      background:var(--panel2);
      border-radius:12px;
      padding:4px;
    }

    .tab{
      padding:10px;
      color:var(--muted);
      background:transparent;
      border-radius:8px;
    }

    .tab.active{
      background:var(--accent);
      color:white;
    }

    .field{
      display:grid;
      gap:7px;
      margin:13px 0;
    }

    .field label{
      font-size:13px;
      color:var(--muted);
    }

    .field input,
    .field select,
    .field textarea{
      width:100%;
      padding:12px 14px;
      border:1px solid var(--line);
      background:#0f1421;
      color:var(--text);
      border-radius:12px;
      outline:none;
    }

    .field textarea{
      min-height:100px;
      resize:vertical;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus{
      border-color:var(--accent);
    }

    .btn{
      width:100%;
      padding:13px 16px;
      border-radius:12px;
      background:var(--accent);
      color:white;
      font-weight:700;
    }

    .btn.secondary{
      background:var(--panel2);
      border:1px solid var(--line);
    }

    .btn.ghost{
      background:transparent;
      border:1px solid var(--line);
    }

    .btn.danger{
      background:var(--danger);
      color:#16080c;
    }

    .btn.small{
      width:auto;
      padding:8px 11px;
      font-size:13px;
    }

    .error{
      color:var(--danger);
      font-size:13px;
      margin-top:10px;
      min-height:18px;
    }

    /* =========================
       APP
    ========================= */

    .app{
      display:grid;
      grid-template-rows:64px 1fr;
      min-height:100vh;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 20px;
      border-bottom:1px solid var(--line);
      background:rgba(12,15,25,.88);
      backdrop-filter:blur(14px);
      position:sticky;
      top:0;
      z-index:5;
    }

    .top-left,
    .top-right{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .user-pill{
      color:var(--muted);
    }

    .admin-pill{
      padding:6px 9px;
      border-radius:999px;
      background:#453b86;
      color:white;
      font-size:12px;
      font-weight:700;
    }

    .layout{
      display:grid;
      grid-template-columns:230px minmax(0,1fr);
      min-height:calc(100vh - 64px);
    }

    .sidebar{
      padding:18px;
      border-right:1px solid var(--line);
      background:rgba(16,20,33,.55);
    }

    .nav{
      display:grid;
      gap:8px;
    }

    .nav button{
      padding:12px;
      background:transparent;
      color:var(--muted);
      text-align:left;
      border-radius:10px;
    }

    .nav button:hover,
    .nav button.active{
      background:var(--panel2);
      color:white;
    }

    .nav .admin-nav{
      border:1px solid rgba(139,124,255,.25);
    }

    .content{
      min-width:0;
      padding:18px;
    }

    /* =========================
       CARDS
    ========================= */

    .card{
      background:rgba(21,26,41,.84);
      border:1px solid var(--line);
      border-radius:18px;
      box-shadow:var(--shadow);
    }

    .card.pad{
      padding:16px;
    }

    .card h2,
    .card h3{
      margin:0 0 12px;
    }

    .hero{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:18px;
    }

    .actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .actions .btn{
      width:auto;
      padding:10px 13px;
    }

    .section{
      margin-top:14px;
    }

    .grid2{
      display:grid;
      grid-template-columns:
        minmax(0,1.4fr)
        minmax(280px,1fr);
      gap:14px;
    }

    .stat-grid{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:10px;
    }

    .stat{
      background:var(--panel2);
      border:1px solid var(--line);
      padding:12px;
      border-radius:13px;
    }

    .stat .n{
      font-size:24px;
      font-weight:800;
    }

    /* =========================
       ADMIN
    ========================= */

    .admin-header{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:15px;
      margin-bottom:15px;
    }

    .admin-tabs{
      display:flex;
      gap:8px;
      margin-bottom:15px;
      flex-wrap:wrap;
    }

    .admin-tab{
      width:auto;
      padding:10px 14px;
      background:var(--panel2);
      color:var(--muted);
      border:1px solid var(--line);
      border-radius:10px;
    }

    .admin-tab.active{
      background:var(--accent);
      color:white;
      border-color:var(--accent);
    }

    .character-grid{
      display:grid;
      grid-template-columns:
        repeat(auto-fill,minmax(310px,1fr));
      gap:14px;
    }

    .character-card{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:17px;
      padding:16px;
      transition:.15s ease;
    }

    .character-card:hover{
      border-color:#4c5879;
      transform:translateY(-1px);
    }

    .character-card-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
    }

    .character-avatar{
      width:48px;
      height:48px;
      border-radius:14px;
      display:grid;
      place-items:center;
      background:
        linear-gradient(
          135deg,
          var(--accent),
          #4d62c9
        );
      font-size:21px;
      font-weight:800;
      flex-shrink:0;
    }

    .character-title{
      display:flex;
      gap:10px;
      align-items:center;
    }

    .character-name{
      font-size:19px;
      font-weight:800;
    }

    .character-user{
      font-size:12px;
      color:var(--muted);
      margin-top:2px;
    }

    .badge{
      font-size:11px;
      padding:4px 8px;
      border-radius:999px;
      background:#252d45;
      color:var(--muted);
      white-space:nowrap;
    }

    .badge.admin{
      background:#453b86;
      color:white;
    }

    .badge.player{
      background:#203c38;
      color:#8ee8ce;
    }

    .character-info{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
      margin-top:14px;
    }

    .mini-stat{
      background:var(--panel3);
      border:1px solid #222a40;
      border-radius:10px;
      padding:9px;
    }

    .mini-stat span{
      display:block;
      color:var(--muted);
      font-size:11px;
      margin-bottom:3px;
    }

    .mini-stat strong{
      font-size:16px;
    }

    .character-details{
      margin-top:12px;
      padding-top:12px;
      border-top:1px solid var(--line);
      display:grid;
      gap:7px;
      font-size:13px;
    }

    .character-actions{
      display:flex;
      gap:8px;
      margin-top:14px;
    }

    .character-actions .btn{
      flex:1;
      width:auto;
      padding:9px 10px;
    }

    /* =========================
       USERS
    ========================= */

    .user-list{
      display:grid;
      gap:9px;
    }

    .user-row{
      display:grid;
      grid-template-columns:
        minmax(160px,1fr)
        auto
        auto;
      gap:10px;
      align-items:center;
      padding:12px;
      background:var(--panel3);
      border:1px solid #222a40;
      border-radius:12px;
    }

    /* =========================
       ROOM
    ========================= */

    .room-code{
      font-family:ui-monospace,monospace;
      background:var(--panel2);
      border:1px solid var(--line);
      padding:7px 10px;
      border-radius:10px;
    }

    .member-list{
      display:grid;
      gap:9px;
    }

    .member{
      display:grid;
      grid-template-columns:1fr auto;
      gap:8px;
      align-items:center;
      padding:10px;
      background:var(--panel3);
      border:1px solid #222a40;
      border-radius:12px;
    }

    .online-dot{
      width:8px;
      height:8px;
      border-radius:50%;
      display:inline-block;
      background:#54607a;
    }

    .online-dot.on{
      background:var(--accent2);
      box-shadow:0 0 8px rgba(109,225,193,.6);
    }

    /* =========================
       EVENTS / CHAT
    ========================= */

    .event-list{
      display:grid;
      gap:9px;
      max-height:53vh;
      overflow:auto;
    }

    .event{
      padding:10px 12px;
      background:var(--panel3);
      border:1px solid #222a40;
      border-radius:12px;
    }

    .event .head{
      font-size:12px;
      color:var(--muted);
      margin-bottom:5px;
    }

    .chat{
      display:grid;
      grid-template-rows:1fr auto;
      min-height:400px;
    }

    .chat-log{
      padding:14px;
      overflow:auto;
      display:grid;
      gap:10px;
    }

    .chat-input{
      display:flex;
      gap:8px;
      padding:10px;
      border-top:1px solid var(--line);
    }

    .chat-input input{
      flex:1;
      padding:11px 12px;
      border-radius:11px;
      border:1px solid var(--line);
      background:#0f1421;
      color:var(--text);
    }

    .chat-input button{
      width:auto;
      padding:11px 15px;
    }

    /* =========================
       MODAL
    ========================= */

    .modal{
      position:fixed;
      inset:0;
      background:rgba(3,5,10,.78);
      display:grid;
      place-items:center;
      padding:16px;
      z-index:20;
    }

    .modal-card{
      width:min(720px,100%);
      max-height:90vh;
      overflow:auto;
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:18px;
      padding:18px;
    }

    .modal-actions{
      display:flex;
      gap:8px;
      margin-top:14px;
    }

    .modal-actions .btn{
      width:auto;
      flex:1;
    }

    .edit-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .task-card{
      display:grid;
      gap:12px;
    }

    .task-head{
      display:flex;
      justify-content:space-between;
      gap:14px;
      align-items:flex-start;
    }

    .task-description{
      white-space:pre-wrap;
      line-height:1.7;
    }

    .task-block{
      padding:10px 12px;
      border:1px solid var(--line);
      border-radius:10px;
      background:rgba(255,255,255,.02);
    }

    /* =========================
       MOBILE
    ========================= */

    .mobile-nav{
      display:none;
    }

    .toast{
      position:fixed;
      right:18px;
      bottom:18px;
      background:#171d2d;
      border:1px solid var(--line);
      padding:11px 13px;
      border-radius:12px;
      box-shadow:var(--shadow);
      z-index:30;
    }

    @media(max-width:900px){
      .layout{
        grid-template-columns:190px minmax(0,1fr);
      }

      .character-grid{
        grid-template-columns:
          repeat(auto-fill,minmax(280px,1fr));
      }
    }

    @media(max-width:760px){
      .app{
        grid-template-rows:58px 1fr 68px;
      }

      .topbar{
        padding:0 12px;
      }

      .brand{
        font-size:20px;
      }

      .user-pill{
        display:none;
      }

      .layout{
        grid-template-columns:1fr;
        min-height:0;
      }

      .sidebar{
        display:none;
      }

      .content{
        padding:11px;
        padding-bottom:78px;
      }

      .hero{
        display:grid;
      }

      .stat-grid{
        grid-template-columns:repeat(2,1fr);
      }

      .grid2{
        grid-template-columns:1fr;
      }

      .character-grid{
        grid-template-columns:1fr;
      }

      .user-row{
        grid-template-columns:1fr;
      }

      .edit-grid{
        grid-template-columns:1fr;
      }

      .mobile-nav{
        position:fixed;
        left:0;
        right:0;
        bottom:0;
        height:68px;
        display:grid;
        grid-template-columns:repeat(4,1fr);
        background:rgba(12,15,25,.97);
        border-top:1px solid var(--line);
        z-index:10;
        padding-bottom:env(safe-area-inset-bottom);
      }

      .mobile-nav button{
        background:transparent;
        color:var(--muted);
        display:grid;
        place-items:center;
        font-size:11px;
        gap:3px;
      }

      .mobile-nav button.active{
        color:white;
      }

      .actions{
        display:grid;
        grid-template-columns:1fr 1fr;
      }

      .actions .btn{
        width:100%;
      }
    }
  
/* Adaptive chat bubbles */
.chat-log {
  min-width: 0;
}
.event {
  height: auto;
  min-height: 0;
  max-width: 100%;
}
.event > div:last-child,
.event {
  overflow-wrap: anywhere;
  word-break: break-word;
  white-space: pre-wrap;
}

</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<div id="auth" class="auth-shell">
  <div class="auth-card">

    <div class="brand">
      TRPG <span>ONLINE</span>
    </div>

    <h1>多人跑團平台</h1>

    <div class="muted">
      玩家可以登入遊玩，DM 可以管理跑團。
    </div>

    <div class="auth-tabs">
      <button
        class="tab active"
        data-auth="login"
      >
        登入
      </button>

      <button
        class="tab"
        data-auth="register"
      >
        註冊
      </button>
    </div>

    <form id="authForm">

      <div class="field">
        <label>帳號</label>
        <input
          id="username"
          required
          autocomplete="username"
          minlength="2"
          maxlength="20"
        >
      </div>

      <div class="field">
        <label>密碼</label>
        <input
          id="password"
          required
          type="password"
          autocomplete="current-password"
          minlength="6"
        >
      </div>

      <button
        class="btn"
        id="authSubmit"
        type="submit"
      >
        登入
      </button>

      <div
        id="authError"
        class="error"
      ></div>

    </form>

  </div>
</div>


<!-- =========================
     APP
========================= -->

<div id="app" class="app hidden">

  <header class="topbar">

    <div class="top-left">

      <div class="brand">
        TRPG <span>ONLINE</span>
      </div>

      <div id="roomTitle">
        全站管理
      </div>

    </div>

    <div class="top-right">

      <span
        id="adminPill"
        class="admin-pill hidden"
      >
        全站 DM
      </span>

      <div
        id="userPill"
        class="user-pill"
      ></div>

      <button
        id="logout"
        class="btn ghost small"
      >
        登出
      </button>

    </div>

  </header>


  <div class="layout">

    <aside class="sidebar">

      <div class="nav">

        <button
          data-view="dashboard"
          class="active"
        >
          🏠 跑團首頁
        </button>

        <button data-view="room">
          🎲 跑團房間
        </button>

        <button data-view="character">
          🧙 我的角色卡
        </button>

        <button data-view="dice">
          🎯 骰子
        </button>

        <button data-view="tasks">
          📜 任務大廳
        </button>

        <button data-view="myTasks">
          🗂️ 我的任務
        </button>

        <button
          id="adminNav"
          class="admin-nav hidden"
          data-view="admin"
        >
          🛡️ DM 全站管理
        </button>

      </div>

    </aside>


    <main
      id="content"
      class="content"
    ></main>

  </div>


  <nav class="mobile-nav">

    <button
      data-view="dashboard"
      class="active"
    >
      🏠
      <span>首頁</span>
    </button>

    <button data-view="room">
      🎲
      <span>房間</span>
    </button>

    <button data-view="character">
      🧙
      <span>角色</span>
    </button>

    <button data-view="tasks">
      📜
      <span>任務</span>
    </button>

    <button
      id="mobileAdminNav"
      data-view="admin"
      class="hidden"
    >
      🛡️
      <span>DM</span>
    </button>

  </nav>

</div>


<!-- =========================
     MODAL
========================= -->

<div
  id="modal"
  class="modal hidden"
>

  <div class="modal-card">

    <h2 id="modalTitle"></h2>

    <div id="modalBody"></div>

    <div class="modal-actions">

      <button
        id="modalCancel"
        class="btn secondary"
      >
        取消
      </button>

      <button
        id="modalOk"
        class="btn"
      >
        確定
      </button>

    </div>

  </div>

</div>


<div
  id="toast"
  class="toast hidden"
></div>


<script src="/socket.io/socket.io.js"></script>

<script>
/* =========================================================
   STATE
========================================================= */

const state = {
  token: localStorage.getItem('rpg_token'),
  user: null,
  room: null,
  rooms: [],
  myCharacter: null,
  adminCharacters: [],
  adminUsers: [],
  adminRooms: [],
  tasksPublic: [],
  myTasks: [],
  adminTasks: [],
  online: [],
  view: 'dashboard',
  adminView: 'characters',
  socket: null,
  authMode: 'login'
};


/* =========================================================
   HELPERS
========================================================= */

const $ = selector =>
  document.querySelector(selector);

const $$ = selector =>
  [...document.querySelectorAll(selector)];


function esc(value){
  return String(value ?? '')
    .replace(
      /[&<>"']/g,
      c => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      }[c])
    );
}


function toast(message){
  const el = $('#toast');

  el.textContent = message;
  el.classList.remove('hidden');

  clearTimeout(window.__toast);

  window.__toast =
    setTimeout(
      () => el.classList.add('hidden'),
      2600
    );
}


async function api(url, options = {}){

  const response =
    await fetch(
      url,
      {
        ...options,

        headers:{
          'Content-Type':
            'application/json',

          'Authorization':
            `Bearer ${state.token}`,

          ...(options.headers || {})
        }
      }
    );

  const data =
    await response
      .json()
      .catch(
        () => ({})
      );

  if(!response.ok){
    throw new Error(
      data.error ||
      '請求失敗'
    );
  }

  return data;
}


/* =========================================================
   AUTH
========================================================= */

function showAuth(){

  $('#auth')
    .classList
    .remove('hidden');

  $('#app')
    .classList
    .add('hidden');
}


function showApp(){

  $('#auth')
    .classList
    .add('hidden');

  $('#app')
    .classList
    .remove('hidden');

  $('#userPill').textContent =
    state.user?.username || '';

  const isAdmin =
    Boolean(
      state.user?.is_admin
    );

  $('#adminPill')
    .classList
    .toggle('hidden', !isAdmin);

  $('#adminNav')
    .classList
    .toggle('hidden', !isAdmin);

  $('#mobileAdminNav')
    .classList
    .toggle('hidden', !isAdmin);

  connectSocket();

  render();
}


async function boot(){

  if(!state.token){
    showAuth();
    return;
  }

  try{

    const me =
      await api('/api/me');

    state.user =
      me.user;

    await loadMyCharacter();
    await Promise.all([
      loadPublicTasks(),
      loadMyTasks()
    ]);

    if(state.user.is_admin){

      await loadAdminData();

      state.view =
        'admin';

    }

    showApp();

  }catch(error){

    console.error(error);

    localStorage.removeItem(
      'rpg_token'
    );

    state.token = null;

    showAuth();
  }
}


async function submitAuth(event){

  event.preventDefault();

  $('#authError').textContent =
    '';

  const username =
    $('#username')
      .value
      .trim();

  const password =
    $('#password')
      .value;

  try{

    const endpoint =
      state.authMode === 'login'
        ? '/api/auth/login'
        : '/api/auth/register';

    const response =
      await fetch(
        endpoint,
        {
          method:'POST',

          headers:{
            'Content-Type':
              'application/json'
          },

          body:
            JSON.stringify({
              username,
              password
            })
        }
      );

    const data =
      await response
        .json()
        .catch(
          () => ({})
        );

    if(!response.ok){
      throw new Error(
        data.error ||
        '操作失敗'
      );
    }

    state.token =
      data.token;

    state.user =
      data.user;

    localStorage.setItem(
      'rpg_token',
      state.token
    );

    await loadMyCharacter();

    if(state.user.is_admin){

      await loadAdminData();

      state.view =
        'admin';

    }else{

      state.view =
        'dashboard';

    }

    showApp();

  }catch(error){

    $('#authError')
      .textContent =
        error.message;
  }
}


/* =========================================================
   SOCKET
========================================================= */

function connectSocket(){

  if(state.socket){
    state.socket.disconnect();
  }

  state.socket =
    io({
      auth:{
        token:
          state.token
      }
    });

  state.socket.on(
    'connect_error',
    () => toast('即時連線失敗')
  );

  state.socket.on(
    'presence',
    data => {

      state.online =
        data.online || [];

      render();
    }
  );

  state.socket.on(
    'room:snapshot',
    snapshot => {

      state.room =
        snapshot;

      render();
    }
  );

  state.socket.on(
    'error:message',
    message => {
      toast(message);
    }
  );
}

========================================================= */

function render(){

  renderNavigation();

  renderContent();
}


function renderNavigation(){

  $$('[data-view]')
    .forEach(
      button => {

        button.classList.toggle(
          'active',
          button.dataset.view ===
          state.view
        );

      }
    );
}


function renderContent(){

  const content =
    $('#content');

  if(state.view === 'dashboard'){

    content.innerHTML =
      dashboardHTML();

  }else if(state.view === 'room'){

    content.innerHTML =
      roomHTML();

  }else if(state.view === 'character'){

    content.innerHTML =
      characterHTML();

  }else if(state.view === 'dice'){

    content.innerHTML =
      diceHTML();

  }else if(state.view === 'tasks'){

    content.innerHTML =
      taskHallHTML();

  }else if(state.view === 'myTasks'){

    content.innerHTML =
      myTasksHTML();

  }else if(
    state.view === 'admin' &&
    state.user?.is_admin
  ){

    content.innerHTML =
      adminHTML();

  }else{

    state.view =
      state.user?.is_admin
        ? 'admin'
        : 'dashboard';

    content.innerHTML =
      state.user?.is_admin
        ? adminHTML()
        : dashboardHTML();
  }

  bindView();
}

function taskRewardHTML(rewards){
  const r = rewards || {};
  const parts = [];

  if(Number(r.experience) > 0) parts.push(`經驗 +${Number(r.experience)}`);
  if(Number(r.attribute_points) > 0) parts.push(`屬性點 +${Number(r.attribute_points)}`);
  if(Number(r.skill_points) > 0) parts.push(`技能點 +${Number(r.skill_points)}`);
  if(Array.isArray(r.equipment) && r.equipment.length) parts.push(`裝備 ×${r.equipment.length}`);
  if(Array.isArray(r.weapons) && r.weapons.length) parts.push(`武器 ×${r.weapons.length}`);

  return parts.length ? parts.map(esc).join(' · ') : '無預設獎勵';
}

  return `

        <label>${character.faction === '西國' ? '信仰之神（每行一個）' : '所行之道（每行一個）'}</label>
        <textarea id="edit_paths">${
          (
            character.faction === '西國'
              ? (Array.isArray(character.faiths) ? character.faiths : [])
              : (Array.isArray(character.great_ways) ? character.great_ways : [])
          ).join('\n')
        }</textarea>

          min="0"

        >

        <label>經驗</label>
        <input

          type="number"
          min="0"
          value="${Number(character.experience)||0}"
        >
      </div>

      <div class="field">
        <label>技能點</label>
        <input
          id="edit_skill_points"
          type="number"
          min="0"
          value="${Number(character.skill_points)||0}"
        >

    </div>

    <div class="field">

      <label>
        副職業
        （每行一個，最多 3 個）
      </label>

      <textarea id="edit_sub_classes">${
        Array.isArray(character.sub_classes)
          ? character.sub_classes.join('\n')
          : ''
      }</textarea>

    </div>

    <div class="field">

      <label>
        技能 JSON
      </label>
      <div class="muted" style="margin-bottom:8px;">
        可使用：
        check＝判定；
        damage_formula＝傷害判定（例如 1D力量 × 1.5）；
        extra_tag＝額外技能標籤；
        summon_tag=true 表示召喚技能。
      </div>

      <textarea id="edit_skills">${
        JSON.stringify(
          character.skills || [],
          null,
          2
        )
      }</textarea>

    </div>

    <div class="field">

      <label>
        裝備 JSON
      </label>

      <textarea id="edit_equipment">${
        JSON.stringify(
          character.equipment || [],
          null,
          2
        )
      }</textarea>

    </div>

    <div class="field">

      <label>
        武器 JSON
      </label>

      <textarea id="edit_weapons">${
        JSON.stringify(
          character.weapons || [],
          null,
          2
        )
      }</textarea>

    </div>

    <div
      id="editError"
      class="error"
    ></div>

    .classList
    .remove('hidden');

          $('#edit_sub_classes')
            .value
            .split('\n')
            .map(x => x.trim())
            .filter(Boolean)
            .slice(0,3);

        const parseJsonArray =
          id => {

            const text =
              $(id).value.trim();

            if(!text){
              return [];
            }

            const value =
              JSON.parse(text);

            if(!Array.isArray(value)){
              throw new Error(
                '技能、裝備、武器必須是 JSON 陣列'
              );
            }

            return value;
          };

        const body = {

          name:
            $('#edit_name').value,

          faction:
            $('#edit_faction').value,

          tier:
            Number($('#edit_tier').value),

          level:

                  .map(x => x.trim())
                  .filter(Boolean)
              : [],

          faiths:
            $('#edit_paths')
              ? $('#edit_paths').value
                  .split('\n')
                  .map(x => x.trim())
                  .filter(Boolean)
              : [],

          element_affinity:
            $('#edit_element_affinity')
              ? JSON.parse($('#edit_element_affinity').value || '{}')
              : {},

            Number($('#edit_luck').value),

          strength:
            Number($('#edit_strength').value),

          agility:
            Number($('#edit_agility').value),

          constitution:
            Number($('#edit_constitution').value),

          spirit:
            Number($('#edit_spirit').value),

          attribute_points:
            Number(
              $('#edit_attribute_points').value
            ),

          experience:
            Number(
              $('#edit_experience').value
            ),

          skill_points:
            Number(
              $('#edit_skill_points').value
            ),

          sub_classes:
            subClasses,

          skills:
            parseJsonArray('#edit_skills'),

          equipment:
            parseJsonArray('#edit_equipment'),

          weapons:
            parseJsonArray('#edit_weapons')
        };

        await api(
          `/api/admin/characters/${character.id}`,
          {
            method:'PATCH',
            body:
              JSON.stringify(body)
          }
        );

        await loadAdminCharacters();

        closeModal();

        render();

        toast(
          '角色卡已修改'
        );

      }catch(error){

        $('#editError')
          .textContent =
            error.message;
      }

    };
}

========================================================= */

async function deleteUser(
  userId,
  username
){

  if(
    String(userId) ===
    String(state.user.id)
  ){

    toast(
      '不能刪除目前登入中的 DM'
    );

    return;
  }

  const confirmed =
    window.confirm(
      `確定要刪除帳號「${username}」嗎？\n\n此操作會刪除該玩家的永久角色卡，而且無法復原。`
    );

  if(!confirmed){
    return;
  }

  try{

    await api(
      `/api/admin/users/${userId}`,
      {
        method:'DELETE'
      }
    );

    await loadAdminData();

    render();

    toast(
      `帳號「${username}」已刪除`
    );

  }catch(error){

    toast(
      error.message
    );
  }
}

/* =========================================================
   VIEW BINDING
========================================================= */

function bindView(){

  $$('[data-view]')
    .forEach(
      button => {

        button.onclick =
          () => {

            const target =
              button.dataset.view;

            if(
              target === 'admin' &&
              !state.user?.is_admin
            ){
              toast(
                '只有全站 DM 可以進入管理中心'
              );

              return;
            }

            state.view =
              target;

            render();

          };

      }
    );


  $$('[data-admin-view]')
    .forEach(
      button => {

        button.onclick =
          () => {

            state.adminView =
              button.dataset.adminView;

            render();

          };

      }
    );


  const refreshTasks = $('#refreshTasks');
  if(refreshTasks){
    refreshTasks.onclick = async () => {
      try{
        await loadPublicTasks();
        render();
      }catch(error){ toast(error.message); }
    };
  }

  const refreshMyTasks = $('#refreshMyTasks');
  if(refreshMyTasks){
    refreshMyTasks.onclick = async () => {
      try{
        await loadMyTasks();
        render();
      }catch(error){ toast(error.message); }
    };
  }

  $$('.accept-task').forEach(button => {
    button.onclick = async () => {
      try{
        await api(`/api/tasks/${button.dataset.taskId}/accept`, {method:'POST'});
        await Promise.all([loadPublicTasks(), loadMyTasks()]);
        render();
        toast('已接受任務');
      }catch(error){ toast(error.message); }
    };
  });

  const taskCreateForm = $('#taskCreateForm');
  if(taskCreateForm){
    taskCreateForm.onsubmit = async event => {
      event.preventDefault();
      try{
        let rewards = {};
        try{
          rewards = JSON.parse($('#taskRewards').value || '{}');
        }catch{
          throw new Error('獎勵 JSON 格式錯誤');
        }

        await api('/api/admin/tasks', {
          method:'POST',
          body:JSON.stringify({
            title:$('#taskTitle').value,
            task_type:$('#taskType').value,
            target_user_id:Number($('#taskTargetUser').value || 0),
            min_tier:Number($('#taskMinTier').value || 1),
            description:$('#taskDescription').value,
            requirements:$('#taskRequirements').value,
            rewards
          })
        });

        await loadAdminTasks();
        render();
        toast('任務已發布');
      }catch(error){ toast(error.message); }
    };
  }

  $$('.complete-task').forEach(button => {
    button.onclick = async () => {
      let userId = Number(button.dataset.userId || 0);
      if(!userId){
        const input = window.prompt('請輸入要完成此公共任務的玩家 ID');
        if(input === null) return;
        userId = Number(input || 0);
      }
      if(!userId){
        toast('玩家 ID 不正確');
        return;
      }
      if(!window.confirm('確定標記此玩家完成任務並發放獎勵？')) return;
      try{
        await api(`/api/admin/tasks/${button.dataset.taskId}/complete`, {
          method:'POST',
          body:JSON.stringify({user_id:userId})
        });
        await Promise.all([loadAdminTasks(), loadPublicTasks(), loadMyTasks()]);
        render();
        toast('任務已完成並發放獎勵');
      }catch(error){ toast(error.message); }
    };
  });

  $$('.delete-task').forEach(button => {
    button.onclick = async () => {
      if(!window.confirm('確定刪除此任務？')) return;
      try{
        await api(`/api/admin/tasks/${button.dataset.taskId}`, {method:'DELETE'});
        await loadAdminTasks();
        render();
        toast('任務已刪除');
      }catch(error){ toast(error.message); }
    };
  });

  const createRoom =
    $('#createRoom');

  if(createRoom){

    createRoom.onclick =
      () =>
        openPrompt(
          '建立跑團',
          '跑團名稱',
          '新的跑團',
          async name => {

            const data =
              await api(
                '/api/rooms',
                {
                  method:'POST',
                  body:
                    JSON.stringify({
                      name
                    })
                }
              );

            state.room =
              data;

            state.view =
              'room';

            state.socket.emit(
              'room:enter',
              {
                roomId:
                  data.room.id
              }
            );

            render();

          }
        );
  }


  const joinRoom =
    $('#joinRoom');

  if(joinRoom){

    joinRoom.onclick =
      () =>
        openPrompt(
          '加入房間',
          '6 碼房間代碼',
          '',
          async code => {

            const data =
              await api(
                '/api/rooms/join',
                {
                  method:'POST',
                  body:
                    JSON.stringify({
                      code:
                        code
                          .trim()
                          .toUpperCase()
                    })
                }
              );

            state.room =
              data;

            state.view =
              'room';

            state.socket.emit(
              'room:enter',
              {
                roomId:
                  data.room.id
              }
            );

            render();

          }
        );
  }


  const openAdmin =
    $('#openAdmin');

  if(openAdmin){

    openAdmin.onclick =
      () => {

        state.view =
          'admin';

        render();

      };
  }


  const refreshAdmin =
    $('#refreshAdmin');

  if(refreshAdmin){

    refreshAdmin.onclick =
      async () => {

        try{

          await loadAdminData();

          render();

          toast(
            '全站資料已重新整理'
          );

        }catch(error){

          toast(
            error.message
          );

        }

      };
  }


  $$('.edit-character')
    .forEach(
      button => {

        button.onclick =
          () => {

            const character =
              state.adminCharacters
                .find(
                  item =>
                    String(item.id) ===
                    String(button.dataset.id)
                );

            if(!character){
              toast(
                '找不到角色卡'
              );

              return;
            }

            openCharacterEditor(
              character
            );

          };

      }
    );


  $$('.delete-user')
    .forEach(
      button => {

        button.onclick =
          () =>
            deleteUser(
              button.dataset.userId,
              button.dataset.username
            );

      }
    );


  const startCampaign =
    $('#startCampaign');

  if(startCampaign){

    startCampaign.onclick =
      async () => {

        try{

          const data =
            await api(
              `/api/rooms/${state.room.room.id}/start`,
              {
                method:'POST'
              }
            );

          state.room =
            data;

          render();

        }catch(error){

          toast(
            error.message
          );

        }

      };
  }


  const nextTurn =
    $('#nextTurn');

  if(nextTurn){

    nextTurn.onclick =
      async () => {

        try{

          const data =
            await api(
              `/api/rooms/${state.room.room.id}/next-turn`,
              {
                method:'POST'
              }
            );

          state.room =
            data;

          render();

        }catch(error){

          toast(
            error.message
          );

        }

      };
  }


  const chatForm =
    $('#chatForm');

  if(chatForm){

    chatForm.onsubmit =
      event => {

        event.preventDefault();

        const input =
          $('#chatInput');

        const text =
          input.value.trim();

        if(
          text &&
          state.socket &&
          state.room
        ){

          state.socket.emit(
            'chat:send',
            {
              roomId:
                state.room.room.id,

              text
            }
          );

          input.value =
            '';
        }

      };
  }


  const rollDice =
    $('#rollDice');

  if(rollDice){

    rollDice.onclick =
      () => {

        if(
          !state.socket ||
          !state.room
        ){
          toast(
            '請先加入房間'
          );

          return;
        }

        state.socket.emit(
          'dice:roll',
          {
            roomId:
              state.room.room.id,

            notation:
              $('#diceNotation').value,

            label:
              $('#diceLabel').value
          }
        );

      };
  }
}


/* =========================================================
   MODAL
========================================================= */

function closeModal(){

  $('#modal')
    .classList
    .add('hidden');
}


function openPrompt(
  title,
  label,
  value,
  callback
){

  $('#modalTitle')
    .textContent =
      title;

  $('#modalBody')
    .innerHTML = `

      <div class="field">

        <label>
          ${esc(label)}
        </label>

        <input
          id="modalInput"
          value="${esc(value)}"
          autofocus
        >

      </div>

    `;

  $('#modal')
    .classList
    .remove('hidden');

  $('#modalCancel').onclick =
    closeModal;

  $('#modalOk').onclick =
    async () => {

      try{

        const value =
          $('#modalInput')
            .value
            .trim();

        await callback(
          value
        );

        closeModal();

      }catch(error){

        toast(
          error.message
        );

      }

    };
}


/* =========================================================
   AUTH UI
========================================================= */

$$('.auth-tabs .tab')
  .forEach(
    tab => {

      tab.onclick =
        () => {

          $$('.auth-tabs .tab')
            .forEach(
              item =>
                item.classList.remove(
                  'active'
                )
            );

          tab.classList.add(
            'active'
          );

          state.authMode =
            tab.dataset.auth;

          $('#authSubmit')
            .textContent =
              state.authMode === 'login'
                ? '登入'
                : '註冊';

          $('#password')
            .autocomplete =
              state.authMode === 'login'
                ? 'current-password'
                : 'new-password';

        };

    }
  );


$('#authForm')
  .onsubmit =
    submitAuth;


$('#logout')
  .onclick =
    () => {

      if(state.socket){
        state.socket.disconnect();
      }

      localStorage.removeItem(
        'rpg_token'
      );

      state.token =
        null;

      location.reload();

    };


/* =========================================================
   START
========================================================= */

boot();

</script>

</body>
</html>
