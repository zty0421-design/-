/* =========================================================
   VIEW BINDING
========================================================= */

function bindView(){

  $$('[data-view]')
    .forEach(
      button => {

        button.onclick =
          () => {

            const target =
              button.dataset.view;

            if(
              target === 'admin' &&
              !state.user?.is_admin
            ){
              toast(
                '只有全站 DM 可以進入管理中心'
              );

              return;
            }

            state.view =
              target;

            render();

          };

      }
    );


  $$('[data-admin-view]')
    .forEach(
      button => {

        button.onclick =
          () => {

            state.adminView =
              button.dataset.adminView;

            render();

          };

      }
    );



  const editMyCharacter=$('#editMyCharacter');
  if(editMyCharacter) editMyCharacter.onclick=openMyCharacterEditor;

  const addSkillFromLibrary=$('#addSkillFromLibrary');
  if(addSkillFromLibrary) addSkillFromLibrary.onclick=openSkillPicker;

  $$('.adjust-class-resource').forEach(button=>{
    button.onclick=async()=>{
      try{
        const adminUserId=button.dataset.adminUserId;
        const endpoint=adminUserId
          ? `/api/admin/players/${adminUserId}/class-resource`
          : '/api/character/class-resource';
        const data=await api(endpoint,{
          method:'PATCH',
          body:JSON.stringify({
            key:button.dataset.key,
            delta:Number(button.dataset.delta)||0,
            room_id:adminUserId?null:(state.room?.room?.id||null)
          })
        });

        if(adminUserId){
          const character=state.adminCharacters.find(item=>String(item.user_id)===String(adminUserId));
          if(character && data.character){
            Object.assign(character,data.character);
          }
        }else{
          state.myCharacter=data.character;
        }
        render();
      }catch(error){toast(error.message);}
    };
  });

  $$('.set-class-resource').forEach(button=>{
    button.onclick=()=>{
      const adminUserId=button.dataset.adminUserId;
      const currentCharacter=adminUserId
        ? state.adminCharacters.find(item=>String(item.user_id)===String(adminUserId))
        : state.myCharacter;
      const resource=classResourcesList(currentCharacter).find(item=>item.key===button.dataset.key);
      if(!resource)return toast('找不到職業資源');

      openPrompt(
        `設定${button.dataset.name||'職業資源'}`,
        `目前 ${resource.current} / ${resource.max}`,
        String(resource.current),
        async value=>{
          const endpoint=adminUserId
            ? `/api/admin/players/${adminUserId}/class-resource`
            : '/api/character/class-resource';
          const data=await api(endpoint,{
            method:'PATCH',
            body:JSON.stringify({
              key:button.dataset.key,
              value:Number(value),
              room_id:adminUserId?null:(state.room?.room?.id||null)
            })
          });
          if(adminUserId){
            const character=state.adminCharacters.find(item=>String(item.user_id)===String(adminUserId));
            if(character && data.character)Object.assign(character,data.character);
          }else{
            state.myCharacter=data.character;
          }
          render();
        }
      );
    };
  });

  $$('.use-skill').forEach(button=>{
    button.onclick=async()=>{
      try{
        const data=await api(`/api/character/skills/${encodeURIComponent(button.dataset.skillId)}/use`,{
          method:'POST',
          body:JSON.stringify({room_id:state.room?.room?.id||null})
        });
        state.myCharacter=data.character;
        if(data.resource_change){
          toast(`${data.resource_change.name}：${data.resource_change.before} → ${data.resource_change.after}`);
        }else{
          toast('技能已使用');
        }
        render();
      }catch(error){toast(error.message);}
    };
  });

  $$('.adjust-fifth-resource').forEach(button=>{
    button.onclick=async()=>{
      try{
        const data=await api(
          '/api/character/fifth-resource',
          {
            method:'PATCH',
            body:
              JSON.stringify({
                delta:
                  Number(
                    button.dataset.delta
                  ) || 0
              })
          }
        );

        state.myCharacter=
          data.character;

        render();
      }catch(error){
        toast(error.message);
      }
    };
  });

  $$('.set-fifth-resource').forEach(button=>{
    button.onclick=()=>{
      const character=
        state.myCharacter;

      if(!character){
        return;
      }

      openPrompt(
        `設定${character.faction==='西國'?'信仰':'大道'}`,
        `目前值（0～${Number(character.fifth_max)||0}）`,
        String(
          Number(character.fifth_current)||0
        ),
        async value=>{
          const data=await api(
            '/api/character/fifth-resource',
            {
              method:'PATCH',
              body:
                JSON.stringify({
                  value:
                    Number(value)
                })
            }
          );

          state.myCharacter=
            data.character;

          render();
        }
      );
    };
  });

  $$('.use-summon-skill').forEach(button=>{
    button.onclick=()=>{
      const skill=
        (state.myCharacter?.skills||[])
          .find(
            item =>
              String(item.id) ===
              String(
                button.dataset.skillId
              )
          );

      if(!skill){
        toast('找不到技能');
        return;
      }

      openSummonPicker(
        skill
      );
    };
  });

  $$('.dismiss-summon').forEach(button=>{
    button.onclick=async()=>{
      if(!window.confirm('確定解除召喚？')){
        return;
      }

      try{
        const data=
          await api(
            `/api/character/summons/${button.dataset.id}/dismiss`,
            {
              method:'POST'
            }
          );

        state.mySummons=
          data.summons || [];

        if(data.character){
          state.myCharacter=data.character;
        }

        if(data.room){
          state.room=
            data.room;
        }

        render();
        toast('已解除召喚');
      }catch(error){
        toast(error.message);
      }
    };
  });

  $$('.remove-my-skill').forEach(button=>{
    button.onclick=async()=>{
      if(!window.confirm('確定從角色卡移除這個技能？')) return;
      try{
        const data=await api(`/api/character/skills/${encodeURIComponent(button.dataset.skillId)}`,{method:'DELETE'});
        state.myCharacter=data.character;render();toast('技能已移除');
      }catch(error){toast(error.message);}
    };
  });


  $$('.open-craft-skill').forEach(button=>{
    button.onclick=()=>{state.view='craft';render();};
  });

  const buyInventorySlot=$('#buyInventorySlot');
  if(buyInventorySlot){
    buyInventorySlot.onclick=async()=>{try{buyInventorySlot.disabled=true;const data=await api('/api/character/inventory-slot',{method:'POST'});state.myCharacter=data.character;render();toast('物品欄已增加 1 格');}catch(error){toast(error.message);render();}};
  }

  const refreshShop=$('#refreshShop');
  if(refreshShop){refreshShop.onclick=async()=>{try{await Promise.all([loadShop(),loadMyCharacter()]);render();toast('詭源商店已更新');}catch(error){toast(error.message);}};}

  $$('.buy-shop-item').forEach(button=>{button.onclick=async()=>{try{button.disabled=true;const data=await api(`/api/shop/${button.dataset.id}/buy`,{method:'POST'});state.myCharacter=data.character;await loadShop();render();toast(`購買成功：${data.item?.name||'商品'}`);}catch(error){toast(error.message);render();}};});

  const shopItemForm=$('#shopItemForm');
  if(shopItemForm){shopItemForm.onsubmit=async event=>{event.preventDefault();try{await api('/api/admin/shop',{method:'POST',body:JSON.stringify({name:$('#shopName').value,item_type:$('#shopType').value,price_weird:Number($('#shopPrice').value)||0,quantity:Number($('#shopQuantity').value)||1,description:$('#shopDescription').value})});await loadShop();render();toast('商品已加入詭源商店');}catch(error){toast(error.message);}};}

  $$('.delete-shop-item').forEach(button=>{button.onclick=async()=>{if(!window.confirm('確定刪除這個商品？'))return;try{await api(`/api/admin/shop/${button.dataset.id}`,{method:'DELETE'});await loadShop();render();toast('商品已刪除');}catch(error){toast(error.message);}};});

  const refreshRecipes=$('#refreshRecipes');
  if(refreshRecipes){
    refreshRecipes.onclick=async()=>{try{await Promise.all([loadRecipes(),loadMyCharacter()]);render();toast('合成資料已更新');}catch(error){toast(error.message);}};
  }

  $$('.craft-recipe').forEach(button=>{
    button.onclick=async()=>{
      try{
        button.disabled=true;
        const data=await api(`/api/recipes/${button.dataset.id}/craft`,{method:'POST'});
        state.myCharacter=data.character;
        await loadRecipes();
        render();
        toast(`合成完成：${data.recipe?.name||'成品'}`);
      }catch(error){toast(error.message);render();}
    };
  });

  const recipeForm=$('#recipeForm');
  if(recipeForm){
    const materialList=$('#recipeMaterialList');
    bindRecipeMaterialRows(materialList);
    $('#addRecipeMaterial').onclick=()=>{materialList.insertAdjacentHTML('beforeend',recipeMaterialRowHTML());bindRecipeMaterialRows(materialList);};
    const syncRecipeSkill=()=>{$('#rcSkill').disabled=$('#rcAccess').value!=='skill';};
    $('#rcAccess').onchange=syncRecipeSkill;syncRecipeSkill();
    recipeForm.onsubmit=async event=>{
      event.preventDefault();
      try{
        if($('#rcAccess').value==='skill'&&!$('#rcSkill').value)throw new Error('需要技能的配方必須選擇一個製作技能');
        await api('/api/admin/recipes',{method:'POST',body:JSON.stringify({name:$('#rcName').value,recipe_type:$('#rcOutputType').value,description:$('#rcDescription').value,materials:collectRecipeMaterials(materialList),output:{type:$('#rcOutputType').value,name:$('#rcOutputName').value,quantity:Number($('#rcOutputQty').value)||1},config:{access:$('#rcAccess').value,required_skill_template_id:Number($('#rcSkill').value)||0,currency_type:$('#rcCurrency').value,currency_cost:Number($('#rcCurrencyCost').value)||0}})});
        await loadRecipes();render();toast('配方已建立');
      }catch(error){toast(error.message);}
    };
  }

  $$('.delete-recipe').forEach(button=>{
    button.onclick=async()=>{if(!window.confirm('確定刪除這個配方？'))return;try{await api(`/api/admin/recipes/${button.dataset.id}`,{method:'DELETE'});await loadRecipes();render();toast('配方已刪除');}catch(error){toast(error.message);}};
  });

  const skillTemplateForm=$('#skillTemplateForm');
  if(skillTemplateForm){
    const summonToggle=$('#stSummon');
    const summonOptions=$('#stSummonOptions');
    const autoContainer=$('#stProfessionAutoList');
    bindSkillProfessionAutoRows(autoContainer);
    $('#addStProfessionAuto').onclick=()=>{autoContainer.insertAdjacentHTML('beforeend',skillProfessionAutoRuleRowHTML());bindSkillProfessionAutoRows(autoContainer);};

    const syncSummonOptions=()=>{
      if(summonOptions){
        summonOptions.classList.toggle(
          'hidden',
          !summonToggle.checked
        );
      }
    };

    summonToggle.onchange=
      syncSummonOptions;

    syncSummonOptions();

    skillTemplateForm.onsubmit=async event=>{
      event.preventDefault();

      try{
        const summonTemplateIds=
          $$('#stSummonOptions .skill-summon-template:checked')
            .map(
              input =>
                Number(input.value)
            );

        const created=await api(
          '/api/admin/skill-templates',
          {
            method:'POST',
            body:
              JSON.stringify({
                name:
                  $('#stName').value,
                category:
                  $('#stCategory').value,
                skill_type:
                  $('#stType').value,
                level:
                  Number(
                    $('#stLevel').value
                  ) || 1,
                check_name:
                  $('#stCheck').value,
                damage_formula:
                  $('#stDamage').value,
                extra_tag:
                  $('#stExtraTag').value,
                resources:
                  skillResourcePayload(
                    $('#stResourceKey').value,
                    $('#stResourceOperation').value,
                    $('#stResourceAmount').value
                  ),
                summon_tag:
                  $('#stSummon').checked,
                summon_template_ids:
                  summonTemplateIds,
                learn_cost:{
                  mode:$('#stLearnMode').value,
                  item_name:$('#stLearnItem').value,
                  item_quantity:Number($('#stLearnItemQty').value)||1,
                  weird_coins:Number($('#stLearnWeird').value)||0,
                  game_coins:Number($('#stLearnGame').value)||0,
                  skill_points:Number($('#stLearnSkillPoints').value)||0,
                  required_profession_id:Number($('#stLearnProfession').value)||0,
                  required_profession_rank:$('#stLearnRank').value,
                  required_profession_level:Number($('#stLearnLevel').value)||1
                },
                data:{
                  craft_tag:$('#stCraft').checked,
                  unlock_game_coin:$('#stUnlockGameCoin').checked,
                  unlock_inventory_expansion:$('#stUnlockInventoryExpansion').checked
                },
                description:
                  $('#stDescription').value
              })
          }
        );

        if(created?.skill?.id){
          await syncSkillProfessionAutoRules(created.skill.id,collectSkillProfessionAutoRules(autoContainer));
        }
        await Promise.all([loadSkillTemplates(),loadProfessions()]);
        render();
        toast('技能已加入資料庫');
      }catch(error){
        toast(error.message);
      }
    };
  }

  $$('.edit-skill-template').forEach(button=>{
    button.onclick=()=>{
      const skill=
        (state.skillTemplates||[])
          .find(
            item =>
              String(item.id) ===
              String(button.dataset.id)
          );

      openSkillTemplateEditor(
        skill
      );
    };
  });

  $$('.delete-skill-template').forEach(button=>{
    button.onclick=async()=>{
      if(!window.confirm('確定刪除此技能資料？已經加到角色卡的技能不會自動消失。'))return;
      try{await api(`/api/admin/skill-templates/${button.dataset.id}`,{method:'DELETE'});await loadSkillTemplates();render();toast('技能資料已刪除');}catch(error){toast(error.message);}
    };
  });

  const professionForm=$('#professionForm');
  if(professionForm){
    const resourceContainer=$('#pfResourceList');
    bindProfessionResourceEditor(resourceContainer);

    const addResource=$('#addPfResource');
    if(addResource){
      addResource.onclick=()=>addProfessionResourceRow(resourceContainer,{});
    }
    const autoSkillContainer=$('#pfAutoSkillList');
    bindProfessionAutoSkillRows(autoSkillContainer);
    const addAutoSkill=$('#addPfAutoSkill');
    if(addAutoSkill){addAutoSkill.onclick=()=>{autoSkillContainer.insertAdjacentHTML('beforeend',professionAutoSkillRowHTML());bindProfessionAutoSkillRows(autoSkillContainer);};}

    professionForm.onsubmit=async event=>{
      event.preventDefault();
      try{
        await api('/api/admin/professions',{
          method:'POST',
          body:JSON.stringify({
            name:$('#pfName').value,
            category:$('#pfCategory').value,
            rank:$('#pfRank').value,
            description:$('#pfDescription').value,
            special_resources:collectProfessionResources(resourceContainer),
            auto_skills:collectProfessionAutoSkills(autoSkillContainer)
          })
        });
        await Promise.all([loadProfessions(),loadMyCharacter()]);
        render();
        toast('職業已加入資料庫');
      }catch(error){toast(error.message);}
    };
  }

  $$('.edit-profession').forEach(button=>{
    button.onclick=()=>{
      const profession=(state.professions||[]).find(item=>String(item.id)===String(button.dataset.id));
      openProfessionEditor(profession);
    };
  });

  $$('.delete-profession').forEach(button=>{
    button.onclick=async()=>{
      if(!window.confirm('確定刪除此職業資料？角色卡上已選擇的名稱會保留，但該職業的特殊資源會移除。'))return;
      try{await api(`/api/admin/professions/${button.dataset.id}`,{method:'DELETE'});await Promise.all([loadProfessions(),loadMyCharacter()]);render();toast('職業資料已刪除');}catch(error){toast(error.message);}
    };
  });

  const summonTemplateForm=$('#summonTemplateForm');
  if(summonTemplateForm){
    summonTemplateForm.onsubmit=async event=>{
      event.preventDefault();
      try{await api('/api/admin/summon-templates',{method:'POST',body:JSON.stringify({name:$('#smName').value,description:$('#smDescription').value,growth_mode:$('#smGrowth').value,control_mode:$('#smControl').value,behavior_mode:$('#smBehavior').value,self_ai_level:Number($('#smAi').value)||0,language_level:Number($('#smLanguage').value)||0,speech_enabled:$('#smSpeech').checked,loyalty:Number($('#smLoyalty').value)||0})});await loadSummonTemplates();render();toast('召喚物模板已建立');}catch(error){toast(error.message);}
    };
  }

  $$('.delete-summon-template').forEach(button=>{
    button.onclick=async()=>{
      if(!window.confirm('確定刪除此召喚物模板？'))return;
      try{await api(`/api/admin/summon-templates/${button.dataset.id}`,{method:'DELETE'});await loadSummonTemplates();render();toast('召喚物模板已刪除');}catch(error){toast(error.message);}
    };
  });

  const refreshTasks = $('#refreshTasks');
  if(refreshTasks){
    refreshTasks.onclick = async () => {
      try{
        await loadPublicTasks();
        render();
      }catch(error){ toast(error.message); }
    };
  }

  const refreshMyTasks = $('#refreshMyTasks');
  if(refreshMyTasks){
    refreshMyTasks.onclick = async () => {
      try{
        await loadMyTasks();
        render();
      }catch(error){ toast(error.message); }
    };
  }

  $$('.accept-task').forEach(button => {
    button.onclick = async () => {
      try{
        await api(`/api/tasks/${button.dataset.taskId}/accept`, {method:'POST'});
        await Promise.all([loadPublicTasks(), loadMyTasks()]);
        render();
        toast('已接受任務');
      }catch(error){ toast(error.message); }
    };
  });

  const taskCreateForm=$('#taskCreateForm');
  if(taskCreateForm){
    const itemContainer=$('#taskRewardItems');
    bindTaskRewardItems(itemContainer);
    $('#addTaskRewardItem').onclick=()=>{itemContainer.insertAdjacentHTML('beforeend',taskRewardItemRowHTML());bindTaskRewardItems(itemContainer);};
    const syncTaskType=()=>{const type=$('#taskType').value;$('#taskTargetUser').disabled=type==='public';$('#taskProfession').disabled=type!=='profession';};
    $('#taskType').onchange=syncTaskType;syncTaskType();

    taskCreateForm.onsubmit=async event=>{
      event.preventDefault();
      try{
        const type=$('#taskType').value;
        if(type!=='public'&&!$('#taskTargetUser').value)throw new Error('這種任務必須指定玩家');
        if(type==='profession'&&!$('#taskProfession').value)throw new Error('職業升階任務必須選擇職業');
        const professionGrant=Number($('#taskRewardProfessionGrant').value)||0;
        const professionLevel=Number($('#taskRewardProfessionLevel').value)||0;
        const rewards={
          experience:Number($('#taskRewardExperience').value)||0,
          attribute_points:Number($('#taskRewardAttribute').value)||0,
          skill_points:Number($('#taskRewardSkillPoints').value)||0,
          weird_coins:Number($('#taskRewardWeirdCoins').value)||0,
          game_coins:Number($('#taskRewardGameCoins').value)||0,
          inventory:collectTaskRewardItems(itemContainer),
          equipment:$('#taskRewardEquipment').value.split('\n').map(x=>x.trim()).filter(Boolean),
          weapons:$('#taskRewardWeapons').value.split('\n').map(x=>x.trim()).filter(Boolean),
          skill_template_ids:$$('.task-reward-skill:checked').map(input=>Number(input.value)).filter(Boolean),
          profession_grants:professionGrant?[{profession_id:professionGrant,role:$('#taskRewardProfessionRole').value}]:[],
          profession_level_ups:professionLevel?[professionLevel]:[]
        };
        await api('/api/admin/tasks',{method:'POST',body:JSON.stringify({title:$('#taskTitle').value,task_type:type,target_user_id:Number($('#taskTargetUser').value||0),profession_id:Number($('#taskProfession').value||0),min_tier:Number($('#taskMinTier').value||1),description:$('#taskDescription').value,requirements:$('#taskRequirements').value,rewards})});
        await Promise.all([loadAdminTasks(),loadMyTasks(),loadPublicTasks(),loadAdminCharacters()]);render();toast('任務已發布');
      }catch(error){toast(error.message);}
    };
  }

  $$('.complete-task').forEach(button => {
    button.onclick = async () => {
      let userId = Number(button.dataset.userId || 0);
      if(!userId){
        const input = window.prompt('請輸入要完成此公共任務的玩家 ID');
        if(input === null) return;
        userId = Number(input || 0);
      }
      if(!userId){
        toast('玩家 ID 不正確');
        return;
      }
      if(!window.confirm('確定標記此玩家完成任務並發放獎勵？')) return;
      try{
        await api(`/api/admin/tasks/${button.dataset.taskId}/complete`, {
          method:'POST',
          body:JSON.stringify({user_id:userId})
        });
        await Promise.all([loadAdminTasks(),loadPublicTasks(),loadMyTasks(),loadAdminCharacters(),loadMyCharacter(),loadProfessions(),loadSkillTemplates()]);
        render();
        toast('任務已完成並發放獎勵');
      }catch(error){ toast(error.message); }
    };
  });

  $$('.delete-task').forEach(button => {
    button.onclick = async () => {
      if(!window.confirm('確定刪除此任務？')) return;
      try{
        await api(`/api/admin/tasks/${button.dataset.taskId}`, {method:'DELETE'});
        await loadAdminTasks();
        render();
        toast('任務已刪除');
      }catch(error){ toast(error.message); }
    };
  });

  const createRoom =
    $('#createRoom');

  if(createRoom){

    createRoom.onclick =
      () =>
        openPrompt(
          '建立跑團',
          '跑團名稱',
          '新的跑團',
          async name => {

            const data =
              await api(
                '/api/rooms',
                {
                  method:'POST',
                  body:
                    JSON.stringify({
                      name
                    })
                }
              );

            state.room =
              data;

            state.view =
              'room';

            state.socket.emit(
              'room:enter',
              {
                roomId:
                  data.room.id
              }
            );

            render();

          }
        );
  }


  const joinRoom =
    $('#joinRoom');

  if(joinRoom){

    joinRoom.onclick =
      () =>
        openPrompt(
          '加入房間',
          '6 碼房間代碼',
          '',
          async code => {

            const data =
              await api(
                '/api/rooms/join',
                {
                  method:'POST',
                  body:
                    JSON.stringify({
                      code:
                        code
                          .trim()
                          .toUpperCase()
                    })
                }
              );

            state.room =
              data;

            state.view =
              'room';

            state.socket.emit(
              'room:enter',
              {
                roomId:
                  data.room.id
              }
            );

            render();

          }
        );
  }


  const openAdmin =
    $('#openAdmin');

  if(openAdmin){

    openAdmin.onclick =
      () => {

        state.view =
          'admin';

        render();

      };
  }


  const refreshAdmin =
    $('#refreshAdmin');

  if(refreshAdmin){

    refreshAdmin.onclick =
      async () => {

        try{

          await loadAdminData();

          render();

          toast(
            '全站資料已重新整理'
          );

        }catch(error){

          toast(
            error.message
          );

        }

      };
  }


  $$('.edit-character')
    .forEach(
      button => {

        button.onclick =
          () => {

            const character =
              state.adminCharacters
                .find(
                  item =>
                    String(item.id) ===
                    String(button.dataset.id)
                );

            if(!character){
              toast(
                '找不到角色卡'
              );

              return;
            }

            openCharacterEditor(
              character
            );

          };

      }
    );


  $$('.delete-user')
    .forEach(
      button => {

        button.onclick =
          () =>
            deleteUser(
              button.dataset.userId,
              button.dataset.username
            );

      }
    );


  const startCampaign =
    $('#startCampaign');

  if(startCampaign){

    startCampaign.onclick =
      async () => {

        try{

          const data =
            await api(
              `/api/rooms/${state.room.room.id}/start`,
              {
                method:'POST'
              }
            );

          state.room =
            data;

          render();

        }catch(error){

          toast(
            error.message
          );

        }

      };
  }


  const nextTurn =
    $('#nextTurn');

  if(nextTurn){

    nextTurn.onclick =
      async () => {

        try{

          const data =
            await api(
              `/api/rooms/${state.room.room.id}/next-turn`,
              {
                method:'POST'
              }
            );

          state.room =
            data;

          render();

        }catch(error){

          toast(
            error.message
          );

        }

      };
  }


  const chatForm =
    $('#chatForm');

  if(chatForm){

    chatForm.onsubmit =
      event => {

        event.preventDefault();

        const input =
          $('#chatInput');

        const text =
          input.value.trim();

        if(
          text &&
          state.socket &&
          state.room
        ){

          state.socket.emit(
            'chat:send',
            {
              roomId:
                state.room.room.id,

              text
            }
          );

          input.value =
            '';
        }

      };
  }


  const rollDice =
    $('#rollDice');

  if(rollDice){

    rollDice.onclick =
      () => {

        if(
          !state.socket ||
          !state.room
        ){
          toast(
            '請先加入房間'
          );

          return;
        }

        state.socket.emit(
          'dice:roll',
          {
            roomId:
              state.room.room.id,

            notation:
              $('#diceNotation').value,

            label:
              $('#diceLabel').value
          }
        );

      };
  }
}


/* =========================================================
   MODAL
========================================================= */

function closeModal(){

  $('#modal')
    .classList
    .add('hidden');
}


function openPrompt(
  title,
  label,
  value,
  callback
){

  $('#modalTitle')
    .textContent =
      title;

  $('#modalBody')
    .innerHTML = `

      <div class="field">

        <label>
          ${esc(label)}
        </label>

        <input
          id="modalInput"
          value="${esc(value)}"
          autofocus
        >

      </div>

    `;

  $('#modal')
    .classList
    .remove('hidden');

  $('#modalCancel').onclick =
    closeModal;

  $('#modalOk').onclick =
    async () => {

      try{

        const value =
          $('#modalInput')
            .value
            .trim();

        await callback(
          value
        );

        closeModal();

      }catch(error){

        toast(
          error.message
        );

      }

    };
}


/* =========================================================
   AUTH UI
========================================================= */

$$('.auth-tabs .tab')
  .forEach(
    tab => {

      tab.onclick =
        () => {

          $$('.auth-tabs .tab')
            .forEach(
              item =>
                item.classList.remove(
                  'active'
                )
            );

          tab.classList.add(
            'active'
          );

          state.authMode =
            tab.dataset.auth;

          $('#authSubmit')
            .textContent =
              state.authMode === 'login'
                ? '登入'
                : '註冊';

          $('#password')
            .autocomplete =
              state.authMode === 'login'
                ? 'current-password'
                : 'new-password';

        };

    }
  );


$('#authForm')
  .onsubmit =
    submitAuth;


$('#logout')
  .onclick =
    () => {

      if(state.socket){
        state.socket.disconnect();
      }

      localStorage.removeItem(
        'rpg_token'
      );

      state.token =
        null;

      location.reload();

    };


/* =========================================================
   START
========================================================= */

boot();

</script>

</body>
</html>
