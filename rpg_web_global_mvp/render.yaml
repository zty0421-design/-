services:
  - type: web
    name: trpg-online
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: trpg-online-db
          property: connectionString
      - key: PGSSL
        value: require

databases:
  - name: trpg-online-db
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "18"
