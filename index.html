// [前端功能備註｜召喚物] openSummonPicker：負責此前端功能的資料處理或互動。修改 UI 時可直接搜尋此函式名稱。
function openSummonPicker(skill){
  const allowedIds=
    skillSummonTemplateIds(
      skill
    );

  const templates=
    allowedIds
      .map(id=>
        (state.summonTemplates||[])
          .find(
            item =>
              String(item.id) ===
              String(id)
          )
      )
      .filter(Boolean);

  if(!templates.length){
    toast('這個召喚技能還沒有設定可召喚的召喚物，請 DM 修改技能');
    return;
  }

  $('#modalTitle').textContent=
    `使用召喚技能：${skill.name}`;

  $('#modalBody').innerHTML=`
    <div class="field">
      <label>要召喚什麼？</label>
      <select id="summonChoice">
        ${templates.map(template=>`
          <option value="${template.id}">
            ${esc(template.name)}
          </option>
        `).join('')}
      </select>
    </div>

    <div id="summonPreview" class="skill-card-inline"></div>

    <div class="muted">
      ${
        state.room?.room
          ? `召喚後會出現在目前房間「${esc(state.room.room.name)}」。`
          : '目前沒有進入房間，召喚物會先存在於你的角色名下。'
      }
    </div>

    <div id="summonError" class="error"></div>
  `;

  const refresh=()=>{
    const template=
      templates.find(
        item =>
          String(item.id) ===
          String(
            $('#summonChoice').value
          )
      );

    if(!template){
      $('#summonPreview').innerHTML=
        '';
      return;
    }

    const controlLabel={
      manual:'手動',
      assist:'半自動',
      auto:'全自動'
    };

    $('#summonPreview').innerHTML=`
      <b>${esc(template.name)}</b>
      <div class="muted">
        控制：${controlLabel[template.control_mode]||'手動'}
        · AI Lv.${Number(template.self_ai_level)||0}
        · 忠誠 ${Number(template.loyalty)||0}
      </div>
      ${
        template.description
          ? `<div class="muted">${esc(template.description)}</div>`
          : ''
      }
    `;
  };

  $('#summonChoice').onchange=
    refresh;

  refresh();

  $('#modal')
    .classList
    .remove('hidden');

  $('#modalCancel').onclick=
    closeModal;

  $('#modalOk').onclick=
    async()=>{
      try{
        const templateId=
          Number(
            $('#summonChoice').value
          );

        const data=
          await api(
            `/api/character/skills/${encodeURIComponent(skill.id)}/summon`,
            {
              method:'POST',
              body:
                JSON.stringify({
                  template_id:
                    templateId,
                  room_id:
                    state.room?.room?.id ||
                    null
                })
            }
          );

        state.mySummons=
          data.summons ||
          state.mySummons;

        if(data.room){
          state.room=
            data.room;
        }

        closeModal();
        render();

        toast(
          `已召喚 ${data.summon?.name||'召喚物'}`
        );
      }catch(error){
        $('#summonError').textContent=
          error.message;
      }
    };
}

      const adminAvatarUrl=$('#edit_avatar_url').value.trim();
      if(adminAvatarFile)await uploadAvatarFile(`/api/admin/players/${character.user_id}/avatar/upload`,adminAvatarFile);
      else await api(`/api/admin/players/${character.user_id}/avatar`,{method:'PATCH',body:JSON.stringify({avatar_url:adminAvatarUrl})});
      await Promise.all([loadAdminCharacters(),loadMyCharacter()]);
      closeModal();render();toast('角色卡已修改');
    }catch(error){$('#editError').textContent=error.message;}
  };
}

// [前端功能備註｜DM／玩家頭像] openAdminAvatarEditor：DM 可直接選圖片上傳或貼 URL；權限與真實圖片格式由 C++ 驗證。
function openAdminAvatarEditor(character){
  if(!character){toast('找不到角色卡');return;}
  $('#modalTitle').textContent=`修改玩家頭像：${character.name||character.username||''}`;
  $('#modalBody').innerHTML=`
    <div class="muted">帳號：@${esc(character.username||'')} · 可直接上傳圖片或貼圖片網址。</div>
    <div class="section" style="display:flex;justify-content:center">
      <div id="adminAvatarPreview" style="width:128px;height:128px;border-radius:22px;overflow:hidden;display:grid;place-items:center;background:rgba(255,255,255,.06);font-size:42px">
        ${character.avatar_url?`<img src="${esc(character.avatar_url)}" alt="頭像預覽" style="width:100%;height:100%;object-fit:cover">`:esc(String(character.name||'?').slice(0,1))}
      </div>
    </div>
    <div class="field section"><label>直接上傳圖片</label><input id="adminAvatarFile" type="file" accept="image/jpeg,image/png,image/webp"><div class="muted">支援 JPG／PNG／WebP，最大 5 MB。選了圖片時會優先使用上傳檔案。</div></div>
    <div class="field section"><label>或使用頭像網址</label><input id="adminAvatarUrl" maxlength="2048" value="${esc(character.avatar_url||'')}" placeholder="https://..."><div class="muted">若沒有選檔案，會使用此網址；清空後儲存即可移除頭像。</div></div>
    <div id="adminAvatarError" class="error"></div>`;
  const input=$('#adminAvatarUrl');
  const fileInput=$('#adminAvatarFile');
  input.oninput=()=>{if(fileInput.files?.length)return;const value=input.value.trim();$('#adminAvatarPreview').innerHTML=value?`<img src="${esc(value)}" alt="頭像預覽" style="width:100%;height:100%;object-fit:cover">`:esc(String(character.name||'?').slice(0,1));};
  fileInput.onchange=()=>{const file=fileInput.files?.[0];if(file)previewAvatarFile(file,'#adminAvatarPreview',String(character.name||'?').slice(0,1));else input.oninput();};
  $('#modal').classList.remove('hidden');
  $('#modalCancel').onclick=closeModal;
  $('#modalOk').onclick=async()=>{
    try{
      const file=fileInput.files?.[0]||null;
      const data=file
        ? await uploadAvatarFile(`/api/admin/players/${character.user_id}/avatar/upload`,file)
        : await api(`/api/admin/players/${character.user_id}/avatar`,{method:'PATCH',body:JSON.stringify({avatar_url:input.value.trim()})});
      const updated=data.character||{};
      const index=(state.adminCharacters||[]).findIndex(item=>String(item.id)===String(character.id));
      if(index>=0)state.adminCharacters[index]={...state.adminCharacters[index],...updated,username:character.username,is_admin:character.is_admin};
      if(String(state.user?.id)===String(character.user_id)&&state.myCharacter)state.myCharacter={...state.myCharacter,...updated};
      closeModal();render();toast(file?'玩家頭像圖片已上傳':'玩家頭像已修改');
    }catch(error){$('#adminAvatarError').textContent=error.message;}
  };
}

// [前端功能備註｜共用工具] deleteUser：負責刪除或移除資料。修改 UI 時可直接搜尋此函式名稱。
async function deleteUser(
  userId,
  username
){

  if(
    String(userId) ===
    String(state.user.id)
  ){

    toast(
      '不能刪除目前登入中的 DM'
    );

    return;
  }

  const confirmed =
    window.confirm(
      `確定要刪除帳號「${username}」嗎？\n\n此操作會刪除該玩家的永久角色卡，而且無法復原。`
    );

  if(!confirmed){
    return;
  }

  try{

    await api(
      `/api/admin/users/${userId}`,
      {
        method:'DELETE'
      }
    );

    await loadAdminData();

    render();

    toast(
      `帳號「${username}」已刪除`
    );

  }catch(error){

    toast(
      error.message
    );
  }
}

// [前端功能備註｜NPC] openNpcInteraction：負責此前端功能的資料處理或互動。修改 UI 時可直接搜尋此函式名稱。
async function openNpcInteraction(npcId){
  const roomId=state.room?.room?.id;
  if(!roomId)return toast('請先進入房間');
  try{
    let data=await api(`/api/rooms/${roomId}/npcs/${npcId}/interact`);
    let lastReply='';
    let lastGrantedTask=null;
    const refreshData=async()=>{
      data=await api(`/api/rooms/${roomId}/npcs/${npcId}/interact`);
    };
    const draw=()=>{
      const d=data.dialogues||[],shop=data.shop_items||[];
      $('#modalTitle').textContent=`💬 ${data.npc?.name||'NPC'}`;
      $('#modalBody').innerHTML=`${data.faction?`<div class="muted">🏛️ ${esc(data.faction.name)} · 你的聲望 ${Number(data.reputation)||0}</div>`:''}<div class="muted section">NPC 態度：<b>${esc(data.attitude?.label||'中立')}</b>（${Number(data.attitude?.score)||0}） · 好感 ${Number(data.relationship?.affinity)||0} · 信任 ${Number(data.relationship?.trust)||0} · 恐懼 ${Number(data.relationship?.fear)||0} · 敵意 ${Number(data.relationship?.hostility)||0}</div><div class="section"><h3>對話</h3><div class="user-list">${d.length?d.map(x=>`<button class="btn secondary npc-dialogue-choice" data-id="${x.id}" style="text-align:left">${esc(x.choice_text)}</button>`).join(''):'<div class="muted">目前沒有新的對話選項。</div>'}</div></div><div class="section"><h3>商店</h3><div class="user-list">${shop.length?shop.map(i=>`<div class="user-row"><div><b>${esc(i.name)}</b><div class="muted">${i.currency==='game'?'🎮 遊戲幣':'🪙 詭幣'} ${Number(i.discount_percent)>0?`<s>${Number(i.base_price)||0}</s> → <b>${Number(i.effective_price)||0}</b>（-${Number(i.discount_percent)||0}%）`:`${Number(i.effective_price??i.price)||0}`} · ×${Number(i.quantity)||1}${Number(i.remaining)>=0?` · 剩餘 ${Number(i.remaining)}`:''}</div>${i.description?`<div class="muted">${esc(i.description)}</div>`:''}${i.lock_reason?`<div class="danger-text">${esc(i.lock_reason)}</div>`:''}</div><button class="btn small npc-shop-buy" data-id="${i.id}" ${i.can_buy?'':'disabled'}>購買</button></div>`).join(''):'<div class="muted">這名 NPC 沒有販售商品。</div>'}</div></div><div id="npcReplyBox" class="section">${lastReply?`<div class="event"><b>${esc(data.npc?.name||'NPC')}</b><div style="white-space:pre-wrap">${esc(lastReply)}</div>${lastGrantedTask?`<div class="muted">📜 已取得任務：${esc(lastGrantedTask.title)}</div>`:''}</div>`:''}</div>`;
      $$('.npc-dialogue-choice').forEach(btn=>btn.onclick=async()=>{
        try{
          btn.disabled=true;
          const r=await api(`/api/rooms/${roomId}/npcs/${npcId}/dialogue/${btn.dataset.id}`,{method:'POST'});
          lastReply=r.reply||'';
          lastGrantedTask=r.granted_task||null;
          await Promise.all([loadMyTasks(),loadPublicTasks(),loadFactions(),loadRoomWorld()]);
          await refreshData();
          draw();
        }catch(error){btn.disabled=false;toast(error.message);}
      });
      $$('.npc-shop-buy').forEach(btn=>btn.onclick=async()=>{
        try{
          btn.disabled=true;
          await api(`/api/rooms/${roomId}/npcs/${npcId}/shop/${btn.dataset.id}/buy`,{method:'POST'});
          await Promise.all([loadMyCharacter(),loadFactions()]);
          await refreshData();
          draw();
          toast('購買成功');
        }catch(error){btn.disabled=false;toast(error.message);}
      });
    };
    $('#modal').classList.remove('hidden');
    $('#modalCancel').onclick=closeModal;
    $('#modalOk').onclick=closeModal;
    draw();
  }catch(error){toast(error.message);}
}

function aiBehaviorOptions(value){const list=[['balanced','平衡'],['aggressive','進攻'],['defensive','防守'],['random','隨機'],['story','劇情']];return list.map(([v,t])=>`<option value="${v}" ${v===value?'selected':''}>${t}</option>`).join('');}
// [前端功能備註｜Boss] parseBossPhasesUI：負責整理／轉換表單或資料格式。修改 UI 時可直接搜尋此函式名稱。
function parseBossPhasesUI(text){return String(text||'').split('\n').map(x=>x.trim()).filter(Boolean).map(line=>{const [name,trigger='hp_percent',raw='50',mult='1',ai='aggressive',skills='',heal='0']=line.split('|').map(x=>x.trim());const o={name,trigger_type:trigger,damage_multiplier:Number(mult)||1,ai_behavior:ai,skills:skills.split(',').map(x=>x.trim()).filter(Boolean),heal_percent:Math.max(0,Math.min(100,Number(heal)||0))};if(trigger==='time'){const [h,m]=raw.split(':').map(Number);o.trigger_minute=Math.max(0,Math.min(1439,(h||0)*60+(m||0)));}else if(trigger==='manual'){}else{o.hp_percent=Math.max(0,Math.min(100,Number(raw)||50));}return o;});}
// [前端功能備註｜Boss] formatBossPhasesUI：負責此前端功能的資料處理或互動。修改 UI 時可直接搜尋此函式名稱。
function formatBossPhasesUI(list){return (Array.isArray(list)?list:[]).map(p=>{const raw=p.trigger_type==='time'?minuteClockText(p.trigger_minute):p.trigger_type==='manual'?'':Number(p.threshold??p.hp_percent)||50;return `${p.name||'階段'}|${p.trigger_type||'hp_percent'}|${raw}|${Number(p.damage_multiplier)||1}|${p.ai_behavior||'aggressive'}|${(p.skills||[]).join(',')}|${Number(p.heal_percent)||0}`;}).join('\n');}

function combatDownedAllies(){
  const players=(state.room?.members||[]).filter(m=>m.role!=='gm' && (Number(m.hp)||0)<=0).map(m=>({type:'player',id:Number(m.id),name:m.display_name||m.username||'玩家',hp:Number(m.hp)||0,max_hp:Number(m.max_hp)||0}));
  const npcs=(state.roomWorld?.npcs||[]).filter(n=>String(n.combat_side)==='ally' && Number(n.current_hp||0)<=0).map(n=>({type:'npc',id:Number(n.id),name:n.name||'NPC',hp:Number(n.current_hp)||0,max_hp:Number(n.max_hp)||0}));
  return [...players,...npcs];

// [前端功能備註｜戰鬥／回合] combatTargetPool：負責此前端功能的資料處理或互動。修改 UI 時可直接搜尋此函式名稱。
function combatTargetPool(relation='enemy',includeDowned=false){
  const out=[];
  if(relation==='enemy'){
    for(const m of (state.roomWorld?.monsters||[])){
      const alive=m.status==='encountered'&&Number(m.current_hp??1)>0;if(!alive&&!includeDowned)continue;
      out.push({type:'monster',id:Number(m.id),name:m.name||'未知怪物',side:'enemy',hp:m.current_hp,max_hp:m.max_hp,revealed:m.revealed!==false});
    }
    for(const n of (state.roomWorld?.npcs||[])){
      if(String(n.combat_side)!=='enemy')continue;const alive=String(n.room_status||n.status||'active')==='active'&&Number(n.current_hp??1)>0;if(!alive&&!includeDowned)continue;
      out.push({type:'npc',id:Number(n.id),name:n.name||'NPC',side:'enemy',hp:n.current_hp,max_hp:n.max_hp,revealed:true});
    }
  }else{
    for(const m of (state.room?.members||[])){
      if(m.role==='gm')continue;const alive=Number(m.hp||0)>0;if(!alive&&!includeDowned)continue;
      out.push({type:'player',id:Number(m.id),name:m.display_name||m.username||'玩家',side:'ally',hp:m.hp,max_hp:m.max_hp,revealed:true});
    }
    for(const n of (state.roomWorld?.npcs||[])){
      if(String(n.combat_side)!=='ally')continue;const alive=String(n.room_status||n.status||'active')==='active'&&Number(n.current_hp||0)>0;if(!alive&&!includeDowned)continue;
      out.push({type:'npc',id:Number(n.id),name:n.name||'NPC',side:'ally',hp:n.current_hp,max_hp:n.max_hp,revealed:true});
    }
  }
  return out;
}

// [前端功能備註｜戰鬥／回合] chooseCombatTarget：負責此前端功能的資料處理或互動。修改 UI 時可直接搜尋此函式名稱。
async function chooseCombatTarget(title='選擇目標',{relation='enemy',includeDowned=false}={}){

    $('#modalTitle').textContent=title;
    $('#modalBody').innerHTML=`<div class="user-list section">${targets.map((t,i)=>`<label class="user-row" style="cursor:pointer"><div><b>${t.type==='monster'?'👹':t.type==='npc'?'🧑':'🧙'} ${esc(t.name)}</b><div class="muted">${t.revealed===false?'生命狀態未知':`HP ${Number(t.hp)||0}/${Number(t.max_hp)||0}`}${Number(t.hp||0)<=0?' · 倒地':''}</div></div><input type="radio" name="combatTarget" value="${t.type}:${t.id}" ${i===0?'checked':''}></label>`).join('')}</div>`;
    $('#modal').classList.remove('hidden');$('#modalCancel').onclick=()=>{closeModal();resolve(false);};$('#modalOk').onclick=()=>{const raw=document.querySelector('input[name="combatTarget"]:checked')?.value||'';const [type,id]=raw.split(':');closeModal();resolve(type&&Number(id)?{type,id:Number(id)}:false);};
  });

// [前端功能備註｜技能] chooseTargetForSkill：負責此前端功能的資料處理或互動。修改 UI 時可直接搜尋此函式名稱。
async function chooseTargetForSkill(skill,title){
  const mode=combatTargetModeUI(skill);if(mode==='self'||mode.endsWith('_all'))return null;
  const relation=mode.startsWith('ally')?'ally':'enemy';
  return chooseCombatTarget(title,{relation,includeDowned:relation==='ally'&&combatEffectsCanReviveUI(skill)});
}

p(n=>`<label class="choice-option"><input type="checkbox" class="node-connection" value="${n.id}" ${connections.includes(String(n.id))?'checked':''}><span>${esc(n.name)}</span></label>`).join('')||'<div class="muted">還沒有其他節點。</div>'}</div></div><div id="nodeError" class="error"></div>`;

// [前端功能備註｜場景／時間] openSceneEditor：負責開啟編輯視窗。修改 UI 時可直接搜尋此函式名稱。
function openSceneEditor(){
  const room=state.room?.room;
  if(!room)return toast('找不到房間');
  const actual=state.timeView?.admin?.actual||{day:1,hour:8,minute:0};
  const globalOffset=Number(state.timeView?.admin?.global_offset_minutes)||0;
  $('#modalTitle').textContent='設定地圖／遊戲時間';
  $('#modalBody').innerHTML=`
    <div class="field"><label>目前地點／地圖名稱</label><input id="sceneMapName" maxlength="120" value="${esc(room.map_name||'')}"></div>
    <div class="field"><label>地圖圖片網址</label><input id="sceneMapImage" value="${esc(room.map_image_url||'')}" placeholder="可留空；可貼圖片網址"></div>
    <div class="field"><label>場景說明</label><textarea id="sceneDescription" rows="5" maxlength="4000">${esc(room.map_description||'')}</textarea></div>
    <div class="edit-grid">
      <div class="field"><label>第幾天（真實時間）</label><input id="sceneDay" type="number" min="1" value="${Math.max(1,Number(actual.day)||1)}"></div>
      <div class="field"><label>小時（0-23）</label><input id="sceneHour" type="number" min="0" max="23" value="${Math.max(0,Number(actual.hour)||0)}"></div>
      <div class="field"><label>分鐘（0-59）</label><input id="sceneMinute" type="number" min="0" max="59" value="${Math.max(0,Number(actual.minute)||0)}"></div>
      <div class="field"><label>全域時間扭曲（分鐘）</label><input id="sceneTimeOffset" type="number" min="-10080" max="10080" value="${globalOffset}"><div class="muted">例：+120 代表普通時計會快 2 小時；-60 代表慢 1 小時。</div></div>
      <div class="field"><label>全域時間流速</label><select id="sceneTimeRate">${[[-1,'倒流 ×1'],[0,'時間停止'],[0.5,'減速 ×0.5'],[1,'正常 ×1'],[2,'加速 ×2'],[3,'加速 ×3']].map(([v,t])=>`<option value="${v}" ${Number(state.timeView?.admin?.global_time_rate??1)===v?'selected':''}>${t}</option>`).join('')}</select><div class="muted">DM 推進真實時間時，普通時計會依此速度累積扭曲。</div></div>
    </div>
    <label class="choice-option"><input id="sceneTimeHidden" type="checkbox" ${state.timeView?.room_time_hidden!==false?'checked':''}><span><b>對玩家隱藏時間</b><small>玩家必須持有被標記為「可查看時間」的道具才能看到。</small></span></label>
    <div class="muted section">「真實時間」道具會無視所有時間扭曲；普通計時道具會顯示被扭曲後的時間。</div>
    <div id="sceneError" class="error"></div>`;
  $('#modal').classList.remove('hidden');
  $('#modalCancel').onclick=closeModal;
  $('#modalOk').onclick=async()=>{
    try{
      const data=await api(`/api/rooms/${room.id}/scene`,{method:'PATCH',body:JSON.stringify({map_name:$('#sceneMapName').value,map_image_url:$('#sceneMapImage').value,map_description:$('#sceneDescription').value,game_day:Number($('#sceneDay').value)||1,game_hour:Number($('#sceneHour').value)||0,game_minute:Number($('#sceneMinute').value)||0,time_hidden:$('#sceneTimeHidden').checked,time_distortion_offset_minutes:Number($('#sceneTimeOffset').value)||0,time_rate:Number($('#sceneTimeRate').value)})});
      state.room=data;
      await Promise.all([loadWorldSystems(),loadRoomWorld(),loadTeamData(),loadTimeView()]);
      closeModal();render();toast('地圖與遊戲時間已更新');
    }catch(error){$('#sceneError').textContent=error.message;}
  };
}

// [前端功能備註｜前端介面工具] characterHTML：負責產生／更新畫面。修改 UI 時可直接搜尋此函式名稱。
function characterHTML(){

  const character =
    state.myCharacter;

  if(!character){

    return `

      <div class="card pad">

        <h2>
          我的角色卡
        </h2>

        <div class="muted">
          你目前沒有角色卡。
          角色卡不需要加入房間才存在。
        </div>

      </div>

    `;
  }

  const roomMember=(state.room?.members||[]).find(member=>String(member.id)===String(state.user?.id));
  const currentSanity=roomMember?Math.max(0,Number(roomMember.current_sanity)||0):Math.max(0,Number(character.sanity)||0);
  const maxSanity=roomMember?Math.max(1,Number(roomMember.max_sanity)||Number(character.sanity)||1):Math.max(1,Number(character.sanity)||1);
  const sanityPct=Math.max(0,Math.min(100,Math.round((currentSanity/maxSanity*100)*10)/10));

// [前端功能備註｜商店分類] shopCategoryNameUI：取得商品分類名稱；正式 category_name 優先，舊 item_category 作相容後備。
function shopCategoryNameUI(item){
  return String(item?.category_name||item?.item_category||'未分類');
}

// [前端功能備註｜商店分類] shopCategoryButtonsHTML：產生商店分類快捷按鈕；分類資料由 C++ /api/shop 回傳。
function shopCategoryButtonsHTML(selected,admin=false){
  const categories=(state.shopCategories||[]).filter(category=>admin||category.active!==false);
  const cls=admin?'admin-shop-category-filter':'shop-category-filter';
  const hasUncategorized=(state.shopItems||[]).some(item=>!item.category_id);
  const buttons=[
    `<button type="button" class="btn small ${selected==='all'?'':'secondary'} ${cls}" data-category-id="all">全部</button>`,
    ...categories.map(category=>`<button type="button" class="btn small ${String(selected)===String(category.id)?'':'secondary'} ${cls}" data-category-id="${category.id}">${esc(category.name)}</button>`)
  ];
  if(hasUncategorized)buttons.push(`<button type="button" class="btn small ${selected==='__none__'?'':'secondary'} ${cls}" data-category-id="__none__">未分類</button>`);
  return buttons.join('');
}

// [前端功能備註｜商店分類] applyShopFilters：不重新載入 API，直接在瀏覽器依分類＋關鍵字過濾商品卡。
function applyShopFilters(admin=false){
  const selected=String(admin?state.adminShopFilterCategory:state.shopFilterCategory||'all');
  const query=String(admin?state.adminShopSearch:state.shopSearch||'').trim().toLowerCase();
  const selector=admin?'[data-admin-shop-card]':'[data-shop-card]';
  let visible=0;
  $$(selector).forEach(card=>{
    const category=String(card.dataset.categoryId||'');
    const text=String(card.dataset.shopSearch||'').toLowerCase();
    const categoryMatch=selected==='all'||category===selected||(selected==='__none__'&&!category);
    const show=categoryMatch&&(!query||text.includes(query));
    card.classList.toggle('hidden',!show);
    if(show)visible+=1;
  });
  const empty=$(admin?'#adminShopFilterEmpty':'#shopFilterEmpty');
  if(empty)empty.classList.toggle('hidden',visible!==0);
  const count=$(admin?'#adminShopFilterCount':'#shopFilterCount');
  if(count)count.textContent=`顯示 ${visible} / ${$$(selector).length} 項`;
}

// [前端功能備註｜商店] shopHTML：玩家商店加入「分類快捷列＋關鍵字搜尋」，大量商品時不用逐張翻找。

// [前端功能備註｜房間／跑團] chatHTML：負責產生／更新畫面。修改 UI 時可直接搜尋此函式名稱。
function chatHTML(){
  const events=state.room?.events||[];
  const myUserId=state.user?.id;

  return events
    .filter(event=>event.type==='chat')
    .map(event=>{
      const mine=
        String(event.user_id??'')===String(myUserId??'');

      const speakerName=
        event.character_name ||
        event.username ||
        '玩家';

      return `<div class="chat-row ${mine?'mine':'other'}"><div class="chat-bubble"><div class="chat-meta">${esc(speakerName)}</div>${esc(event.payload?.text||'')}</div></div>`;
    })
    .join('')||'<div class="muted">開始聊天吧。</div>';
}

// [前端功能備註｜召喚物] roomSummonsHTML：負責產生／更新畫面。修改 UI 時可直接搜尋此函式名稱。
function roomSummonsHTML(){
  const summons=state.room?.summons||[];
  if(!summons.length)return '<div class="muted">目前沒有召喚物</div>';
  const selfMember=(state.room?.members||[]).find(m=>String(m.id)===String(state.user?.id));
  const canRide=(state.myCharacter?.skills||[]).some(isRidingSkill);
  return summons.map(summon=>{
    const mine=String(summon.owner_user_id)===String(state.user?.id);
    const mounted=String(selfMember?.mounted_summon_id||'')===String(summon.id);
    return `<div class="member"><div><div>🐾 ${esc(summon.name)}</div><div class="muted">主人：${esc(summon.owner_username||'玩家')} · AI Lv.${Number(summon.self_ai_level)||0}</div><div class="muted">技能：${summonSkillIds(summon).length?summonSkillIds(summon).map(id=>summonSkillTemplateById(id)?.name||`#${id}`).map(esc).join('、'):'無'}</div>${mounted?'<div class="muted">🐎 你正在騎乘此召喚物</div>':''}</div><div class="actions">${mine&&canRide&&!mounted?`<button class="btn secondary small mount-summon" data-id="${summon.id}">騎乘</button>`:''}${mine&&mounted?`<button class="btn ghost small unmount-summon">下乘</button>`:''}<span class="badge">召喚物</span></div></div>`;
  }).join('');
}

  if(basicAttack)basicAttack.onclick=async()=>{try{const target=await chooseCombatTarget('基本攻擊目標',{relation:'enemy'});if(target===false)return;const data=await api(`/api/rooms/${state.room.room.id}/combat/basic-attack`,{method:'POST',body:JSON.stringify({target_type:target.type,target_id:target.id})});state.room=data.room;await Promise.all([loadRoomWorld(),loadMyCharacter()]);render();toast(data.combat?.hit?`命中 ${data.combat.target.name}，造成 ${data.combat.damage} 傷害`:'攻擊未命中');}catch(error){toast(error.message);}};
  const escapeCombat=$('#escapeCombat');
  if(escapeCombat)escapeCombat.onclick=async()=>{try{const data=await api(`/api/rooms/${state.room.room.id}/combat/escape`,{method:'POST',body:'{}'});state.room=data.room;await Promise.all([loadRoomWorld(),loadMyCharacter(),loadMySummons()]);render();toast(data.success?'成功脫離戰鬥':'脫離失敗，消耗一次行動');}catch(error){toast(error.message);}};

  const passCombatAction=$('#passCombatAction');
  if(passCombatAction){
    passCombatAction.onclick=async()=>{
      try{
        const data=await api(`/api/rooms/${state.room.room.id}/combat/pass`,{method:'POST'});
        if(data.room)state.room=data.room;
        if(!CPP_CORE_PREVIEW)await loadRoomWorld();
        render();
      }catch(error){toast(error.message);}
    };
  }

  const aiCombatAct=$('#aiCombatAct');
  if(aiCombatAct)aiCombatAct.onclick=async()=>{try{const data=await api(`/api/admin/rooms/${state.room.room.id}/combat/ai-act`,{method:'POST',body:'{}'});state.room=data.room;await Promise.all([loadRoomWorld(),loadMyCharacter()]);render();const r=data.combat;toast(r?(r.hit?`${r.attacker.name} 命中 ${r.target.name}，造成 ${r.damage} 傷害`:`${r.attacker?.name||'AI'} 攻擊未命中`):(data.ai_result?.charging?'AI 正在蓄力':`${data.ai_result?.actor?.name||'AI'} 已完成行動`));}catch(error){toast(error.message);}};

  $$('.revive-combat-target').forEach(button=>{button.onclick=async()=>{try{const data=await api(`/api/admin/rooms/${state.room.room.id}/combat/revive`,{method:'POST',body:JSON.stringify({target_type:button.dataset.type,target_id:Number(button.dataset.id),hp_percent:30})});state.room=data.room;await Promise.all([loadRoomWorld(),loadMyCharacter()]);render();toast('目標已復甦');}catch(error){toast(error.message);}};});

  const chatForm =
    $('#chatForm');

  if(chatForm){

    chatForm.onsubmit =
      event => {

        event.preventDefault();

        const input =
          $('#chatInput');

        const text =
          input.value.trim();

        if(
          text &&
          state.socket &&
          state.room
        ){

          state.socket.emit(
            'chat:send',
            {
              roomId:
                state.room.room.id,

              text
            }
          );

          input.value =
            '';
        }

      };
  }


  const rollDice =
    $('#rollDice');

  if(rollDice){

    rollDice.onclick =
      () => {

        if(
          !state.socket ||
          !state.room
        ){
          toast(
            '請先加入房間'
          );

          return;
        }

        state.socket.emit(
          'dice:roll',
          {
            roomId:
              state.room.room.id,

            notation:
              $('#diceNotation').value,

            label:
              $('#diceLabel').value
          }
        );

      };
  }
}


/* =========================================================
   MODAL
========================================================= */

// [前端功能備註｜共用工具] closeModal：負責此前端功能的資料處理或互動。修改 UI 時可直接搜尋此函式名稱。
function closeModal(){

  $('#modal')
    .classList
    .add('hidden');
}


// [前端功能備註｜NPC] openPrompt：負責此前端功能的資料處理或互動；對應 API：/api/admin/npc-shop-items, /api/rooms, /api/rooms/join。修改 UI 時可直接搜尋此函式名稱。
function openPrompt(
  title,
  label,
  value,
  callback
){

  $('#modalTitle')
    .textContent =
      title;

  $('#modalBody')
    .innerHTML = `

      <div class="field">

        <label>
          ${esc(label)}
        </label>

        <input
          id="modalInput"
          value="${esc(value)}"
          autofocus
        >

      </div>

    `;

  $('#modal')
    .classList
    .remove('hidden');

  $('#modalCancel').onclick =
    closeModal;

  $('#modalOk').onclick =
    async () => {

      try{

        const value =
          $('#modalInput')
            .value
            .trim();

        await callback(
          value
        );

        closeModal();

      }catch(error){

        toast(
          error.message
        );

      }

    };
}


/* =========================================================
   AUTH UI
========================================================= */

$$('.auth-tabs .tab')
  .forEach(
    tab => {

      tab.onclick =
        () => {

          $$('.auth-tabs .tab')
            .forEach(
              item =>
                item.classList.remove(
                  'active'
                )
            );

          tab.classList.add(
            'active'
          );

          state.authMode =
            tab.dataset.auth;

          $('#authSubmit')
            .textContent =
              state.authMode === 'login'
                ? '登入'
                : '註冊';

          $('#password')
            .autocomplete =
              state.authMode === 'login'
                ? 'current-password'
                : 'new-password';

        };

    }
  );


$('#authForm')
  .onsubmit =
    submitAuth;


$('#logout')
  .onclick =
    () => {

      if(state.socket){
        state.socket.disconnect();
      }

      localStorage.removeItem(
        'rpg_token'
      );

      state.token =
        null;

      location.reload();

    };

  window.addEventListener(
    'load',
    () => {
      navigator.serviceWorker
        .register('/sw.js')
        .catch(
          error => console.warn(
            'Service Worker 註冊失敗：',
            error
          )
        );
    }
  );
}

boot();
