<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101321">
  <meta name="application-version" content="39">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TRPG Online">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <title>TRPG Online</title>

  <style>
    :root{
      --bg:#0c0f19;
      --panel:#151a29;
      --panel2:#1b2235;
      --panel3:#101523;
      --line:#293149;
      --text:#eef2ff;
      --muted:#aab3cb;
      --accent:#8b7cff;
      --accent2:#6de1c1;
      --danger:#ff7185;
      --warning:#ffc857;
      --shadow:0 14px 40px rgba(0,0,0,.25);
    }

    *{
      box-sizing:border-box;
    }

    html,body{
      margin:0;
      min-height:100%;
      font-family:
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
      background:
        radial-gradient(
          circle at top,
          #171b2f 0,
          #0c0f19 46%,
          #080a11 100%
        );
      color:var(--text);
    }

    button,
    input,
    select,
    textarea{
      font:inherit;
    }

    button{
      cursor:pointer;
      border:0;
    }

    .hidden{
      display:none !important;
    }

    .muted{
      color:var(--muted);
    }

    .danger-text{
      color:var(--danger);
    }

    .success-text{
      color:var(--accent2);
    }

    /* =========================
       AUTH
    ========================= */

    .auth-shell{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:20px;
    }

    .auth-card{
      width:min(460px,100%);
      background:rgba(21,26,41,.94);
      border:1px solid var(--line);
      border-radius:24px;
      padding:30px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(12px);
    }

    .brand{
      font-size:28px;
      font-weight:800;
      letter-spacing:.02em;
    }

    .brand span{
      color:var(--accent);
    }

    .auth-card h1{
      margin:10px 0 6px;
    }

    .auth-tabs{
      display:grid;
      grid-template-columns:1fr 1fr;
      margin:22px 0 16px;
      background:var(--panel2);
      border-radius:12px;
      padding:4px;
    }

    .tab{
      padding:10px;
      color:var(--muted);
      background:transparent;
      border-radius:8px;
    }

    .tab.active{
      background:var(--accent);
      color:white;
    }

    .field{
      display:grid;
      gap:7px;
      margin:13px 0;
    }

    .field label{
      font-size:13px;
      color:var(--muted);
    }

    .field input,
    .field select,
    .field textarea{
      width:100%;
      padding:12px 14px;
      border:1px solid var(--line);
      background:#0f1421;
      color:var(--text);
      border-radius:12px;
      outline:none;
    }

    .field textarea{
      min-height:100px;
      resize:vertical;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus{
      border-color:var(--accent);
    }

    .btn{
      width:100%;
      padding:13px 16px;
      border-radius:12px;
      background:var(--accent);
      color:white;
      font-weight:700;
    }

    .btn.secondary{
      background:var(--panel2);
      border:1px solid var(--line);
    }

    .btn.ghost{
      background:transparent;
      border:1px solid var(--line);
    }

    .btn.danger{
      background:var(--danger);
      color:#16080c;
    }

    .btn.small{
      width:auto;
      padding:8px 11px;
      font-size:13px;
    }

    .error{
      color:var(--danger);
      font-size:13px;
      margin-top:10px;
      min-height:18px;
    }

    /* =========================
       APP
    ========================= */

    .app{
      display:grid;
      grid-template-rows:64px 1fr;
      min-height:100vh;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 20px;
      border-bottom:1px solid var(--line);
      background:rgba(12,15,25,.88);
      backdrop-filter:blur(14px);
      position:sticky;
      top:0;
      z-index:5;
    }

    .top-left,
    .top-right{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .user-pill{
      color:var(--muted);
    }

    .admin-pill{
      padding:6px 9px;
      border-radius:999px;
      background:#453b86;
      color:white;
      font-size:12px;
      font-weight:700;
    }

    .layout{
      display:grid;
      grid-template-columns:230px minmax(0,1fr);
      min-height:calc(100vh - 64px);
    }

    .sidebar{
      padding:18px;
      border-right:1px solid var(--line);
      background:rgba(16,20,33,.55);
    }

    .nav{
      display:grid;
      gap:8px;
    }

    .nav button{
      padding:12px;
      background:transparent;
      color:var(--muted);
      text-align:left;
      border-radius:10px;
    }

    .nav button:hover,
    .nav button.active{
      background:var(--panel2);
      color:white;
    }

    .nav .admin-nav{
      border:1px solid rgba(139,124,255,.25);
    }

    .content{
      min-width:0;
      padding:18px;
    }

    /* =========================
       CARDS
    ========================= */

    .card{
      background:rgba(21,26,41,.84);
      border:1px solid var(--line);
      border-radius:18px;
      box-shadow:var(--shadow);
    }

    .card.pad{
      padding:16px;
    }

    .card h2,
    .card h3{
      margin:0 0 12px;
    }

    .hero{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:18px;
    }

    .actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .actions .btn{
      width:auto;
      padding:10px 13px;
    }

    .section{
      margin-top:14px;
    }

    .grid2{
      display:grid;
      grid-template-columns:
        minmax(0,1.4fr)
        minmax(280px,1fr);
      gap:14px;
    }

    .stat-grid{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:10px;
    }

    .stat{
      background:var(--panel2);
      border:1px solid var(--line);
      padding:12px;
      border-radius:13px;
    }

    .stat .n{
      font-size:24px;
      font-weight:800;
    }

    /* =========================
       ADMIN
    ========================= */

    .admin-header{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:15px;
      margin-bottom:15px;
    }

    .admin-tabs{
      display:flex;
      gap:8px;
      margin-bottom:15px;
      flex-wrap:wrap;
    }

    .admin-tab{
      width:auto;
      padding:10px 14px;
      background:var(--panel2);
      color:var(--muted);
      border:1px solid var(--line);
      border-radius:10px;
    }

    .admin-tab.active{
      background:var(--accent);
      color:white;
      border-color:var(--accent);
    }

    .character-grid{
      display:grid;
      grid-template-columns:
        repeat(auto-fill,minmax(310px,1fr));
      gap:14px;
    }

    .character-card{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:17px;
      padding:16px;
      transition:.15s ease;
    }

    .character-card:hover{
      border-color:#4c5879;
      transform:translateY(-1px);
    }

    .character-card-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
    }

    .character-avatar{
      width:48px;
      height:48px;
      border-radius:14px;
      overflow:hidden;
      display:grid;
      place-items:center;
      background:
        linear-gradient(
          135deg,
          var(--accent),
          #4d62c9
        );
      font-size:21px;
      font-weight:800;
      flex-shrink:0;
    }

    .character-title{
      display:flex;
      gap:10px;
      align-items:center;
    }

    .character-name{
      font-size:19px;
      font-weight:800;
    }

    .character-user{
      font-size:12px;
      color:var(--muted);
      margin-top:2px;
    }

    .badge{
      font-size:11px;
      padding:4px 8px;
      border-radius:999px;
      background:#252d45;
      color:var(--muted);
      white-space:nowrap;
    }

    .badge.admin{
      background:#453b86;
      color:white;
    }

    .badge.player{
      background:#203c38;
      color:#8ee8ce;
    }

    .character-info{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
      margin-top:14px;
    }

    .mini-stat{
      background:var(--panel3);
      border:1px solid #222a40;
      border-radius:10px;
      padding:9px;
    }

    .mini-stat span{
      display:block;
      color:var(--muted);
      font-size:11px;
      margin-bottom:3px;
    }

    .mini-stat strong{
      font-size:16px;
    }

    .character-details{
      margin-top:12px;
      padding-top:12px;
      border-top:1px solid var(--line);
      display:grid;
      gap:7px;
      font-size:13px;
    }

    .character-actions{
      display:flex;
      gap:8px;
      margin-top:14px;
    }

    .character-actions .btn{
      flex:1;
      width:auto;
      padding:9px 10px;
    }

    /* =========================
       USERS
    ========================= */

    .user-list{
      display:grid;
      gap:9px;
    }

    .user-row{
      display:grid;
      grid-template-columns:
        minmax(160px,1fr)
        auto
        auto;
      gap:10px;
      align-items:center;
      padding:12px;
      background:var(--panel3);
      border:1px solid #222a40;
      border-radius:12px;
    }

    /* =========================
       ROOM
    ========================= */

    .room-code{
      font-family:ui-monospace,monospace;
      background:var(--panel2);
      border:1px solid var(--line);
      padding:7px 10px;
      border-radius:10px;
    }

    .member-list{
      display:grid;
      gap:9px;
    }

    .member{
      display:grid;
      grid-template-columns:1fr auto;
      gap:8px;
      align-items:center;
      padding:10px;
      background:var(--panel3);
      border:1px solid #222a40;
      border-radius:12px;
    }

    .online-dot{
      width:8px;
      height:8px;
      border-radius:50%;
      display:inline-block;
      background:#54607a;
    }

    .online-dot.on{
      background:var(--accent2);
      box-shadow:0 0 8px rgba(109,225,193,.6);
    }

    /* =========================
       EVENTS / CHAT
    ========================= */

    .event-list{
      display:grid;
      gap:9px;
      max-height:53vh;
      overflow:auto;
    }

    .event{
      padding:10px 12px;
      background:var(--panel3);
      border:1px solid #222a40;
      border-radius:12px;
    }

    .event .head{
      font-size:12px;
      color:var(--muted);
      margin-bottom:5px;
    }

    .chat{
      display:grid;
      grid-template-rows:1fr auto;
      min-height:400px;
    }

    .chat-log{
      padding:14px;
      overflow:auto;
      display:grid;
      gap:10px;
    }

    .chat-input{
      display:flex;
      gap:8px;
      padding:10px;
      border-top:1px solid var(--line);
    }

    .chat-input input{
      flex:1;
      padding:11px 12px;
      border-radius:11px;
      border:1px solid var(--line);
      background:#0f1421;
      color:var(--text);
    }

    .chat-input button{
      width:auto;
      padding:11px 15px;
    }

    /* =========================
       MODAL
    ========================= */

    .modal{
      position:fixed;
      inset:0;
      background:rgba(3,5,10,.78);
      display:grid;
      place-items:center;
      padding:16px;
      z-index:20;
    }

    .modal-card{
      width:min(720px,100%);
      max-height:90vh;
      overflow:auto;
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:18px;
      padding:18px;
    }

    .modal-actions{
      display:flex;
      gap:8px;
      margin-top:14px;
    }

    .modal-actions .btn{
      width:auto;
      flex:1;
    }

    .edit-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .task-card{
      display:grid;
      gap:12px;
    }

    .task-head{
      display:flex;
      justify-content:space-between;
      gap:14px;
      align-items:flex-start;
    }

    .task-description{
      white-space:pre-wrap;
      line-height:1.7;
    }

    .task-block{
      padding:10px 12px;
      border:1px solid var(--line);
      border-radius:10px;
      background:rgba(255,255,255,.02);
    }

    .effect-builder{display:grid;gap:10px;margin-top:8px}
    .effect-row{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel3)}
    .effect-row .field{margin:0}
    .effect-row .actions{align-items:end}

    /* =========================
       MOBILE
    ========================= */

    .mobile-nav{
      display:none;
    }

    .toast{
      position:fixed;
      right:18px;
      bottom:18px;
      background:#171d2d;
      border:1px solid var(--line);
      padding:11px 13px;
      border-radius:12px;
      box-shadow:var(--shadow);
      z-index:30;
    }

    @media(max-width:900px){
      .layout{
        grid-template-columns:190px minmax(0,1fr);
      }

      .character-grid{
        grid-template-columns:
          repeat(auto-fill,minmax(280px,1fr));
      }
    }

    @media(max-width:760px){
      .identity-editor-row,
      .skill-profession-auto-row,
      .profession-auto-skill-row{
        grid-template-columns:1fr !important;
      }

      .app{
        grid-template-rows:58px 1fr 68px;
      }

      .topbar{
        padding:0 12px;
      }

      .brand{
        font-size:20px;
      }

      .user-pill{
        display:none;
      }

      .layout{
        grid-template-columns:1fr;
        min-height:0;
      }

      .sidebar{
        display:none;
      }

      .content{
        padding:11px;
        padding-bottom:78px;
      }

      .hero{
        display:grid;
      }

      .stat-grid{
        grid-template-columns:repeat(2,1fr);
      }

      .grid2{
        grid-template-columns:1fr;
      }

      .character-grid{
        grid-template-columns:1fr;
      }

      .user-row{
        grid-template-columns:1fr;
      }

      .edit-grid{
        grid-template-columns:1fr;
      }

      .mobile-nav{
        position:fixed;
        left:0;
        right:0;
        bottom:0;
        height:68px;
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(0,1fr));
        background:rgba(12,15,25,.97);
        border-top:1px solid var(--line);
        z-index:10;
        padding-bottom:env(safe-area-inset-bottom);
      }

      .mobile-nav button{
        background:transparent;
        color:var(--muted);
        display:grid;
        place-items:center;
        font-size:11px;
        gap:3px;
      }

      .mobile-nav button.active{
        color:white;
      }

      .actions{
        display:grid;
        grid-template-columns:1fr 1fr;
      }

      .actions .btn{
        width:100%;
      }

      .effect-row{
        grid-template-columns:1fr;
      }
    }
  
/* Adaptive chat bubbles */
.chat-log {
  min-width: 0;
}
.event {
  height: auto;
  min-height: 0;
  max-width: 100%;
}
.event > div:last-child,
.event {
  overflow-wrap: anywhere;
  word-break: break-word;
}

/* Compact character skill cards */
.skill-card-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:8px;
}
.skill-card-compact{
  padding:8px 10px;
  border-radius:10px;
  font-size:13px;
  line-height:1.35;
  white-space:normal;
  min-height:0;
}
.skill-card-compact .muted,
.skill-card-compact .success-text{
  font-size:12px;
  line-height:1.35;
  margin-top:2px;
}
.skill-card-compact .actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:6px !important;
}
.skill-card-compact .actions .btn{
  width:auto;
  padding:7px 10px;
}
@media(max-width:760px){
  .skill-card-grid{grid-template-columns:1fr;}
  .skill-card-compact{padding:8px;font-size:13px;}
}



/* =========================
   PATCH V3: CHAT / LIBRARIES
========================= */
.chat-log{
  align-content:start;
  min-width:0;
  overflow-x:hidden;
}
.chat-row{
  display:flex;
  width:100%;
  min-width:0;
}
.chat-row.mine{
  justify-content:flex-end;
}
.chat-row.other{
  justify-content:flex-start;
}
.chat-bubble{
  display:inline-block;
  width:fit-content;
  max-width:min(78%, 560px);
  padding:9px 12px;
  border-radius:16px;
  background:var(--panel3);
  border:1px solid #222a40;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  word-break:break-word;
  line-height:1.45;
}
.chat-row.mine .chat-bubble{
  background:#2c3158;
  border-color:#4c5188;
  border-bottom-right-radius:5px;
}
.chat-row.other .chat-bubble{
  border-bottom-left-radius:5px;
}
.chat-meta{
  font-size:11px;
  color:var(--muted);
  margin-bottom:3px;
}
.library-list{
  display:grid;
  gap:10px;
}
.library-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:12px;
  align-items:start;
  padding:12px;
  background:var(--panel3);
  border:1px solid #222a40;
  border-radius:12px;
}
.library-row .actions{
  justify-content:flex-end;
}
.backup-warning{
  padding:12px;
  border:1px solid rgba(255,200,87,.45);
  border-radius:12px;
  background:rgba(255,200,87,.08);
  color:#ffe3a1;
  line-height:1.55;
  overflow-wrap:anywhere;
}
#backupImportFile{
  width:100%;
  max-width:100%;
}
.skill-card-inline{
  margin-top:8px;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--panel3);
}
.attribute-editor{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
.attribute-points-box{
  padding:12px;
  border-radius:12px;
  background:var(--panel3);
  border:1px solid var(--line);
  margin:10px 0;
}
.choice-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:8px;
}
.choice-option{
  display:flex;
  align-items:flex-start;
  gap:9px;
  padding:10px;
  background:var(--panel3);
  border:1px solid var(--line);
  border-radius:11px;
}
.choice-option input{
  width:auto !important;
  margin-top:3px;
  flex:0 0 auto;
}
.choice-option span{
  display:grid;
  gap:2px;
}
.choice-option small{
  color:var(--muted);
}
.resource-panel{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  padding:12px;
  border-radius:12px;
  background:var(--panel3);
  border:1px solid var(--line);
}
.resource-value{
  font-size:20px;
  font-weight:800;
}
.resource-panel .actions{
  margin:0;
}
.resource-meta{
  display:grid;
  gap:3px;
  min-width:180px;
}
.resource-bar{
  width:min(360px,100%);
  height:10px;
  border-radius:999px;
  overflow:hidden;
  background:#0b0f19;
  border:1px solid var(--line);
  margin-top:7px;
}
.resource-bar-fill{
  height:100%;
  background:var(--accent);
}
.resource-editor-list{
  display:grid;
  gap:10px;
}
.resource-editor-row{
  padding:12px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--panel3);
}
.resource-editor-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(120px,1fr));
  gap:9px;
}
.resource-editor-flags{
  display:flex;
  flex-wrap:wrap;
  gap:10px 16px;
  margin-top:9px;
}
.resource-editor-flags label{
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--muted);
  font-size:13px;
}
.resource-editor-head{

const $ = selector =>

// [前端功能備註｜共用工具] esc：負責此前端功能的資料處理或互動。修改 UI 時可直接搜尋此函式名稱。
function esc(value){
  return String(value ?? '')
    .replace(
      /[&<>"']/g,
      c => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      }[c])
    );
}





const IDENTITY_RANKS=['G','F','E','D','C','B','A','S','SS','SSS'];

// [前端功能備註｜大道／信仰] normalizeIdentityEntries：負責整理／轉換表單或資料格式。修改 UI 時可直接搜尋此函式名稱。
function normalizeIdentityEntries(value){
  if(!Array.isArray(value))return [];
  return value.map(item=>{
    if(typeof item==='string'){
      const name=item.trim();
      return name?{name,rank:'G'}:null;
    }
    if(item&&typeof item==='object'){
      const name=String(item.name||item.title||'').trim();
      let rank=String(item.rank||'G').toUpperCase();
      if(!IDENTITY_RANKS.includes(rank))rank='G';
      return name?{...item,name,rank}:null;
    }
    return null;
  }).filter(Boolean).slice(0,10);
}

// [前端功能備註｜大道／信仰] identitySummaryHTML：負責產生／更新畫面。修改 UI 時可直接搜尋此函式名稱。
function identitySummaryHTML(value){
  const list=normalizeIdentityEntries(value);
  if(!list.length)return '未設定';
  return list.map(item=>`${esc(item.name)} <span class="badge">${esc(item.rank)}級</span>`).join('、');
}

// [前端功能備註｜大道／信仰] identityEditorRowHTML：負責產生／更新畫面。修改 UI 時可直接搜尋此函式名稱。
function identityEditorRowHTML(item={name:'',rank:'G'}){
  const rank=IDENTITY_RANKS.includes(String(item.rank||'').toUpperCase())?String(item.rank).toUpperCase():'G';

// [前端功能備註｜道具／裝備／背包] inventoryDisplayName：負責此前端功能的資料處理或互動。修改 UI 時可直接搜尋此函式名稱。
function inventoryDisplayName(item){
  if(typeof item==='string')return item;
  if(item&&typeof item==='object')return String(item.name||item.title||item.item_name||'未命名');
  return String(item||'未命名');
}

// [前端功能備註｜道具／裝備／背包] inventoryQuantityValue：負責此前端功能的資料處理或互動。修改 UI 時可直接搜尋此函式名稱。
function inventoryQuantityValue(item){
  if(item&&typeof item==='object'){
    return Math.max(1,Number(item.quantity??item.qty??item.count)||1);
  }
  return 1;
}

// [前端功能備註｜道具／裝備／背包] normalizedInventory：負責整理／轉換表單或資料格式。修改 UI 時可直接搜尋此函式名稱。
function normalizedInventory(value){
  const list=Array.isArray(value)?value:[];
  const map=new Map();
  for(const raw of list){
    const name=inventoryDisplayName(raw).trim();
    if(!name)continue;
    const category=String(raw&&typeof raw==='object'?(raw.category||raw.item_category||''):'').trim().slice(0,80);
    const key=`${name.toLocaleLowerCase()}\u0000${category.toLocaleLowerCase()}`;
    const quantity=inventoryQuantityValue(raw);
    if(map.has(key))map.get(key).quantity+=quantity;
    else map.set(key,{name,quantity,category});
  }
  return [...map.values()];
}

// [前端功能備註｜道具／裝備／背包] gearEntry：負責此前端功能的資料處理或互動。修改 UI 時可直接搜尋此函式名稱。
function gearEntry(item){
  if(typeof item==='string')return {name:item,consume_item_name:'',consume_item_category:'',consume_quantity:0,ammo_options:[],grant_mode:'none',granted_skill_template_ids:[],requirements:{},set_name:'',set_bonus_count:0,set_bonus_effects:{list:[]},set_bonus_skill_template_ids:[],charges_max:0,charges_current:0,charge_cost:0,durability_max:0,durability_current:0,durability_cost:0,skill_modifiers:[],effects:{list:[]}};
  const raw=item&&typeof item==='object'?item:{};
  const cost=raw.use_cost&&typeof raw.use_cost==='object'?raw.use_cost:{};
  const chargesMax=Math.max(0,Number(raw.charges_max)||0);
  const durabilityMax=Math.max(0,Number(raw.durability_max)||0);
  return {
    ...raw,
    name:String(raw.name||raw.title||'未命名裝備'),
    consume_item_name:String(raw.consume_item_name||cost.item_name||''),
    consume_item_category:String(raw.consume_item_category||cost.category||''),
    consume_quantity:Math.max(0,Number(raw.consume_quantity??cost.quantity)||0),
    ammo_options:(Array.isArray(raw.ammo_options)?raw.ammo_options:[]).map(ammo=>({name:String(ammo&&ammo.name||'').trim(),category:String(ammo&&ammo.category||'').trim(),quantity:Math.max(1,Number(ammo&&ammo.quantity)||1),damage_multiplier:Math.max(0,Number(ammo&&ammo.damage_multiplier)||1),note:String(ammo&&ammo.note||'').trim()})).filter(ammo=>ammo.name),
    grant_mode:['none','equipped','permanent_first_equip'].includes(String(raw.grant_mode||''))?String(raw.grant_mode):'none',
    granted_skill_template_ids:[...new Set((Array.isArray(raw.granted_skill_template_ids)?raw.granted_skill_template_ids:[]).map(Number).filter(Boolean))],
    requirements:raw.requirements&&typeof raw.requirements==='object'&&!Array.isArray(raw.requirements)?raw.requirements:{},
    set_name:String(raw.set_name||''),
    set_bonus_count:Math.max(0,Number(raw.set_bonus_count)||0),
    set_bonus_effects:{...(raw.set_bonus_effects&&typeof raw.set_bonus_effects==='object'?raw.set_bonus_effects:{}),list:normalizeEffectListUI(raw.set_bonus_effects)},
    set_bonus_skill_template_ids:[...new Set((Array.isArray(raw.set_bonus_skill_template_ids)?raw.set_bonus_skill_template_ids:[]).map(Number).filter(Boolean))],
    charges_max:chargesMax,
    charges_current:chargesMax>0?Math.max(0,Number(raw.charges_current??chargesMax)||0):0,
    charge_cost:chargesMax>0?Math.max(0,Number(raw.charge_cost)||1):0,
    durability_max:durabilityMax,
    durability_current:durabilityMax>0?Math.max(0,Number(raw.durability_current??durabilityMax)||0):0,
    durability_cost:durabilityMax>0?Math.max(0,Number(raw.durability_cost)||1):0,
    skill_modifiers:(Array.isArray(raw.skill_modifiers)?raw.skill_modifiers:[]).map(mod=>({skill_template_id:Number(mod.skill_template_id)||0,damage_multiplier:Number(mod.damage_multiplier)||1,turn_cost_delta:Number(mod.turn_cost_delta)||0,charge_turns_delta:Number(mod.charge_turns_delta)||0})).filter(mod=>mod.skill_template_id),
    effects:{...(raw.effects&&typeof raw.effects==='object'?raw.effects:{}),list:normalizeEffectListUI(raw.effects)}
  };
}

// [前端功能備註｜道具／裝備／背包] gearLoadout：負責此前端功能的資料處理或互動。修改 UI 時可直接搜尋此函式名稱。
function gearLoadout(character){
  let raw=character&&character.gear_loadout;
  if(typeof raw==='string'){
    try{raw=JSON.parse(raw);}catch{raw={};}
  }
  if(!raw||typeof raw!=='object'||Array.isArray(raw))raw={};
  const equipment=Array.isArray(raw.equipment)?raw.equipment.map(value=>String(value||'')).filter(Boolean):[];
  const weapons=Array.isArray(raw.weapons)?raw.weapons.map(value=>String(value||'')).filter(Boolean):[];
  return {
    configured:Boolean(raw.configured)||Object.prototype.hasOwnProperty.call(raw,'configured'),
    equipment,
    weapons
  };
}

    $('#modalBody').innerHTML=`<div class="muted">這次攻擊要使用哪一種彈藥？只有目前持有數量足夠的彈藥可以選。</div><div class="user-list section">${options.map((ammo,index)=>{const have=ammoInventoryCount(state.myCharacter,ammo);const need=Math.max(1,Number(ammo.quantity)||1);const disabled=have<need;return `<label class="user-row" style="cursor:${disabled?'not-allowed':'pointer'};opacity:${disabled?'.55':'1'}"><div><b>${esc(ammo.name)}</b>${ammo.category?` <span class="badge">${esc(ammo.category)}</span>`:''}<div class="muted">持有 ${have} · 本次消耗 ${need}${Number(ammo.damage_multiplier)!==1?` · 傷害倍率 ×${Number(ammo.damage_multiplier)||1}`:''}</div>${ammo.note?`<div class="muted">${esc(ammo.note)}</div>`:''}</div><input type="radio" name="ammoChoice" value="${index}" ${disabled?'disabled':''}></label>`;}).join('')}</div><div id="ammoChoiceError" class="error"></div>`;
    $('#modal').classList.remove('hidden');
    $('#modalCancel').onclick=()=>{closeModal();resolve(false);};
    $('#modalOk').onclick=()=>{const checked=document.querySelector('input[name="ammoChoice"]:checked');if(!checked){$('#ammoChoiceError').textContent='請選擇一種可用彈藥';return;}const ammo=options[Number(checked.value)];closeModal();resolve({name:ammo.name,category:ammo.category||''});};
  });
}

// [前端功能備註｜道具／裝備／背包] gearRequirementSummary：負責此前端功能的資料處理或互動。修改 UI 時可直接搜尋此函式名稱。
function gearRequirementSummary(gearValue){
  const gear=gearEntry(gearValue);const req=gear.requirements||{};const parts=[];
  if(Number(req.profession_id)){const p=(state.professions||[]).find(item=>Number(item.id)===Number(req.profession_id));parts.push(`職業：${p?p.name:'#'+req.profession_id} ${req.profession_rank||'G'} Lv.${Number(req.profession_level)||1}`);}
  if(req.bloodline)parts.push(`血脈：${req.bloodline}`);
  const statLabels={strength:'力量',agility:'敏捷',constitution:'體質',spirit:'精神',luck:'幸運'};
  if(req.stat&&Number(req.stat_min)>0)parts.push(`${statLabels[req.stat]||req.stat} ≥ ${Number(req.stat_min)||0}`);
  return parts.join('、')||'無';
}

// [前端功能備註｜道具／裝備／背包] gearExtraSummary：負責此前端功能的資料處理或互動。修改 UI 時可直接搜尋此函式名稱。
function gearExtraSummary(gearValue){
  const gear=gearEntry(gearValue);const lines=[];
  if((gear.ammo_options||[]).length)lines.push(`可選彈藥：${gear.ammo_options.map(ammo=>`${ammo.name}${ammo.category?`（${ammo.category}）`:''} ×${Number(ammo.quantity)||1}${Number(ammo.damage_multiplier)!==1?` · 傷害×${Number(ammo.damage_multiplier)||1}`:''}`).join('、')}`);
  const granted=gearSkillNameList(gear.granted_skill_template_ids);
  if(granted.length)lines.push(`授予技能：${granted.join('、')}（${gear.grant_mode==='permanent_first_equip'?'首次裝備永久學會':'裝備期間取得'}）`);
  if(gear.set_name)lines.push(`套裝：${gear.set_name}${gear.set_bonus_count?` · ${gear.set_bonus_count} 件效果`:''}`);
  const setSkills=gearSkillNameList(gear.set_bonus_skill_template_ids);if(setSkills.length)lines.push(`套裝技能：${setSkills.join('、')}`);
  if(gear.charges_max>0)lines.push(`充能：${gear.charges_current}/${gear.charges_max}（每次 -${gear.charge_cost}）`);
  if(gear.durability_max>0)lines.push(`耐久：${gear.durability_current}/${gear.durability_max}（每次 -${gear.durability_cost}）`);
  if((gear.skill_modifiers||[]).length)lines.push(`技能強化：${gear.skill_modifiers.map(mod=>{const skill=(state.skillTemplates||[]).find(item=>Number(item.id)===Number(mod.skill_template_id));return `${skill?skill.name:'#'+mod.skill_template_id} 傷害×${Number(mod.damage_multiplier)||1}${Number(mod.turn_cost_delta)?` 回合${Number(mod.turn_cost_delta)>0?'+':''}${Number(mod.turn_cost_delta)}`:''}${Number(mod.charge_turns_delta)?` 蓄力${Number(mod.charge_turns_delta)>0?'+':''}${Number(mod.charge_turns_delta)}`:''}`;}).join('；')}`);
  return lines;
}

// [前端功能備註｜技能] equipmentSkillModifierUI：負責此前端功能的資料處理或互動。修改 UI 時可直接搜尋此函式名稱。
function equipmentSkillModifierUI(character,skill){
  const tid=Number(skill&&(skill.template_id||skill.id))||0;const result={damage_multiplier:1,turn_cost_delta:0,charge_turns_delta:0,sources:[]};if(!tid)return result;
  const equipped=[...(character?.equipped_equipment||[]),...(character?.equipped_weapons||[])].map(gearEntry);
  for(const gear of equipped){if(gear.durability_max>0&&gear.durability_current<=0)continue;for(const mod of gear.skill_modifiers||[]){if(Number(mod.skill_template_id)!==tid)continue;result.damage_multiplier*=Number(mod.damage_multiplier)||1;result.turn_cost_delta+=Number(mod.turn_cost_delta)||0;result.charge_turns_delta+=Number(mod.charge_turns_delta)||0;result.sources.push(gear.name);}}
  result.damage_multiplier=Math.round(result.damage_multiplier*10000)/10000;result.turn_cost_delta=Math.max(-1,Math.min(1,result.turn_cost_delta));result.charge_turns_delta=Math.max(-20,Math.min(20,result.charge_turns_delta));return result;
}

// [前端功能備註｜技能] effectiveSkillTurnCostUI：負責此前端功能的資料處理或互動。修改 UI 時可直接搜尋此函式名稱。
function effectiveSkillTurnCostUI(character,skill){const base=skillTurnCostUI(skill);const mod=equipmentSkillModifierUI(character,skill);return Math.max(0,Math.min(1,base+mod.turn_cost_delta));}
// [前端功能備註｜技能] effectiveSkillChargeTurnsUI：負責此前端功能的資料處理或互動。修改 UI 時可直接搜尋此函式名稱。
function effectiveSkillChargeTurnsUI(character,skill){const base=skillChargeTurnsUI(skill);const mod=equipmentSkillModifierUI(character,skill);return Math.max(0,Math.min(20,base+mod.charge_turns_delta));}

// [前端功能備註｜技能] equipmentGrantedSkillsUI：負責此前端功能的資料處理或互動。修改 UI 時可直接搜尋此函式名稱。

const ELEMENT_NAMES=['暗','光','金','木','水','火','土'];

// [前端功能備註｜地圖／世界] elementAffinityModifierMap：負責此前端功能的資料處理或互動。修改 UI 時可直接搜尋此函式名稱。
function elementAffinityModifierMap(skill){

// [前端功能備註｜狀態／效果] normalizeEffectListUI：負責整理／轉換表單或資料格式。修改 UI 時可直接搜尋此函式名稱。
function normalizeEffectListUI(value){
  if(Array.isArray(value))return value.filter(x=>x&&typeof x==='object');
  if(!value||typeof value!=='object')return [];

  const explicit=Array.isArray(value.list)
    ? value.list.filter(x=>x&&typeof x==='object')
    : Array.isArray(value.effects)
      ? value.effects.filter(x=>x&&typeof x==='object')
      : [];

  const legacy=[];
  const addMap=(source,type)=>{
    if(!source||typeof source!=='object'||Array.isArray(source))return;
    Object.entries(source).forEach(([key,raw])=>{
      const amount=Number(raw)||0;
      if(amount)legacy.push({type,key,value:amount,timing:'passive',operation:amount<0?'spend':'gain'});
    });
  };
  addMap(value.stat_flat,'stat_flat');
  addMap(value.stat_percent,'stat_percent');
  addMap(value.element_affinity,'element_affinity');
  if(Number(value.all_attributes_percent))legacy.push({type:'all_attributes_percent',value:Number(value.all_attributes_percent),timing:'passive',operation:Number(value.all_attributes_percent)<0?'spend':'gain'});
  if(Number(value.heal_hp))legacy.push({type:'heal_hp',value:Number(value.heal_hp),timing:'immediate',operation:'gain'});
  if(Number(value.restore_spirit))legacy.push({type:'heal_spirit',value:Number(value.restore_spirit),timing:'immediate',operation:'gain'});
  if(Number(value.revive_hp_percent))legacy.push({type:'revive',value:Number(value.revive_hp_percent),timing:'immediate',operation:'gain'});

  const combined=[...explicit,...legacy];
  const seen=new Set();
  return combined.filter(effect=>{
    const signature=JSON.stringify({
      type:effect.type||'',key:effect.key||'',value:Number(effect.value??effect.amount)||0,
      operation:effect.operation||'',timing:effect.timing||'',duration_rounds:Number(effect.duration_rounds)||0,
      extra:effect.extra||effect.item_name||effect.status_name||effect.resource_name||'',category:effect.category||''
    });
    if(seen.has(signature))return false;
    seen.add(signature);
    return true;
  });
}

    timing:row.querySelector('.effect-timing')?.value||'immediate',
    duration_rounds:Math.max(0,Number(row.querySelector('.effect-duration')?.value)||0),
    chance:Math.max(0,Math.min(100,Number(row.querySelector('.effect-chance')?.value)||0)),
    extra:row.querySelector('.effect-extra')?.value||'',

  })).filter(effect=>effect.type);

// [前端功能備註｜狀態／效果] effectListSummary：負責此前端功能的資料處理或互動。修改 UI 時可直接搜尋此函式名稱。
function effectListSummary(value){
  const list=normalizeEffectListUI(value);
  if(!list.length)return '';
  return list.map(effect=>{
    const parts=[effectTypeLabel(effect.type)];
    if(effect.key)parts.push(effect.key);
    if(Number(effect.value))parts.push(`${effect.operation==='spend'?'-':effect.operation==='gain'?'+':'='}${Number(effect.value)}`);
    if(effect.extra)parts.push(effect.extra);
    if(effect.timing)parts.push(effectTimingLabel(effect.timing));
    if(Number(effect.duration_rounds)>0)parts.push(`${Number(effect.duration_rounds)}回合`);
    return parts.join(' ');
  }).join('、');
}

// [前端功能備註｜職業] syncSkillProfessionAutoRules：負責送出或同步修改。修改 UI 時可直接搜尋此函式名稱。
async function syncSkillProfessionAutoRules(skillId,rules){
  const grouped=new Map();
  for(const rule of rules||[]){
    if(!grouped.has(String(rule.profession_id)))grouped.set(String(rule.profession_id),[]);
    grouped.get(String(rule.profession_id)).push(rule);
  }
  for(const profession of state.professions||[]){
    const existing=professionAutoSkillRules(profession).filter(rule=>String(rule.skill_template_id)!==String(skillId));
    const additions=(grouped.get(String(profession.id))||[]).map(rule=>({rank:rule.rank,level:rule.level,skill_template_id:Number(skillId)}));
    if(additions.length || professionAutoSkillRules(profession).some(rule=>String(rule.skill_template_id)===String(skillId))){
      await api(`/api/admin/professions/${profession.id}`,{method:'PATCH',body:JSON.stringify({auto_skills:[...existing,...additions]})});
    }
  }
}

const PROFESSION_RANKS=IDENTITY_RANKS;

// [前端功能備註｜技能] skillLearnCost：負責此前端功能的資料處理或互動。修改 UI 時可直接搜尋此函式名稱。
function skillLearnCost(skill){
  const raw=skillData(skill).learn_cost;
  const source=raw&&typeof raw==='object'&&!Array.isArray(raw)?raw:{};
  return {
    mode:source.mode==='cost'?'cost':'reward_only',
    item_name:String(source.item_name||'').trim(),
    item_quantity:Math.max(1,Number(source.item_quantity)||1),
    weird_coins:Math.max(0,Number(source.weird_coins)||0),
    game_coins:Math.max(0,Number(source.game_coins)||0),
    skill_points:Math.max(0,Number(source.skill_points)||0),
    required_profession_id:Math.max(0,Number(source.required_profession_id)||0),
    required_profession_rank:PROFESSION_RANKS.includes(String(source.required_profession_rank||'G').toUpperCase())?String(source.required_profession_rank||'G').toUpperCase():'G',
    required_profession_level:Math.max(1,Math.min(2,Number(source.required_profession_level)||1))
  };
}

function characterOwnsProfession(character,profession){
  if(!character||!profession)return false;

  const progress=professionProgressMap(character);
  if(progress[String(profession.id)])return true;

  const professionName=String(profession.name||'').trim();
  if(!professionName)return false;

  if(String(character.main_class||'').trim()===professionName)return true;

  const subClasses=Array.isArray(character.sub_classes)?character.sub_classes:[];
  return subClasses.some(name=>String(name||'').trim()===professionName);
}

// [前端功能備註｜技能] skillLearnCostText：負責此前端功能的資料處理或互動。修改 UI 時可直接搜尋此函式名稱。
function skillLearnCostText(skill){
  const cost=skillLearnCost(skill);
  if(cost.mode!=='cost') return '只能由職業升級、任務獎勵或 DM 授予取得';
  const parts=[];
  if(cost.item_name)parts.push(`${cost.item_name} ×${cost.item_quantity}`);
  if(cost.weird_coins>0)parts.push(`詭幣 ${cost.weird_coins}`);
  if(cost.game_coins>0)parts.push(`遊戲幣 ${cost.game_coins}`);
  if(cost.skill_points>0)parts.push(`技能點 ${cost.skill_points}`);
  const profession=professionById(cost.required_profession_id);
  if(profession)parts.push(`需要 ${profession.name} ${cost.required_profession_rank} Lv.${cost.required_profession_level}`);
  return parts.length?parts.join(' + '):'尚未設定代價（不能自行取得）';
}

// [前端功能備註｜職業] allProfessionResources：負責此前端功能的資料處理或互動。修改 UI 時可直接搜尋此函式名稱。
function allProfessionResources(){
  const result=[];

  for(const profession of state.professions||[]){
    for(const resource of professionSpecialResources(profession)){
      result.push({
        profession,
        resource,
        key:professionResourceKey(profession,resource)
      });
    }
  }

  return result;
}

// [前端功能備註｜職業] findProfessionResourceByKey：負責此前端功能的資料處理或互動。修改 UI 時可直接搜尋此函式名稱。
function findProfessionResourceByKey(key){
  return allProfessionResources()
    .find(item=>item.key===String(key||'')) || null;
}

// [前端功能備註｜職業] skillClassResourceConfig：負責此前端功能的資料處理或互動。修改 UI 時可直接搜尋此函式名稱。
function skillClassResourceConfig(skill){
  const resources=
    skill &&
    skill.resources &&
    typeof skill.resources==='object' &&
    !Array.isArray(skill.resources)
      ? skill.resources
      : {};

  const effect=resources.class_resource;

  return effect &&
    typeof effect==='object' &&
    !Array.isArray(effect) &&
    effect.key
      ? effect
      : null;
}

// [前端功能備註｜技能] skillResourcePayload：負責此前端功能的資料處理或互動。修改 UI 時可直接搜尋此函式名稱。
function skillResourcePayload(key,operation,amount,amountMode='fixed',maxPercent=0,amountAttribute='',attributeMultiplier=0,amountFlat=0){
  const safeKey=String(key||'');
  if(!safeKey){
    return {};
  }

  const found=findProfessionResourceByKey(safeKey);

  return {
    class_resource:{
      key:safeKey,
      name:found?.resource?.name||'',
      operation:['spend','gain','set'].includes(operation)?operation:'spend',
      amount:Math.max(0,Math.floor(Number(amount)||0)),
      amount_mode:['fixed','max_percent','attribute'].includes(amountMode)?amountMode:'fixed',
      max_percent:Math.max(0,Number(maxPercent)||0),
      amount_attribute:['strength','agility','constitution','spirit','luck'].includes(amountAttribute)?amountAttribute:'',
      attribute_multiplier:Number(attributeMultiplier)||0,
      amount_flat:Number(amountFlat)||0
    }
  };
}

// [前端功能備註｜技能] skillResourceSummary：負責此前端功能的資料處理或互動。修改 UI 時可直接搜尋此函式名稱。
function skillResourceSummary(skill){
  const effect=skillClassResourceConfig(skill);
  if(!effect)return '';

  const found=findProfessionResourceByKey(effect.key);
  const name=found?.resource?.name||effect.name||'職業資源';
  const op={spend:'消耗',gain:'獲得',set:'設定為'}[effect.operation]||'消耗';
  const labels={strength:'力量',agility:'敏捷',constitution:'體質',spirit:'精神',luck:'幸運'};
  let amountText=String(Math.max(0,Number(effect.amount)||0));
  if(effect.amount_mode==='max_percent')amountText=`最大值的 ${Math.max(0,Number(effect.max_percent)||0)}%`;
  if(effect.amount_mode==='attribute'){
    const flat=Number(effect.amount_flat)||0;
    amountText=`${labels[effect.amount_attribute]||'屬性'} × ${Number(effect.attribute_multiplier)||0}${flat?` ${flat>0?'+':'−'} ${Math.abs(flat)}`:''}`;
  }
  return `${name}：${op} ${amountText}`;
}

// [前端功能備註｜職業] classResourcePanelHTML：負責產生／更新畫面。修改 UI 時可直接搜尋此函式名稱。
function classResourcePanelHTML(resource,adminMode=false,targetUserId=null){
  const min=Number(resource.min)||0;
  const max=Math.max(min,Number(resource.max)||0);
  const current=Math.max(min,Math.min(max,Number(resource.current)||0));
  const range=Math.max(1,max-min);
  const pct=Math.max(0,Math.min(100,((current-min)/range)*100));
  const editable=adminMode?resource.dm_editable:resource.player_editable;
  const attributeLabels={strength:'力量',agility:'敏捷',constitution:'體質',spirit:'精神',luck:'幸運'};
  const formulaText=resource.formula_max&&resource.max_attribute
    ? `${attributeLabels[resource.max_attribute]||resource.max_attribute} × ${Number(resource.max_multiplier)||0}${Number(resource.max_flat)?` ${Number(resource.max_flat)>0?'+':'−'} ${Math.abs(Number(resource.max_flat))}`:''}`
    : '';

  return `
    <div class="resource-panel" data-resource-key="${esc(resource.key||'')}">
      <div class="resource-meta">
        <div class="muted">${esc(resource.profession_name||'職業')} · 特殊資源</div>
        <div><b>${esc(resource.name||'未命名資源')}</b></div>
        <div class="resource-value">${current} / ${max}</div>
        ${formulaText?`<div class="muted">上限：${esc(formulaText)}</div>`:''}
        ${resource.show_bar!==false?`<div class="resource-bar"><div class="resource-bar-fill" style="width:${pct}%"></div></div>`:''}
        ${Number(resource.round_delta)?`<div class="muted">每完整回合 ${Number(resource.round_delta)>0?'+':''}${Number(resource.round_delta)}</div>`:''}
      </div>
      ${editable?`
        <div class="actions">
          <button class="btn ghost small adjust-class-resource" data-key="${esc(resource.key||'')}" data-delta="-10" ${adminMode?`data-admin-user-id="${targetUserId}"`:''}>-10</button>
          <button class="btn ghost small adjust-class-resource" data-key="${esc(resource.key||'')}" data-delta="-1" ${adminMode?`data-admin-user-id="${targetUserId}"`:''}>-1</button>
          <button class="btn secondary small set-class-resource" data-key="${esc(resource.key||'')}" data-name="${esc(resource.name||'職業資源')}" ${adminMode?`data-admin-user-id="${targetUserId}"`:''}>設定</button>
          <button class="btn ghost small adjust-class-resource" data-key="${esc(resource.key||'')}" data-delta="1" ${adminMode?`data-admin-user-id="${targetUserId}"`:''}>+1</button>
          <button class="btn ghost small adjust-class-resource" data-key="${esc(resource.key||'')}" data-delta="10" ${adminMode?`data-admin-user-id="${targetUserId}"`:''}>+10</button>
        </div>
      `:'<div class="muted">由技能或 DM 管理</div>'}
    </div>
  `;
}

function skillSummonTemplateIds(skill){

        .map(Number)

function toast(message){
  const el = $('#toast');

  el.textContent = message;
  el.classList.remove('hidden');

  clearTimeout(window.__toast);

  window.__toast =
    setTimeout(
      () => el.classList.add('hidden'),
      2600
    );
}


// [前端功能備註｜API／資料載入] api：負責此前端功能的資料處理或互動。修改 UI 時可直接搜尋此函式名稱。
async function api(url, options = {}){

  const response =
    await fetch(
      url,
      {
        ...options,

        headers:{
          'Content-Type':
            'application/json',

          'Authorization':
            `Bearer ${state.token}`,

          ...(options.headers || {})
        }
      }
    );

  const data =
    await response
      .json()
      .catch(
        () => ({})
      );

  if(!response.ok){
    throw new Error(
      data.error ||
      '請求失敗'
    );
  }

  return data;
}

        loadPublicTasks(),

        loadJournal(),
        loadItemTemplates(),
        loadProductivityCenter()
      ]);
    }

    if(state.user.is_admin){

      await loadAdminData();

      const lastRoomId =
        Number(
          localStorage.getItem('rpg_last_room_id') || 0
        );

      if(lastRoomId){
        try{
          const snapshot =
            await api(`/api/rooms/${lastRoomId}`);

          state.room =
            snapshot;

          state.view =
            'room';
        }catch(error){
          console.warn(
            '恢復上次房間失敗',
            error
          );

          localStorage.removeItem(
            'rpg_last_room_id'
          );

          state.view =
            'admin';
        }
      }else{
        state.view =
          'admin';
      }

    }else if(CPP_CORE_PREVIEW){
      const lastRoomId=Number(localStorage.getItem('rpg_last_room_id')||0);
      if(lastRoomId){
        try{
          state.room=await api(`/api/rooms/${lastRoomId}`);
          state.view='room';
        }catch(error){
          console.warn('恢復上次房間失敗',error);
          localStorage.removeItem('rpg_last_room_id');
        }
      }
    }

    showApp();

    if(state.room?.room?.id && !CPP_CORE_PREVIEW){
      Promise.allSettled([
        loadMapNodes(),
        loadTimeView(),
        loadRoomWorld(),
        loadWorldSystems(),
        loadRoomContainers(),
        loadTeamData()
      ]).then(()=>render());
    }

  }catch(error){

    console.error(error);

    localStorage.removeItem(
      'rpg_token'
    );

    state.token = null;

    showAuth();
  }
}


// [前端功能備註｜登入／帳號] submitAuth：負責送出或同步修改。修改 UI 時可直接搜尋此函式名稱。
async function submitAuth(event){

  event.preventDefault();

  $('#authError').textContent =
    '';

  const username =
    $('#username')
      .value
      .trim();

  const password =
    $('#password')
      .value;

  try{

    const endpoint =
      state.authMode === 'login'
        ? '/api/auth/login'
        : '/api/auth/register';

    const response =
      await fetch(
        endpoint,
        {
          method:'POST',

          headers:{
            'Content-Type':
              'application/json'
          },

          body:
            JSON.stringify({
              username,
              password
            })
        }
      );

    const data =
      await response
        .json()
        .catch(
          () => ({})
        );

    if(!response.ok){
      throw new Error(
        data.error ||
        '操作失敗'
      );
    }

    state.token =
      data.token;

    state.user =
      data.user;

    localStorage.setItem(
      'rpg_token',
      state.token
    );

    await loadMyCharacter();
    if(!CPP_CORE_PREVIEW){
      await Promise.all([loadProfessions(), loadBloodlines(), loadIdentitySystems(), loadWheels(), loadFactions(), loadSkillTemplates(), loadSummonTemplates(), loadMySummons(), loadRecipes(), loadShop(), loadWorldLibraries(), loadJournal(), loadItemTemplates()]);
    }

    if(state.user.is_admin){

      await loadAdminData();

      state.view =
        'admin';

    }else{

      state.view =
        'dashboard';

    }

    showApp();

  }catch(error){

    $('#authError')
      .textContent =
        error.message;
  }
}

   SOCKET
========================================================= */

// [前端功能備註｜共用工具] connectSocket：負責此前端功能的資料處理或互動。修改 UI 時可直接搜尋此函式名稱。
function connectSocket(){

  if(state.socket){
    state.socket.disconnect();
  }

  state.socket =
    io({
      auth:{
        token:
          state.token
      }
    });

  state.socket.on(
    'connect',
    () => {
      if(state.room?.room?.id){
        state.socket.emit('room:enter',{roomId:state.room.room.id});
      }
    }
  );

  state.socket.on(
    'connect_error',
    () => toast('即時連線失敗')
  );

  state.socket.on(
    'presence',
    data => {

      state.online =
        data.online || [];

      render();
    }
  );

  state.socket.on(
    'room:snapshot',
    snapshot => {

      state.room =
        snapshot;

      if(CPP_CORE_PREVIEW){
        render();
        return;
      }

      Promise.all([
        loadTimeView(),
        loadRoomWorld()
      ]).then(()=>render()).catch(()=>render());
    }
  );

  state.socket.on(
    'error:message',
    message => {
      toast(message);
    }
  );

  state.socket.on(
    'team:update',
    async () => {
      if(state.view==='team'){
        await Promise.all([loadTeamData(),loadTimeView()]);
        render();
      }else if(state.room?.room?.id){
        await loadTimeView();
        render();
      }
    }
  );
}


// [前端功能備註｜房間／跑團] activateRoom：負責此前端功能的資料處理或互動。修改 UI 時可直接搜尋此函式名稱。
async function activateRoom(snapshot){
  if(!snapshot?.room?.id){
    throw new Error('房間資料不完整');
  }

  state.room=snapshot;
  state.view='room';
  localStorage.setItem('rpg_last_room_id',String(snapshot.room.id));
  localStorage.setItem('rpg_last_view','room');

  if(state.socket){
    state.socket.emit('room:enter',{roomId:snapshot.room.id});
  }

  render();

  if(CPP_CORE_PREVIEW){
    return;
  }

  await Promise.allSettled([
    loadMapNodes(),
    loadTimeView(),
    loadRoomWorld(),
    loadWorldSystems(),
    loadRoomContainers(),
    loadTeamData(),
    loadWheels()
  ]);

  render();
}

// [前端功能備註｜房間／跑團] enterRoomById：負責此前端功能的資料處理或互動。修改 UI 時可直接搜尋此函式名稱。
async function enterRoomById(roomId){
  const id=Number(roomId);
  if(!id)throw new Error('房間 ID 無效');
  const snapshot=await api(`/api/rooms/${id}`);
  await activateRoom(snapshot);
}

// [前端功能備註｜存檔／備份／稽核] downloadBackupJson：負責此前端功能的資料處理或互動。修改 UI 時可直接搜尋此函式名稱。
function downloadBackupJson(backup,fileName){
  const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const link=document.createElement('a');
  link.href=url;
  link.download=String(fileName||'trpg-backup.json').replace(/[^a-zA-Z0-9._-]/g,'-');
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

// [前端功能備註｜裝備比較] 將道具模板 effects 轉成容易閱讀的屬性摘要；實際數值規則仍由 C++/角色計算為準。
function itemEffectSummary(item){
  const effects=item?.effects&&typeof item.effects==='object'?item.effects:{};
  const pairs=[];
  const labels={agility:'敏捷',strength:'力量',constitution:'體質',spirit:'精神',great_way:'大道',faith:'信仰',luck:'幸運',hp:'生命',sanity:'理智'};
  Object.entries(effects).forEach(([key,value])=>{
    if(value===null||value===undefined||value===''||typeof value==='object')return;
    pairs.push(`${labels[key]||key} ${Number(value)>0?'+':''}${value}`);
  });
  return pairs.length?pairs.join('、'):(Object.keys(effects).length?JSON.stringify(effects):'沒有數值效果資料');
}

  const raw=String(text||'').trim();
  if(!raw)return [];
  if(raw.startsWith('[')){const parsed=JSON.parse(raw);if(!Array.isArray(parsed))throw new Error('JSON 必須是陣列');return parsed;}
  const delimiter=raw.includes('\t')?'\t':',';
  const parseLine=line=>{const out=[];let current='',quoted=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(quoted&&line[i+1]==='"'){current+='"';i++;}else quoted=!quoted;}else if(ch===delimiter&&!quoted){out.push(current.trim());current='';}else current+=ch;}out.push(current.trim());return out;};
  const lines=raw.split(/\r?\n/).filter(x=>x.trim());if(lines.length<2)throw new Error('CSV/TSV 至少需要標題列與一筆資料');const headers=parseLine(lines[0]).map(x=>x.trim());return lines.slice(1).map(line=>{const values=parseLine(line);const row={};headers.forEach((h,i)=>{let v=values[i]??'';if(['level','price_weird','quantity','stock','purchase_limit','tree_order','point_cost'].includes(h)&&v!=='')v=Number(v);if(['consume_on_use','active'].includes(h)&&v!=='')v=['1','true','yes','是'].includes(String(v).toLowerCase());if(['tags','prerequisite_skill_ids','prerequisite_ids'].includes(h)&&typeof v==='string')v=v.split(/[|、;]/).map(x=>x.trim()).filter(Boolean).map(x=>['prerequisite_skill_ids','prerequisite_ids'].includes(h)?Number(x):x);if(['effects','resources','data'].includes(h)&&typeof v==='string'&&v.trim()){try{v=JSON.parse(v);}catch{throw new Error(`欄位 ${h} 必須是合法 JSON`);}}row[h]=v;});return row;});
}

function studyPrereqNames(study,kind){
  const list=kind==='magic'?(state.magicStudies||[]):(state.ritualStudies||[]);
  const ids=Array.isArray(study?.prerequisite_ids)?study.prerequisite_ids:[];
  return ids.map(id=>list.find(x=>Number(x.id)===Number(id))?.name||`#${id}`).join('、')||'無';
}

// [前端功能備註｜魔法學／儀式學] studyElementBonusSummary：摘要學會條目後提供的元素儲存上限加成。
function studyElementBonusSummary(study){
  const map=study?.effects?.element_storage_cap_bonus||{};
  const parts=ELEMENT_NAMES.filter(e=>Number(map[e])).map(e=>`${e}${Number(map[e])>0?'+':''}${Number(map[e])}`);
  return parts.join('、')||'無';
}

// [前端功能備註｜規則書] rulebookHTML：玩家規則書；DM 可直接新增、修改與刪除。
function rulebookHTML(){
  const entries=state.rulebookEntries||[];
  const grouped={};
  entries.forEach(entry=>{const category=entry.category||'一般';if(!grouped[category])grouped[category]=[];grouped[category].push(entry);});
  let html='';
  if(state.user?.is_admin){
    html+=`<div class="card pad"><h3>🛠️ DM 規則書編輯</h3><form id="rulebookForm" class="edit-grid section"><input type="hidden" id="rulebookId"><div class="field"><label>標題</label><input id="rulebookTitle" required maxlength="160"></div><div class="field"><label>分類</label><input id="rulebookCategory" value="一般" maxlength="80"></div><div class="field"><label>排序</label><input id="rulebookSort" type="number" value="0"></div><div class="field"><label class="choice-option"><input id="rulebookPublic" type="checkbox" checked><span><b>玩家可見</b></span></label></div><div class="field" style="grid-column:1/-1"><label>規則內容</label><textarea id="rulebookContent" rows="8"></textarea></div><div class="actions" style="grid-column:1/-1"><button class="btn">儲存規則</button><button type="button" id="rulebookReset" class="btn ghost">清除</button></div></form></div>`;
  }
  html+=`<div class="card pad section"><div class="muted">RULEBOOK</div><h2>📖 規則書</h2><div class="muted">由 DM 統一維護並依分類查閱。</div></div>`;
  const categories=Object.keys(grouped);
  if(!categories.length)return html+'<div class="card pad"><div class="muted">目前沒有規則書條目。</div></div>';
  for(const category of categories){
    const rows=grouped[category].sort((a,b)=>(Number(a.sort_order)||0)-(Number(b.sort_order)||0));
    html+=`<div class="card pad section"><h3>${esc(category)}</h3><div class="user-list section">`;
    for(const entry of rows){
      const controls=state.user?.is_admin?`<div class="actions"><button class="btn secondary small edit-rulebook" data-id="${entry.id}">修改</button><button class="btn danger small delete-rulebook" data-id="${entry.id}">刪除</button></div>`:'';

    }
    html+='</div></div>';
  }
  return html;
}

// [前端功能備註｜房間／跑團] cppRoomHTML：負責產生／更新畫面；對應 API：/api/admin/clue-combinations, /api/admin/clues, /api/admin/item-templates, /api/admin/monster-templates。修改 UI 時可直接搜尋此函式名稱。
function cppRoomHTML(){
  const room=state.room?.room;
  if(!room)return `<div class="card pad"><h2>跑團房間</h2><div class="muted">請先從首頁建立或加入房間。</div></div>`;
  const isAdmin=Boolean(state.user?.is_admin);
  const battle=Boolean(room.battle_active);
  const monsters=state.room?.monsters||[];
  const npcs=state.room?.npcs||[];
  const me=(state.room?.members||[]).find(x=>String(x.id)===String(state.user?.id));
  const enemyTargets=[
    ...monsters.filter(m=>m.status==='encountered'&&Number(m.current_hp)>0).map(m=>({type:'monster',id:m.id,name:m.name})),
    ...npcs.filter(n=>n.status==='active'&&n.combat_side==='enemy'&&Number(n.current_hp)>0).map(n=>({type:'npc',id:n.id,name:n.name}))
  ];
  const actorType=String(room.current_actor_type||'');
  const actorId=Number(room.current_actor_ref_id||room.current_actor_id)||0;
  const actor=actorType==='player'
    ? (state.room?.members||[]).find(x=>String(x.id)===String(actorId))
    : actorType==='monster'
      ? monsters.find(x=>String(x.id)===String(actorId))
      : npcs.find(x=>String(x.id)===String(actorId));
  const actorName=actor?.display_name||actor?.name||'尚未指定';
  const myTurn=battle&&actorType==='player'&&String(actorId)===String(state.user?.id);
  const timeline=(state.room?.events||[]).filter(event=>event.type!=='chat').map(event=>{
    const text=event.type==='dice'
      ? `🎲 ${event.payload?.label||'擲骰'}：${event.payload?.notation||''} = ${event.payload?.total??''}`
      : (event.payload?.text||event.type);
    return `<div class="event"><span class="muted">${esc(event.character_name||event.username||'系統')}</span><div>${esc(text)}</div></div>`;
  }).join('')||'<div class="muted">目前沒有事件。</div>';
  const statusText=room.status==='active'?(battle?'⚔️ 戰鬥中':'🕯️ 探索中'):(room.status==='saved'?'已存檔':room.status==='closed'?'已結束':'等待 DM 開團');
  return `
    <section class="card pad hero"><div><div class="muted">房間代碼 ${esc(room.code)}</div><h2>${esc(room.name)}</h2><div class="muted">${statusText}${battle?` · 第 ${Number(room.round)||1} 回合 · 目前：${esc(actorName)}`:''}</div></div><div class="actions">${isAdmin&&room.status==='lobby'?'<button class="btn" id="startCampaign">▶ DM 開團</button>':''}${isAdmin&&room.status==='active'&&!battle?'<button class="btn" id="startBattle">⚔️ 開始戰鬥</button>':''}${isAdmin&&battle?'<button class="btn secondary" id="nextTurn">⏭️ DM 推進行動</button><button class="btn ghost" id="endBattle">結束戰鬥</button>':''}${isAdmin&&battle&&['monster','npc'].includes(actorType)?'<button class="btn danger" id="cppAiCombatAct">🤖 執行 AI 行動</button>':''}${myTurn?'<button class="btn ghost" id="passCombatAction">放棄這次行動</button>':''}</div></section>
    <div class="grid2 section">
      <section class="card pad"><h3>成員</h3><div class="member-list section">${membersHTML()}</div></section>
      <section class="card pad"><h3>戰鬥狀態</h3>${battle?`<div class="muted">行動序會依敏捷排序；每輪行動數 = 1 + floor(敏捷 / 50)。D100 攻擊成功層級必須勝過目標的閃避／防禦。</div>${myTurn?`<div class="section"><div class="field"><label>受到攻擊時</label><select id="cppCombatReaction"><option value="dodge" ${me?.combat_reaction!=='defense'?'selected':''}>閃避（敏捷）</option><option value="defense" ${me?.combat_reaction==='defense'?'selected':''}>防禦（體質，命中後減傷 20%）</option></select></div><div class="actions section"><select id="cppCombatTarget"><option value="">選擇基本攻擊目標</option>${enemyTargets.map(t=>`<option value="${t.type}:${t.id}">${t.type==='monster'?'👹':'🧑'} ${esc(t.name)}</option>`).join('')}</select><button class="btn" id="cppBasicAttack" ${enemyTargets.length?'':'disabled'}>⚔️ 基本攻擊</button></div></div>`:''}<div class="user-list section">${(state.room?.members||[]).filter(m=>m.role==='player').map(m=>`<div class="user-row"><div><b>🧙 ${esc(m.display_name||m.username||'玩家')}</b><div class="muted">HP ${Number(m.hp)||0}/${Number(m.max_hp)||0} · 剩餘行動 ${Number(m.turn_actions_remaining)||0}</div></div><span class="badge ${actorType==='player'&&String(actorId)===String(m.id)?'player':''}">${actorType==='player'&&String(actorId)===String(m.id)?'目前行動':'玩家'}</span><div></div></div>`).join('')}${monsters.filter(m=>m.status==='encountered').map(m=>`<div class="user-row"><div><b>👹 ${esc(m.name)}</b><div class="muted">HP ${Number(m.current_hp)||0}/${Number(m.max_hp)||0} · 剩餘行動 ${Number(m.turn_actions_remaining)||0}</div></div><span class="badge ${actorType==='monster'&&String(actorId)===String(m.id)?'admin':''}">${actorType==='monster'&&String(actorId)===String(m.id)?'目前行動':'敵方'}</span><div></div></div>`).join('')}</div>`:'<div class="muted">尚未進入戰鬥。DM 先把怪物設為「遭遇」，再開始戰鬥。</div>'}</section>
    </div>
    ${isAdmin?`<section class="card pad section"><h3>👹 房間怪物</h3><form id="cppRoomMonsterForm" class="actions section"><select id="cppRoomMonsterTemplate" required><option value="">選擇怪物卡</option>${(state.monsterTemplates||[]).map(m=>`<option value="${m.id}">${esc(m.name)} · ${esc(m.rank||'G')}</option>`).join('')}</select><button class="btn">加入房間</button></form><div class="user-list section">${monsters.length?monsters.map(m=>`<div class="user-row"><div><b>${m.status==='encountered'?'👹':'❔'} ${esc(m.name)}</b><div class="muted">${esc(m.status)} · HP ${Number(m.current_hp)||0}/${Number(m.max_hp)||0} · 敏捷 ${Number(m.attributes?.agility)||0}</div></div><span class="badge">#${m.id}</span><div class="actions">${m.status!=='encountered'?`<button class="btn secondary small cpp-encounter-monster" data-id="${m.id}">設為遭遇</button>`:''}<button class="btn danger small cpp-remove-room-monster" data-id="${m.id}">移除</button></div></div>`).join(''):'<div class="muted">房間內還沒有怪物。</div>'}</div></section>`:''}
    <div class="grid2 section">
      <section class="card pad"><h3>事件／骰子</h3><div class="event-list section">${timeline}</div></section>
      <section class="card pad"><h3>房間聊天</h3><div class="chat-log section">${chatHTML()}</div><form id="chatForm" class="actions section"><input id="chatInput" maxlength="1000" placeholder="輸入訊息" required><button class="btn" type="submit">送出</button></form></section>
    </div>`;
}

// [前端功能備註｜任務] taskRewardHTML：負責產生／更新畫面。修改 UI 時可直接搜尋此函式名稱。
function taskRewardHTML(rewards){
  const r=rewards||{};
  const parts=[];
  if(Number(r.experience)>0)parts.push(`經驗 +${Number(r.experience)}`);
  if(Number(r.attribute_points)>0)parts.push(`屬性點 +${Number(r.attribute_points)}`);
  if(Number(r.skill_points)>0)parts.push(`技能點 +${Number(r.skill_points)}`);
  if(Number(r.magic_points)>0)parts.push(`魔法學點數 +${Number(r.magic_points)}`);
  if(Number(r.ritual_points)>0)parts.push(`儀式學點數 +${Number(r.ritual_points)}`);
  if(Number(r.weird_coins)>0)parts.push(`詭幣 +${Number(r.weird_coins)}`);
  if(Number(r.game_coins)>0)parts.push(`遊戲幣 +${Number(r.game_coins)}`);
  if(Array.isArray(r.inventory))for(const item of r.inventory){if(item?.name)parts.push(`${item.name} ×${Number(item.quantity)||1}`);}
  if(Array.isArray(r.equipment))for(const item of r.equipment){parts.push(`裝備：${inventoryDisplayName(item)}`);}
  if(Array.isArray(r.weapons))for(const item of r.weapons){parts.push(`武器：${inventoryDisplayName(item)}`);}
  if(Array.isArray(r.skill_template_ids))for(const id of r.skill_template_ids){const skill=(state.skillTemplates||[]).find(x=>String(x.id)===String(id));parts.push(`技能：${skill?skill.name:'#'+id}`);}
  if(Array.isArray(r.profession_grants))for(const grant of r.profession_grants){const profession=professionById(grant?.profession_id);if(profession){const book=professionBookInfo(profession);parts.push(`職業書：${book.name} ×${book.quantity}`);}else parts.push(`職業書：#${grant?.profession_id}`);}
  if(Array.isArray(r.profession_level_ups))for(const id of r.profession_level_ups){const profession=professionById(id);parts.push(`職業升級：${profession?profession.name:'#'+id} +1`);}
  if(Array.isArray(r.reputation_changes))for(const change of r.reputation_changes){parts.push(`${factionNameUI(change.faction_id)}聲望 ${Number(change.amount)>=0?'+':''}${Number(change.amount)||0}`);}
  return parts.length?parts.map(esc).join(' · '):'無預設獎勵';
}

function wheelGradient(options){const list=Array.isArray(options)?options:[];if(!list.length)return 'conic-gradient(#333 0 100%)';const total=list.reduce((s,x)=>s+Math.max(1,Number(x.weight)||1),0);const colors=['#667eea','#764ba2','#ef6c6c','#4db6ac','#f6bf55','#5c9ded','#ab6dd1','#78c679','#ed8c4a','#5b6ee1'];let cur=0;const stops=[];list.forEach((x,i)=>{const start=cur/total*100;cur+=Math.max(1,Number(x.weight)||1);const end=cur/total*100;stops.push(`${colors[i%colors.length]} ${start}% ${end}%`);});return `conic-gradient(${stops.join(',')})`;}

// [前端功能備註｜存檔／備份／稽核] backupScopeLabel：負責此前端功能的資料處理或互動。修改 UI 時可直接搜尋此函式名稱。
function backupScopeLabel(scope){
  return {site:'全站封存',room:'房間狀態',character:'角色資料'}[String(scope||'')]||String(scope||'未知');
}

// [前端功能備註｜存檔／備份／稽核] backupCountSummary：負責此前端功能的資料處理或互動。修改 UI 時可直接搜尋此函式名稱。
function backupCountSummary(counts){
  const labels={character:'角色卡',members:'成員',characters:'角色卡',map_nodes:'地圖節點',teams:'隊伍',monsters:'怪物',npcs:'NPC',dungeons:'副本',summons:'召喚物',statuses:'狀態',combat_statuses:'戰鬥狀態',relations:'NPC 關係',containers:'搜索容器',scheduled:'排程事件',chases:'追逐',great_ways:'大道',faiths:'信仰',reputations:'聲望',clues:'線索',rules:'規則情報',item_identifications:'道具鑑定',tasks:'任務狀態'};
  const entries=Object.entries(counts||{}).filter(([,value])=>Number(value)>0).slice(0,30);
  return entries.length?entries.map(([key,value])=>`${esc(labels[key]||key)} ${Number(value)||0}`).join(' · '):'沒有可計數的資料列';
}

// [前端功能備註｜狀態／效果] openStatusTemplateEditor：負責開啟編輯視窗。修改 UI 時可直接搜尋此函式名稱。
function openStatusTemplateEditor(st){
  if(!st)return;
  $('#modalTitle').textContent=`修改狀態：${st.name}`;
  $('#modalBody').innerHTML=`
    <div class="edit-grid">
      <div class="field"><label>狀態名稱</label><input id="editStatusName" value="${esc(st.name||'')}"></div>
      <div class="field"><label>類別</label><input id="editStatusCategory" value="${esc(st.category||'狀態')}"></div>
      <div class="field"><label>持續回合</label><input id="editStatusDuration" type="number" min="0" value="${Number(st.duration_rounds)||0}"></div>
      <div class="field"><label>重複取得時</label><select id="editStatusStackMode">${[['refresh','刷新持續時間'],['stack','疊加層數'],['independent','獨立存在'],['replace','取代舊狀態'],['ignore','已有時忽略']].map(([v,t])=>`<option value="${v}" ${st.stack_mode===v?'selected':''}>${t}</option>`).join('')}</select></div>
      <div class="field"><label>最大層數</label><input id="editStatusMaxStacks" type="number" min="1" max="99" value="${Number(st.max_stacks)||1}"></div>
      <div class="field"><label>標籤</label><input id="editStatusTags" value="${esc(Array.isArray(st.tags)?st.tags.join(','): '')}"></div>
      <div class="field"><label class="choice-option"><input id="editStatusDispellable" type="checkbox" ${st.dispellable===false?'':'checked'}><span><b>可被解除</b></span></label></div>
      <div class="field" style="grid-column:1/-1"><label>說明</label><textarea id="editStatusDescription">${esc(st.description||'')}</textarea></div>
      <div class="field" style="grid-column:1/-1"><label>效果</label><div id="editStatusEffectsList" class="effect-builder">${normalizeEffectListUI(st.effects).map(effectRowHTML).join('')}</div><button type="button" id="addEditStatusEffect" class="btn secondary small section">＋ 新增效果</button></div>
    </div><div id="editStatusError" class="error"></div>`;
  const container=$('#editStatusEffectsList');bindEffectBuilder(container);$('#addEditStatusEffect').onclick=()=>addEffectRow(container,{});
  $('#modal').classList.remove('hidden');$('#modalCancel').onclick=closeModal;
  $('#modalOk').onclick=async()=>{try{
    await api(`/api/admin/status-templates/${st.id}`,{method:'PATCH',body:JSON.stringify({name:$('#editStatusName').value,category:$('#editStatusCategory').value,description:$('#editStatusDescription').value,duration_rounds:Number($('#editStatusDuration').value)||0,stack_mode:$('#editStatusStackMode').value,max_stacks:Number($('#editStatusMaxStacks').value)||1,dispellable:$('#editStatusDispellable').checked,tags:$('#editStatusTags').value.split(',').map(x=>x.trim()).filter(Boolean),effects:{list:collectEffectRows(container)}})});
    await loadAdminInvestigationData();closeModal();render();toast('狀態模板已修改');
  }catch(error){$('#editStatusError').textContent=error.message;}};
}

    </div>

// [前端功能備註｜職業] openProfessionEditor：負責開啟編輯視窗。修改 UI 時可直接搜尋此函式名稱。
function openProfessionEditor(profession){
  if(!profession){toast('找不到職業');return;}
  const resources=professionSpecialResources(profession);
  const autoSkills=professionAutoSkillRules(profession);
  $('#modalTitle').textContent=`修改職業：${profession.name}`;
  $('#modalBody').innerHTML=`
    <div class="edit-grid"><div class="field"><label>職業名稱</label><input id="editPfName" value="${esc(profession.name||'')}"></div><div class="field"><label>用途</label><select id="editPfCategory"><option value="both" ${profession.category==='both'?'selected':''}>主／副皆可</option><option value="main" ${profession.category==='main'?'selected':''}>只可主職業</option><option value="sub" ${profession.category==='sub'?'selected':''}>只可副職業</option></select></div><div class="field"><label>起始等階</label><select id="editPfRank">${PROFESSION_RANKS.map(x=>`<option ${profession.rank===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>取得所需職業書</label><input id="editPfBookName" value="${esc(professionBookInfo(profession).name)}"></div><div class="field"><label>職業書數量</label><input id="editPfBookQty" type="number" min="1" value="${professionBookInfo(profession).quantity}"></div><div class="field" style="grid-column:1/-1"><label>說明</label><textarea id="editPfDescription" rows="3">${esc(profession.description||'')}</textarea></div></div>
    <div class="section"><div class="resource-editor-head"><div><b>職業特殊資源</b><div class="muted">修改上限時，玩家現有數值會限制在新上限。</div></div><button type="button" id="editAddPfResource" class="btn secondary small">＋ 新增特殊資源</button></div><div id="editPfResourceList" class="resource-editor-list">${resources.map(resource=>professionResourceRowHTML(resource,'editpf')).join('')}</div></div>
    <div class="section"><div class="resource-editor-head"><div><b>升級自動取得技能</b><div class="muted">已經達到該里程碑的角色，在同步後也會自動補發技能。</div></div><button type="button" id="editAddPfAutoSkill" class="btn secondary small">＋ 新增自動技能</button></div><div id="editPfAutoSkillList" class="section">${autoSkills.map(professionAutoSkillRowHTML).join('')}</div></div>
    <div class="section"><div class="resource-editor-head"><div><b>職業持續效果</b><div class="muted">只要角色持有這個職業就會自動計算。</div></div><button type="button" id="editAddPfEffect" class="btn secondary small">＋ 新增效果</button></div><div id="editPfEffectsList" class="effect-builder section">${normalizeEffectListUI(professionEffects(profession)).map(effectRowHTML).join('')}</div></div>
    <div id="editPfError" class="error"></div>`;
  const container=$('#editPfResourceList');bindProfessionResourceEditor(container);$('#editAddPfResource').onclick=()=>addProfessionResourceRow(container,{});
  const autoContainer=$('#editPfAutoSkillList');bindProfessionAutoSkillRows(autoContainer);$('#editAddPfAutoSkill').onclick=()=>{autoContainer.insertAdjacentHTML('beforeend',professionAutoSkillRowHTML());bindProfessionAutoSkillRows(autoContainer);};
  const effectContainer=$('#editPfEffectsList');bindEffectBuilder(effectContainer);$('#editAddPfEffect').onclick=()=>addEffectRow(effectContainer,{type:'stat_flat',key:'strength',timing:'passive'});
  $('#modal').classList.remove('hidden');$('#modalCancel').onclick=closeModal;$('#modalOk').onclick=async()=>{try{await api(`/api/admin/professions/${profession.id}`,{method:'PATCH',body:JSON.stringify({name:$('#editPfName').value,category:$('#editPfCategory').value,rank:$('#editPfRank').value,description:$('#editPfDescription').value,book_name:$('#editPfBookName').value,book_quantity:Number($('#editPfBookQty').value)||1,special_resources:collectProfessionResources(container),auto_skills:collectProfessionAutoSkills(autoContainer),effects:{list:collectEffectRows(effectContainer)}})});await Promise.all([loadProfessions(),loadSkillTemplates(),loadMyCharacter(),loadAdminCharacters()]);closeModal();render();toast('職業已修改');}catch(error){$('#editPfError').textContent=error.message;}};
}

    <div class="field"><label>語言能力</label><input id="editSmLanguage" type="number" min="0" max="10" value="${Number(item.language_level)||0}"></div>
    <div class="field"><label>忠誠度</label><input id="editSmLoyalty" type="number" min="0" value="${Number(item.loyalty)||0}"></div>

  <div class="field"><label>基礎屬性</label>${baseAttributeInputsHTML('editSmAttr',item.attributes||{})}</div>
  <div class="field"><label>基礎元素親和</label>${baseElementAffinityInputsHTML('editSmAffinity',item.element_affinity||{})}</div>

  <div id="editSmError" class="error"></div>`;
  const effects=$('#editSmEffectsList');bindEffectBuilder(effects);$('#editAddSmEffect').onclick=()=>addEffectRow(effects,{type:'stat_flat',key:'strength',timing:'passive'});
  $('#modal').classList.remove('hidden');

// [前端功能備註｜頭像直接上傳] 將使用者選取的 JPG/PNG/WebP 轉成 base64 JSON 交給 C++；前端不直接保存圖片。
async function avatarFilePayload(file){
  if(!file)throw new Error('請先選擇圖片');
  const allowed=['image/jpeg','image/png','image/webp'];
  if(!allowed.includes(String(file.type||'').toLowerCase()))throw new Error('只支援 JPG、PNG、WebP');
  if(file.size>5*1024*1024)throw new Error('頭像檔案不能超過 5 MB');
  const dataUrl=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result||''));reader.onerror=()=>reject(new Error('讀取圖片失敗'));reader.readAsDataURL(file);});
  const comma=dataUrl.indexOf(',');if(comma<0)throw new Error('圖片資料格式錯誤');
  return {image_base64:dataUrl.slice(comma+1)};
}

// [前端功能備註｜頭像直接上傳] 呼叫 C++ 上傳端點並回傳新的角色資料。
async function uploadAvatarFile(endpoint,file){
  const payload=await avatarFilePayload(file);
  return api(endpoint,{method:'POST',body:JSON.stringify(payload)});
}

// [前端功能備註｜頭像預覽] 本機預覽不會上傳，只有按儲存後才送到 C++。
function previewAvatarFile(file,targetSelector,fallback='?'){
  const target=$(targetSelector);if(!target||!file)return;
  if(!['image/jpeg','image/png','image/webp'].includes(String(file.type||'').toLowerCase())){target.innerHTML=esc(fallback);return;}
  const reader=new FileReader();reader.onload=()=>{target.innerHTML=`<img src="${esc(String(reader.result||''))}" alt="頭像預覽" style="width:100%;height:100%;object-fit:cover">`;};reader.readAsDataURL(file);
}

function professionOptions(category, selected=''){
  const items=(state.professions||[]).filter(item=>item.category===category||item.category==='both');
  const hasSelected=items.some(item=>item.name===selected);
  const legacy=selected && selected!=='未設定' && !hasSelected
    ? `<option value="${esc(selected)}" selected>${esc(selected)}（舊資料）</option>`
    : '';
  return `<option value="">未設定</option>`+legacy+items.map(item=>`<option value="${esc(item.name)}" ${item.name===selected?'selected':''}>${esc(item.name)} · ${esc(item.rank||'G')}</option>`).join('');
}

// [前端功能備註｜職業] openProfessionAcquire：負責此前端功能的資料處理或互動。修改 UI 時可直接搜尋此函式名稱。
function openProfessionAcquire(){
  const character=state.myCharacter;if(!character)return toast('找不到角色卡');
  const professions=(state.professions||[]).filter(p=>!characterOwnsProfession(character,p));
  if(!professions.length)return toast('目前沒有可取得的新職業');
  $('#modalTitle').textContent='使用職業書取得職業';
  $('#modalBody').innerHTML=`<div class="muted">玩家不能直接選職業。必須先取得該職業設定的「職業書」，確認後會自動消耗。已有主職業時不能用職業書覆蓋主職業，只能取得可作為副職業的職業。</div><div class="field"><label>職業</label><select id="acqProfession">${professions.map(p=>`<option value="${p.id}">${esc(p.name)} · 需要 ${esc(professionBookInfo(p).name)} ×${professionBookInfo(p).quantity}</option>`).join('')}</select></div><div class="field"><label>取得為</label><select id="acqRole"><option value="main">主職業</option><option value="sub">副職業</option></select></div><div id="acqInfo" class="card pad"></div><div id="acqError" class="error"></div>`;
  const refresh=()=>{const p=professionById($('#acqProfession').value);if(!p)return;const book=professionBookInfo(p);const have=normalizedInventory(character.inventory).filter(i=>i.name.toLocaleLowerCase()===book.name.toLocaleLowerCase()).reduce((a,b)=>a+b.quantity,0);const role=$('#acqRole');const hasMain=Boolean(character.main_class&&character.main_class!=='未設定');const canMain=['main','both'].includes(p.category)&&!hasMain;const canSub=['sub','both'].includes(p.category)&&(character.sub_classes||[]).length<3;role.innerHTML=`${canMain?'<option value="main">主職業</option>':''}${canSub?'<option value="sub">副職業</option>':''}`;$('#acqInfo').innerHTML=`<b>${esc(p.name)}</b><div class="muted">${esc(p.description||'')}</div><div class="section">需要：<b>${esc(book.name)} ×${book.quantity}</b> · 目前持有 ${have}</div>${!canMain&&hasMain?'<div class="muted">你已有主職業，不能自行替換。</div>':''}${!canMain&&!canSub?'<div class="danger-text">目前沒有可放置的位置。</div>':''}`;};
  $('#acqProfession').onchange=refresh;refresh();$('#modal').classList.remove('hidden');$('#modalCancel').onclick=closeModal;$('#modalOk').onclick=async()=>{try{if(!$('#acqRole').value)throw new Error('目前沒有可放置這個職業的位置');const data=await api('/api/character/professions/acquire',{method:'POST',body:JSON.stringify({profession_id:Number($('#acqProfession').value),role:$('#acqRole').value})});state.myCharacter=data.character;await Promise.all([loadMyCharacter(),loadJournal()]);closeModal();render();toast(`已取得職業：${data.profession?.name||''}`);}catch(error){$('#acqError').textContent=error.message;}};
}

function openSkillPicker(){

  if(!skills.length){toast('目前沒有可直接學習的技能。技能必須由 DM 設定學習代價，或透過職業／任務取得。');return;}

  $('#pickSkillCategory').onchange=refresh;refresh();$('#modal').classList.remove('hidden');$('#modalCancel').onclick=closeModal;$('#modalOk').onclick=async()=>{try{const templateId=Number($('#pickSkill').value);if(!templateId)throw new Error('請選擇技能');const data=await api('/api/character/skills/from-template',{method:'POST',body:JSON.stringify({template_id:templateId})});state.myCharacter=data.character;closeModal();render();toast('技能已取得，學習代價已扣除');}catch(error){$('#pickSkillError').textContent=error.message;}};
